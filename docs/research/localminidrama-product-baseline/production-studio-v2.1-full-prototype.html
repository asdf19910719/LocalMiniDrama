    .post-status.blocked{color:var(--warn)}button:disabled{opacity:.45;cursor:not-allowed}.review-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}.review-panel{grid-column:span 4;padding:17px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.review-panel.wide{grid-column:span 8}.review-panel.full{grid-column:1/-1}.review-panel h2,.review-panel h3{margin-top:0}.review-panel p{color:var(--muted)}.review-list{display:grid;gap:8px}.review-item{display:flex;align-items:flex-start;gap:10px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}.review-item>div{flex:1}.review-item b,.review-item small{display:block}.review-item small{color:var(--muted)}.review-item button{white-space:nowrap}.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}.metric{padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}.metric small,.metric b{display:block}.metric small{color:var(--muted)}.metric b{margin-top:4px}.script-grid{display:grid;grid-template-columns:250px minmax(420px,1fr) 320px;gap:10px;min-height:0}.script-scene{display:block;width:100%;padding:11px;margin-bottom:7px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);text-align:left;cursor:pointer}.script-scene.active{border-color:var(--accent2)}.script-scene b,.script-scene small{display:block}.script-scene small{color:var(--muted)}.script-editor{width:calc(100% - 24px);min-height:430px;margin:12px;padding:16px;border:1px solid var(--line);border-radius:11px;background:#0e1118;color:var(--text);line-height:1.8;resize:vertical}.asset-requirement{padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}.asset-requirement+.asset-requirement{margin-top:8px}.asset-requirement-head{display:flex;gap:10px}.asset-requirement-head b{flex:1}.asset-requirement-row{display:grid;grid-template-columns:minmax(180px,1fr) 90px 90px auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.asset-requirement-row small{color:var(--muted)}.provider-card,.library-card,.recipe-card,.canvas-node{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}.provider-card h3,.library-card h3,.recipe-card h3{margin:0}.provider-card p,.library-card p,.recipe-card p{margin:5px 0;color:var(--muted)}.provider-grid,.library-grid,.recipe-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.canvas-stage{position:relative;min-height:430px;border:1px solid var(--line);border-radius:14px;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px;overflow:auto}.canvas-node{position:absolute;width:210px;box-shadow:var(--shadow);cursor:pointer}.canvas-node:nth-child(1){left:40px;top:55px}.canvas-node:nth-child(2){left:310px;top:55px}.canvas-node:nth-child(3){left:175px;top:205px}.canvas-node:nth-child(4){left:450px;top:240px}.settings-tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}.settings-tabs button{padding:10px 13px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);cursor:pointer}.settings-tabs button.active{border-bottom-color:var(--accent2);color:var(--text)}@media(max-width:1120px){.script-grid{grid-template-columns:1fr}.review-panel,.review-panel.wide{grid-column:1/-1}.asset-requirement-row{grid-template-columns:1fr 80px 80px}.asset-requirement-row button{grid-column:1/-1}}

</head>
<body>
  <div class="app">
    <nav class="rail" aria-label="全局产品导航">
      <div class="brand" aria-label="LocalMiniDrama">LM</div>
      <button class="nav-route" data-route-id="projects" title="项目"><span class="glyph">▦</span><small>项目</small></button>
      <button class="nav-route" data-route-id="library" title="资产库"><span class="glyph">◇</span><small>资产库</small></button>
      <button class="nav-route" data-route-id="quick-create" title="快速创作"><span class="glyph">✦</span><small>创作</small></button>
      <button class="nav-route" data-route-id="canvas" title="高级画布"><span class="glyph">⌘</span><small>画布</small></button>
      <div class="push"></div>
      <button class="nav-route" data-route-id="settings-ai" title="设置"><span class="glyph">⚙</span><small>设置</small></button>
    </nav>
    <section class="workspace">
      <header class="topbar">
        <div class="crumbs"><strong>本地短剧</strong><span id="crumb">/ 项目</span></div>
        <div class="spacer"></div>
        <span class="tag ok">● 本地优先</span>
        <button class="icon-btn prototype-tool" id="coverageButton" title="功能覆盖" aria-label="打开功能覆盖导航器">52</button>
        <button class="icon-btn prototype-tool" id="scenarioButton" title="场景切换" aria-label="打开场景切换器">◈</button>
        <button class="icon-btn" id="taskButton" title="全局任务" aria-label="打开全局任务"><span>↻</span><span class="badge">4</span></button>
        <button class="icon-btn" id="themeButton" title="切换主题" aria-label="切换主题">◐</button>
      </header>
      <main class="main"><div id="prototypePage"></div></main>
    </section>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop" aria-hidden="true">
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <div class="drawer-head"><h2 id="drawerTitle">原型工具</h2><button class="icon-btn" id="closeDrawer" aria-label="关闭">×</button></div>
      <div id="drawerBody"></div>
    </aside>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./production-studio-v2.1-project-hub-prototype-model.js"></script>
  <script src="./production-studio-v2.1-prototype-model.js"></script>
  <script src="./production-studio-v2.1-full-prototype-model.js"></script>
  <script>
    const fullModel = window.ProductionStudioV21FullPrototypeModel;
    const hubModel = window.ProductionStudioV21ProjectHubModel;
    const pageRoot = document.getElementById('prototypePage');
    const drawerBackdrop = document.getElementById('drawerBackdrop');
    const drawerTitle = document.getElementById('drawerTitle');
    const drawerBody = document.getElementById('drawerBody');
    const stageNames = {script:'剧本',assets:'设定',storyboard:'分镜',cut:'短片'};
    const routeLabels = {
      projects:'项目列表','project-new':'新建项目','project-import':'导入项目归档','project-overview':'项目概览',
      'project-bible':'项目设定','project-episodes':'项目剧集','project-assets':'项目资产',
      'studio-script':'剧本阶段','studio-assets':'设定阶段','studio-storyboard':'分镜阶段','studio-cut':'短片阶段',
      library:'本地个人资产库','quick-create':'快速创作','canvas':'高级画布','settings-ai':'AI 配置','settings-general':'常规设置','settings-data':'高级数据工具'
    };
    const projectViewStorageKey = 'production-studio-v2.1-project-view';
    const assetViewStorageKey = 'production-studio-v2.1-asset-view';
    let projectViewMode = fullModel.normalizeProjectListViewMode(readProjectViewMode());
    let assetViewMode = (() => { try { return localStorage.getItem(assetViewStorageKey) === 'list' ? 'list' : 'card'; } catch { return 'card'; } })();
    let activeProjectAssetDetail = null;
    let assetListState = { query:'', filters:{}, sortId:'updated-desc' };
    let episodeUiState = { query:'', sortId:'number-asc', importStep:1, targetMode:'create_new', assetConflictResolved:false, importProtocol:'episode-package' };
    let storyboardUiState = { visualMode:'storyboard-image', promptMode:'basic', previewImageId:'image-b', currentImageId:'image-b', previewVideoId:'video-a', adoptedVideoId:'video-a' };
    let cutUiState = { activeTab:'review', selectedShotId:'shot-03' };

    function readAssetListStateFromLocation() {
      const query = new URLSearchParams((location.hash.split('?')[1] || ''));
      const filters = {};
      for (const id of ['status','usage','source','media','episode','issue','level']) {
        if (query.get(id)) filters[id] = query.get(id);
      }
      return { query:query.get('q') || '', filters, sortId:query.get('sort') || 'updated-desc' };
    }

    function updateAssetLocation(projectId, patch = {}) {
      const next = { ...assetListState, ...patch, filters:{ ...assetListState.filters, ...(patch.filters || {}) } };
      assetListState = next;
      const query = new URLSearchParams();
      const parsed = fullModel.parsePrototypeLocation(location.hash);
      if (parsed.scenarioId !== 'default') query.set('scenario', parsed.scenarioId);
      const activeType = next.filters.type || '';
      if (activeType) query.set('focus', activeType);
      if (next.query) query.set('q', next.query);
      if (next.sortId && next.sortId !== 'updated-desc') query.set('sort', next.sortId);
      for (const [key,value] of Object.entries(next.filters)) {
        if (key !== 'type' && value) query.set(key, value);
      }
      location.hash = `#/projects/${projectId}/assets${query.toString() ? `?${query}` : ''}`;
    }

    function readProjectViewMode() {
      try { return localStorage.getItem(projectViewStorageKey); } catch { return 'card'; }
    }

    function saveProjectViewMode(mode) {
      projectViewMode = fullModel.normalizeProjectListViewMode(mode);
      try { localStorage.setItem(projectViewStorageKey, projectViewMode); } catch {}
    }

    function saveAssetViewMode(mode) {
      assetViewMode = mode === 'list' ? 'list' : 'card';
      try { localStorage.setItem(assetViewStorageKey, assetViewMode); } catch {}
    }

    function navigate(routeId, params = {}, scenarioId = 'default') {
      location.hash = fullModel.formatPrototypeLocation(routeId, params, scenarioId);
    }

    function renderProjectTabs(projectId, activeRouteId) {
      const tabs = fullModel.getProjectSectionNavigation(projectId).map(item => item.id === activeRouteId
        ? `<button class="active" aria-current="page">${item.label}</button>`
        : `<button data-route-id="${item.id}" data-project-route="${projectId}">${item.label}</button>`).join('');
      return `<nav class="project-tabs" aria-label="项目详情分区">${tabs}<button class="project-menu-button" data-project-menu="${projectId}" aria-label="打开项目操作">••• 项目操作</button></nav>`;
    }

    function projectCard(project, index) {
      const stages = Object.entries(project.stages).map(([key,value]) => {
        const cls = value.status === 'approved' ? 'done' : (value.status === 'ready_for_review' ? 'warn' : '');
        return `<div class="stage ${cls}"><small>${stageNames[key]} · ${value.summary}</small><b>${value.label}</b></div>`;
      }).join('');
      return `<article class="project-card" data-project-id="${project.id}" data-project-open="${project.id}" tabindex="0" aria-label="打开项目 ${project.title} 的概览">
        <div class="cover ${index ? 'alt' : ''}"><div class="badges"><span class="tag">${project.episodeCount} 集</span>${project.runningTasks?'<span class="tag">● 1 个任务运行中</span>':''}${project.blockers?'<span class="tag warn">阻塞 1</span>':''}${project.staleCount?'<span class="tag warn">已过期 1</span>':''}</div></div>
        <div class="project-body"><div class="title-line"><h2>${project.title}</h2><time>${project.updatedAt}</time></div><p class="recent">最近：${project.latestEpisode}</p><div class="stages">${stages}</div></div>
        <div class="project-foot"><span class="status">本地项目</span><button class="btn primary" data-project-continue="${project.id}" data-episode-id="${project.continueEpisodeId}" data-stage="${project.continueStage}">继续${stageNames[project.continueStage]}</button></div>
      </article>`;
    }

    function renderProjects(scenarioId) {
      const projects = hubModel.buildProjectCards();
      if (scenarioId === 'loading') return `<section class="page"><div class="page-head"><div><h1>项目</h1><p>正在读取本地项目索引。</p></div></div><div class="projects"><div class="skeleton"></div><div class="skeleton"></div></div></section>`;
      if (scenarioId === 'empty') return `<section class="page"><div class="page-head"><div><h1>项目</h1><p>从一个故事想法、文本、视频或制作包开始。</p></div></div><div class="empty"><div><div class="empty-mark">◇</div><h2>还没有项目</h2><p>创建项目不会立即调用 AI 或产生远端费用。</p><button class="btn primary" data-route-id="project-new">创建第一个项目</button></div></div></section>`;
      const banner = scenarioId === 'offline' ? '<div class="banner"><b>当前离线</b><span>本地项目仍可编辑；远端生成动作会进入“需要处理”。</span></div>' : '';
      const noResults = scenarioId === 'no-results';
      return `<section class="page" data-feature-id="P-01">
        <div class="page-head"><div><h1 tabindex="-1">项目</h1><p>继续最近工作，或从想法、剧本、视频和制作包开始新项目。</p></div><div class="actions"><button class="btn" data-route-id="project-import" data-feature-id="P-04">导入项目归档</button><button class="btn primary" data-route-id="project-new">＋ 新建项目</button></div></div>
        ${banner}
        <div class="toolbar"><input class="search" id="projectSearch" aria-label="搜索项目或剧集" placeholder="搜索项目或剧集"><button class="btn" id="sortButton">最近更新⌄</button><button class="btn" id="statusFilter">全部状态⌄</button><div class="spacer"></div><div class="segmented" role="group" aria-label="项目视图"><button class="${projectViewMode==='card'?'active':''}" data-project-view="card" aria-pressed="${projectViewMode==='card'}">卡片</button><button class="${projectViewMode==='list'?'active':''}" data-project-view="list" aria-pressed="${projectViewMode==='list'}">列表</button></div></div>
        <div id="projectResults">${noResults?'<div class="empty"><div><div class="empty-mark">⌕</div><h2>没有匹配项目</h2><p>清除搜索或调整状态筛选后重试。</p><button class="btn" id="clearSearch">清除条件</button></div></div>':`<div class="projects ${projectViewMode==='list'?'list-view':''}">${projects.map(projectCard).join('')}</div>`}</div>
      </section>`;
    }

    function renderProjectOverview(projectId, scenarioId) {
      if (scenarioId === 'loading') return `<section class="page"><div class="skeleton"></div><div class="overview-grid" style="margin-top:16px"><div class="skeleton"></div><div class="skeleton"></div></div></section>`;
      const project = fullModel.getProjectOverviewModel(projectId, scenarioId);
      const data = project.sections;
      const stages = data.stages.map(item => `<button class="overview-stage" data-tone="${item.tone}" data-project-stage-summary="${item.id}" data-project-id="${project.projectId}" aria-label="查看${item.label}阶段的剧集"><span>${item.label}</span><b>${item.state}</b><small>${item.summary}</small></button>`).join('');
      const blockers = data.blockers.length ? data.blockers.map(item => `<div class="blocker"><span class="tag" style="color:var(--warn)">${item.type}</span><div class="grow"><b>${item.title}</b><small>${item.detail}</small></div><button class="btn" data-overview-blocker-id="${item.id}" data-project-id="${project.projectId}">${item.action}</button></div>`).join('') : '<div class="tool-note">当前没有全局阻塞。</div>';
      return `<section class="page" data-feature-id="P-01">
        <div class="overview-hero"><div class="overview-cover" aria-hidden="true"></div><div><h1 tabindex="-1">${project.title}</h1><p>${project.description}</p><div class="overview-meta">${project.metadata.map(item=>`<span class="tag">${item}</span>`).join('')}</div></div><div class="overview-actions"><button class="btn" data-route-id="projects">返回项目</button></div></div>
        ${renderProjectTabs(project.projectId, 'project-overview')}
        <div class="overview-grid">
          <article class="overview-panel wide"><h2>下一步</h2><div class="next-card"><span class="tag">最近工作</span><div class="grow"><b>${data.nextAction.label}</b><small>${data.nextAction.detail}</small></div><button class="btn primary" data-project-continue="${project.projectId}" data-episode-id="${data.nextAction.episodeId}" data-stage="${data.nextAction.stage}">继续</button></div></article>
          <article class="overview-panel wide"><h2>四阶段状态</h2><div class="overview-stages">${stages}</div></article>
          <article class="overview-panel"><h2>Project Look</h2><div class="look-card"><div class="look-swatch"></div><div><b>${data.projectLook.name}</b><p>Look v${data.projectLook.version} · ${data.projectLook.status}</p><p>${data.projectLook.aspectRatio} · ${data.projectLook.usage}</p><button class="btn" data-project-look="${project.projectId}">查看 Look</button></div></div></article>
          <article class="overview-panel"><h2>待处理 ${data.blockers.length}</h2>${blockers}</article>
        </div>
      </section>`;
    }

    function renderProjectEpisodes(projectId, scenarioId) {
      const model = fullModel.getProjectEpisodesModel(projectId, scenarioId);
      const stageLabels = { script:'剧本', assets:'设定', storyboard:'分镜', cut:'短片' };
      let rows = model.visibleRows.filter(item => `${item.number} ${item.title} ${item.recentPosition || ''}`.toLowerCase().includes(episodeUiState.query.trim().toLowerCase()));
      rows = [...rows].sort((a,b)=>episodeUiState.sortId==='updated-desc' ? (b.number-a.number) : (a.number-b.number));
      const scenario = model.scenario ? `<div class="stage-scenario ${model.scenario.kind}"><span class="tag">${model.scenario.kind==='blocking'?'阻断':model.scenario.kind==='success'?'完成':model.scenario.kind==='recoverable-error'?'可恢复':'流程提示'}</span><div><b>${model.scenario.title}</b><small>${model.scenario.detail}</small></div><div class="actions">${model.scenario.actions.map(item=>`<button class="btn" data-episode-scenario-action="${item.id}">${item.label}</button>`).join('')}</div></div>` : '';
      const filters = model.stageFilters.map(item=>`<button class="episode-filter ${(item.id==='all'&&!model.activeStageFilter)||item.id===model.activeStageFilter?'active':''}" data-episode-filter="${item.id}" data-project-id="${model.projectId}">${item.label}</button>`).join('');
      const episodeRows = rows.map(item=>{
        const stages = Object.entries(item.stages).map(([stage,value])=>`<button class="episode-stage" data-status="${value.status}" data-episode-stage="${stage}" data-episode-id="${item.episodeId}" data-project-id="${model.projectId}" aria-label="打开第 ${item.number} 集${stageLabels[stage]}"><small>${stageLabels[stage]}</small><b>${value.label}</b></button>`).join('');
        const source = item.importSource ? `<button class="source-pill" data-episode-source="${item.episodeId}">外部来源 ${item.importSource.schemaVersion}</button>` : '';
        return `<article class="episode-row" data-episode-row="${item.episodeId}"><div class="episode-number">E${String(item.number).padStart(2,'0')}</div><div class="episode-main"><h2>${item.title} ${source}</h2><p>${item.durationTarget?`目标 ${item.durationTarget} · `:''}${item.recentPosition?`上次位于 ${item.recentPosition}`:'空白剧集，可手工编辑或选择其他来源'}${item.blockers?` · ${item.blockers} 项待处理`:''}</p></div><div class="episode-stages">${stages}</div><div class="episode-actions"><button class="btn" data-episode-menu="${item.episodeId}" aria-label="第 ${item.number} 集更多操作">•••</button><button class="btn ${item.isBlank?'':'primary'}" data-episode-resume="${item.episodeId}" data-project-id="${model.projectId}">${item.nextAction}</button></div></article>`;
      }).join('');
      const empty = `<div class="empty"><div><div class="empty-mark">◇</div><h2>${episodeUiState.query?'没有匹配剧集':'还没有剧集'}</h2><p>${episodeUiState.query?'清除搜索或切换阶段筛选。':'从六类来源创建首集；不会自动调用 AI。'}</p><button class="btn primary" data-episode-open-sources="${model.projectId}">${episodeUiState.query?'清除条件':'新建 / 导入剧集'}</button></div></div>`;
      return `<section class="page" data-feature-id="EPISODES-001"><div class="overview-hero"><div class="overview-cover" aria-hidden="true"></div><div><h1 tabindex="-1">${model.title}</h1><p>${model.description}</p><div class="overview-meta">${model.metadata.map(item=>`<span class="tag">${item}</span>`).join('')}</div></div><div class="overview-actions"><button class="btn" data-route-id="projects">返回项目</button></div></div>${renderProjectTabs(model.projectId,'project-episodes')}${scenario}<div class="episode-stats"><div class="episode-stat"><small>剧集</small><b>${model.stats.total}</b></div><div class="episode-stat"><small>正在制作</small><b>${model.stats.active}</b></div><div class="episode-stat"><small>需要处理</small><b>${model.stats.needsAttention}</b></div><div class="episode-stat"><small>外部来源</small><b>${model.stats.externalSources}</b></div></div><div class="episode-toolbar"><input class="search" data-episode-search value="${episodeUiState.query}" placeholder="搜索集号、标题或工作位置" aria-label="搜索剧集"><div class="episode-filters">${filters}</div><div class="spacer"></div><select class="btn" data-episode-sort aria-label="剧集排序"><option value="number-asc" ${episodeUiState.sortId==='number-asc'?'selected':''}>集号升序</option><option value="updated-desc" ${episodeUiState.sortId==='updated-desc'?'selected':''}>最近工作</option></select><button class="btn" data-episode-reorder="${model.projectId}">排序与管理</button><button class="btn primary" data-episode-open-sources="${model.projectId}">＋ 新建 / 导入剧集</button></div><div class="episode-list">${episodeRows || empty}</div><div class="tool-note" style="margin-top:14px">当前展示 3 个交互样例，共 ${model.stats.total} 集。剧集级导入只创建结构化草稿，不自动生成图片、视频或音频。</div></section>`;
    }

    function openEpisodeSourceDrawer(projectId, focusEpisodeId = '') {
      const model = fullModel.getProjectEpisodesModel(projectId,'default');
      const targetNote = focusEpisodeId ? `目标：空白第 ${focusEpisodeId} 集；也可以改为创建新剧集。` : '先选择来源，再确认创建新剧集或填充空白剧集。';
      openDrawer('新建 / 导入剧集', `<div class="tool-note"><b>${targetNote}</b><br>六类来源使用同一目标保护规则；非空剧集不允许合并、覆盖或追加。</div><div class="source-grid" style="margin-top:12px">${model.creationSources.map(item=>`<button class="source-card" data-episode-source-choice="${item.id}"><b>${item.title}</b><small>${item.description}</small></button>`).join('')}</div><div class="tool-note" style="margin-top:12px">任何来源都不会因为打开选择器而创建任务或写入项目。</div>`);
      drawerBody.querySelectorAll('[data-episode-source-choice]').forEach(button=>button.addEventListener('click',()=>openEpisodeCreationSource(projectId,button.dataset.episodeSourceChoice,focusEpisodeId)));
    }

    function openEpisodeCreationSource(projectId, sourceId, focusEpisodeId = '') {
      const flow = fullModel.getEpisodeCreationFlow(sourceId);
      const steps = `<div class="drawer-step">${flow.steps.map((item,index)=>`<span class="${index===0?'active':''}">${index+1} ${item}</span>`).join('')}</div>`;
      const back = `<button class="btn" data-source-back>返回来源</button>`;
      if(sourceId==='blank'){
        openDrawer('空白手工', `${steps}<form class="settings-form" data-blank-episode-form><label>写入目标<select name="target"><option value="create_new">创建新剧集</option><option value="fill_blank" ${focusEpisodeId?'selected':''}>填充空白第 3 集</option></select></label><label>集号<input value="${focusEpisodeId||'9'}"></label><label>标题<input value="未命名"></label><label>目标时长<input value="90 秒"></label><div class="tool-note">只创建空白剧本草稿，不调用 AI、不解析资产、不确认阶段。</div><div class="drawer-actions">${back}<button class="btn primary" type="submit">创建并进入剧本</button></div></form>`);
        drawerBody.querySelector('[data-source-back]').addEventListener('click',()=>openEpisodeSourceDrawer(projectId,focusEpisodeId));
        drawerBody.querySelector('[data-blank-episode-form]').addEventListener('submit',event=>{event.preventDefault();closeDrawer();navigate('project-episodes',{projectId},'blank-manual')});return;
      }
      if(sourceId==='ai'){
        openDrawer('想法 / 剧本 AI', `${steps}<form class="settings-form" data-ai-script-form><label>故事想法或剧本初稿<textarea>凌晨两点，酒店前台接到来自不存在楼层的客房服务电话……</textarea></label><label>生成范围<select><option>只生成本集剧本草稿</option><option>生成 3 集草稿</option></select></label><label>模型与预计费用<input value="文本模型 · ${flow.estimatedCost}" readonly></label><div class="tool-note">结果逐集保存为草稿；不自动解析资产、不确认剧本、不启动媒体生成。</div><div class="drawer-actions">${back}<button class="btn primary" type="submit">确认费用并生成草稿</button></div></form>`);
        drawerBody.querySelector('[data-source-back]').addEventListener('click',()=>openEpisodeSourceDrawer(projectId,focusEpisodeId));
        drawerBody.querySelector('[data-ai-script-form]').addEventListener('submit',event=>{event.preventDefault();closeDrawer();navigate('project-episodes',{projectId},'ai-script')});return;
      }
      if(sourceId==='novel'){
        openDrawer('小说 / 长文本', `${steps}<div class="settings-form"><label>内容来源<select><option>选择 TXT / DOCX / Markdown 文件</option><option>粘贴长文本</option></select></label><label>拆集策略<select><option>按剧情转折建议</option><option>按章节</option><option>指定 8 集</option></select></label></div><div class="tool-note">先解析并预览章节、建议集数、标题和编号冲突；确认前零写入。</div><div class="drawer-actions">${back}<button class="btn primary" data-novel-preview>解析并预览拆集</button></div>`);
        drawerBody.querySelector('[data-source-back]').addEventListener('click',()=>openEpisodeSourceDrawer(projectId,focusEpisodeId));
        drawerBody.querySelector('[data-novel-preview]').addEventListener('click',()=>{closeDrawer();navigate('project-episodes',{projectId},'novel-split')});return;
      }
      if(sourceId==='external_ai'){openExternalAiWorkflow(projectId,'context',focusEpisodeId);return;}
      if(sourceId==='episode_json'){
        episodeUiState.importProtocol='episode-package';episodeUiState.targetMode=focusEpisodeId?'fill_blank':'create_new';episodeUiState.assetConflictResolved=false;openEpisodeImportWizard(projectId,1,{focusEpisodeId});return;
      }
      if(sourceId==='source_video'){
        openDrawer('已有视频', `${steps}<div class="settings-form"><label>来源文件<input value="episode-03-source.mp4" readonly></label><label>媒体信息<input value="1920×1080 · 03:24 · H.264 · 186 MB" readonly></label><label>写入目标<select><option>创建新剧集</option><option ${focusEpisodeId?'selected':''}>填充空白第 3 集</option></select></label></div><div class="tool-note">登记原始媒体、hash 和来源路径；不复制大文件、不生成镜头、不调用远端 Provider。进入短片后可手工切分时间线。</div><div class="drawer-actions">${back}<button class="btn primary" data-source-video-confirm>登记来源并进入短片</button></div>`);
        drawerBody.querySelector('[data-source-back]').addEventListener('click',()=>openEpisodeSourceDrawer(projectId,focusEpisodeId));
        drawerBody.querySelector('[data-source-video-confirm]').addEventListener('click',()=>{closeDrawer();navigate('project-episodes',{projectId},'source-video')});
      }
    }

    function openExternalAiWorkflow(projectId, phase='context', focusEpisodeId='') {
      const flow = fullModel.getEpisodeCreationFlow('external_ai');
      const steps = `<div class="drawer-step">${flow.steps.map((item,index)=>`<span class="${(phase==='context'&&index===0)||(phase==='package'&&index===1)?'active':''}">${index+1} ${item}</span>`).join('')}</div>`;
      if(phase==='package'){
        openDrawer('外部 AI · 本集任务包', `${steps}<div class="tool-note"><b>同一个任务，两种等价载体</b><br>ZIP 和单文件任务 JSON 使用相同 package_id 与 assets_digest，不形成两套协议。</div><div class="feature-line"><span>package_id</span><b>${flow.package.packageId}</b></div><div class="feature-line"><span>assets_digest</span><b>${flow.package.assetsDigest}</b></div><div class="feature-line"><span>冻结内容</span><b>任务说明 · 当前项目资产 · 返回 Schema</b></div>${flow.package.downloadFormats.map(item=>`<div class="feature-line"><span>${item}</span><button class="btn" data-external-download="${item}">下载</button></div>`).join('')}<div class="mini-actions"><button data-external-copy="prompt">复制任务说明</button><button data-external-copy="context">复制创作上下文</button></div><div class="tool-note" style="margin-top:12px">创建任务包不会调用外部 AI。用户自行在外部会话讨论，确认结果后回到这里选择 JSON。</div><div class="drawer-actions"><button class="btn" data-external-back>返回上下文</button><button class="btn primary" data-external-wait>任务包已带走，等待结果</button></div>`);
        drawerBody.querySelectorAll('[data-external-download]').forEach(button=>button.addEventListener('click',()=>showToast(`${button.dataset.externalDownload} 已准备；原型未写入磁盘`)));
        drawerBody.querySelectorAll('[data-external-copy]').forEach(button=>button.addEventListener('click',()=>showToast(button.dataset.externalCopy==='prompt'?'任务说明已复制':'创作上下文已复制')));
        drawerBody.querySelector('[data-external-back]').addEventListener('click',()=>openExternalAiWorkflow(projectId,'context',focusEpisodeId));
        drawerBody.querySelector('[data-external-wait]').addEventListener('click',()=>{closeDrawer();navigate('project-episodes',{projectId,focusId:focusEpisodeId||'3'},'external-ai-waiting')});return;
      }
      const bible=fullModel.getProjectBibleModel(projectId,'default');
      openDrawer('外部 AI · 生成创作上下文', `${steps}<div class="tool-note"><b>用于新的外部 AI 会话</b><br>只提供剧情创作上下文，不直接进入生图或视频 Prompt。</div><div class="settings-form"><label>目标<select><option>${focusEpisodeId?`填充空白第 ${focusEpisodeId} 集`:'创建新剧集'}</option></select></label><label>上下文摘要<textarea readonly>${bible.context.summary}</textarea></label></div><h3>包含的信息</h3><div>${bible.context.includedSources.map(item=>`<span class="asset-chip">${item}</span>`).join('')}</div><div class="drawer-actions"><button class="btn" data-external-source-back>返回来源</button><button class="btn" data-external-context-copy>复制上下文</button><button class="btn primary" data-external-package-next>继续创建本集任务包</button></div>`);
      drawerBody.querySelector('[data-external-source-back]').addEventListener('click',()=>openEpisodeSourceDrawer(projectId,focusEpisodeId));
      drawerBody.querySelector('[data-external-context-copy]').addEventListener('click',()=>showToast('创作上下文已复制'));
      drawerBody.querySelector('[data-external-package-next]').addEventListener('click',()=>openExternalAiWorkflow(projectId,'package',focusEpisodeId));
    }

    function openEpisodeImportWizard(projectId, step=1, {focusEpisodeId='', protocol=episodeUiState.importProtocol}={}) {
      episodeUiState.importStep=step;episodeUiState.importProtocol=protocol;
      const model=fullModel.getEpisodePackageImportModel(step,{targetMode:episodeUiState.targetMode,assetConflictResolved:episodeUiState.assetConflictResolved,protocol});
      const progress=`<div class="drawer-step">${model.stepNames.map((item,index)=>`<span class="${index+1===step?'active':''}">${index+1} ${item}</span>`).join('')}</div>`;
      let content='';
      if(step===1){content=`<div class="tool-note"><b>${model.file.schema}@${model.file.version}</b><br>${model.file.name} · SHA-256 ${model.file.sha256}</div><div class="asset-option-list" style="margin-top:12px">${model.targets.map(item=>`<button class="batch-action ${episodeUiState.targetMode===item.id?'selected':''}" data-import-target="${item.id}" data-allowed="${item.allowed}"><b>${item.label}</b><small>${item.allowed?(item.id==='create_new'?'不影响已有剧集':'目标无剧本、分镜、媒体和导入记录'):`${item.code} · 只用于演示拒绝`}</small></button>`).join('')}</div><div class="tool-note" style="margin-top:12px">只允许创建新剧集或填充空白剧集；不支持合并、覆盖、追加。</div>`}
      else if(step===2){content=`<div class="batch-summary"><div class="asset-field"><small>剧集</small><b>第 ${model.episodeSummary.number} 集 · ${model.episodeSummary.title}</b></div><div class="asset-field"><small>文本</small><b>梗概 ${model.episodeSummary.synopsisLength} 字 · 剧本 ${model.episodeSummary.scriptLength} 字</b></div></div><h3>叙事场次</h3>${model.storyScenes.map((item,index)=>`<div class="feature-line"><span>场次 ${index+1}</span><b>${item}</b></div>`).join('')}<div class="tool-note">项目 Look 不由外部 JSON 覆盖。</div>`}
      else if(step===3){content=`${model.matches.map(item=>`<div class="import-match"><span>${item.type}</span><div><b>${item.source}</b><small>${item.result}</small></div>${item.decision?`<span class="tag ok">${item.decision==='reuse'?'复用':item.decision==='create'?'新建':'新建独立资产'}</span>`:'<button class="btn" data-resolve-import-match>选择处理</button>'}</div>`).join('')}${model.canAdvance?'':'<div class="settings-warning"><b>还有 1 个冲突未处理</b><div>同名不等于同一资产；未决定前不能进入下一步。</div></div>'}`}
      else if(step===4){content=`<div class="batch-summary"><div class="asset-field"><small>叙事场次</small><b>${model.structure.storySceneCount}</b></div><div class="asset-field"><small>分镜</small><b>${model.structure.shotCount}</b></div><div class="asset-field"><small>时段</small><b>${model.structure.segmentCount}</b></div><div class="asset-field"><small>计划时长</small><b>${model.structure.plannedDuration}</b></div></div>${model.validation.map(item=>`<div class="delivery-check"><span>${item}</span><span class="tag ok">通过</span></div>`).join('')}<div class="tool-note">外部结果不得写 Provider、模型、请求时长、Project Look 或最终提示词。</div>`}
      else{content=`<div class="batch-summary"><div class="asset-field"><small>写入目标</small><b>${model.targetMode==='fill_blank'?'填充空白第 3 集':'创建新剧集'}</b></div><div class="asset-field"><small>对象与结构</small><b>${model.summary.characters} 人物 · ${model.summary.scenes} 场景 · ${model.summary.props} 道具</b></div><div class="asset-field"><small>分镜与时段</small><b>${model.summary.shots} / ${model.summary.segments}</b></div><div class="asset-field"><small>远端费用 / 媒体任务</small><b>¥${model.remoteGenerationCost} / ${model.createdMediaTasks.length}</b></div></div><div class="tool-note"><b>单事务写入</b><br>提交前重新检查目标仍为空；任一步失败全部回滚，不留部分数据。</div>`}
      const nextLabel=step===5?'导入为结构化草稿':'下一步';
      openDrawer(`${protocol==='external-ai-result'?'外部 AI 结果':'单集制作包'} · ${model.stepTitle}`, `${progress}${content}<div class="drawer-actions"><button class="btn" data-import-cancel>${step===1?'返回来源':'取消'}</button>${step>1?'<button class="btn" data-import-previous>上一步</button>':''}<button class="btn primary" data-import-next ${model.canAdvance?'':'disabled'}>${nextLabel}</button></div>`);
      drawerBody.querySelectorAll('[data-import-target]').forEach(button=>button.addEventListener('click',()=>{if(button.dataset.allowed!=='true'){closeDrawer();navigate('project-episodes',{projectId},'json-target-not-blank');return;}episodeUiState.targetMode=button.dataset.importTarget;openEpisodeImportWizard(projectId,1,{focusEpisodeId,protocol})}));
      drawerBody.querySelector('[data-resolve-import-match]')?.addEventListener('click',()=>{episodeUiState.assetConflictResolved=true;openEpisodeImportWizard(projectId,3,{focusEpisodeId,protocol})});
      drawerBody.querySelector('[data-import-cancel]').addEventListener('click',()=>{if(step===1)openEpisodeSourceDrawer(projectId,focusEpisodeId);else closeDrawer()});
      drawerBody.querySelector('[data-import-previous]')?.addEventListener('click',()=>openEpisodeImportWizard(projectId,step-1,{focusEpisodeId,protocol}));
      drawerBody.querySelector('[data-import-next]').addEventListener('click',()=>{if(step<5)openEpisodeImportWizard(projectId,step+1,{focusEpisodeId,protocol});else{closeDrawer();navigate('project-episodes',{projectId},'import-succeeded')}});
    }

    function openEpisodeSourceAuditDrawer(projectId, episodeId, sectionId='raw') {
      let audit;
      try{audit=fullModel.getEpisodeSourceAuditModel(projectId,episodeId,sectionId)}catch(error){showToast('该剧集没有外部导入来源');return;}
      const tabs=audit.sections.map(item=>`<button class="batch-action ${item.id===audit.activeSection.id?'selected':''}" data-source-audit-section="${item.id}"><b>${item.label}</b><small>${item.description}</small></button>`).join('');
      const entries=audit.activeSection.entries.map(item=>`<div class="feature-line"><span>${item.label}</span><b>${item.value}</b></div>`).join('');
      openDrawer(`第 ${audit.episodeNumber} 集 · 外部来源`, `<div class="tool-note"><b>${audit.filename}</b><br>协议 ${audit.schemaVersion} · 只读且不可变；仅用于追溯本次导入。</div><div class="feature-line"><span>package_id</span><b>${audit.packageId}</b></div><div class="feature-line"><span>SHA-256</span><b>${audit.sha256}</b></div><div class="asset-option-list" style="margin-top:12px">${tabs}</div><h3 style="margin-top:16px">${audit.activeSection.label}</h3><p class="recent">${audit.activeSection.description}</p>${entries}<div class="tool-note" style="margin-top:12px">当前项目资产后续改名、换图或新增版本，都不会改写这份导入证据。</div>`);
      drawerBody.querySelectorAll('[data-source-audit-section]').forEach(button=>button.addEventListener('click',()=>openEpisodeSourceAuditDrawer(projectId,episodeId,button.dataset.sourceAuditSection)));
    }

    function openEpisodeMenuDrawer(projectId, episodeId) {
      const page=fullModel.getProjectEpisodesModel(projectId,'default');
      const row=page.rows.find(item=>item.episodeId===String(episodeId));
      openDrawer(`第 ${row.number} 集 · 更多操作`, `<div class="operation-list">${page.managementActions.map(item=>`<button class="operation-card" data-episode-menu-action="${item.id}" ${item.id==='view-source'&&!row.importSource?'disabled':''}><span><b>${item.label}</b><small>${item.id==='archive'?'移入可恢复归档，不物理删除':item.id==='duplicate-draft'?'复制结构为新草稿，不复制运行任务':item.id==='view-source'?'查看原始/规范化 JSON、hash 和报告':'保存后保留剧集历史'}</small></span><span>›</span></button>`).join('')}</div>`);
      drawerBody.querySelectorAll('[data-episode-menu-action]').forEach(button=>button.addEventListener('click',()=>{
        const action=button.dataset.episodeMenuAction;
        if(action==='view-source'){openEpisodeSourceAuditDrawer(projectId,episodeId);return;}
        if(action==='archive'){openDrawer('归档剧集',`<div class="settings-warning"><b>第 ${row.number} 集将移入归档</b><div>剧本、资产快照、分镜、候选和导入来源继续保留，可从归档筛选恢复。</div></div><div class="drawer-actions"><button class="btn" data-stage-drawer-action="cancel">取消</button><button class="btn primary" data-episode-archive-confirm>确认归档</button></div>`);drawerBody.querySelector('[data-episode-archive-confirm]').addEventListener('click',()=>{closeDrawer();showToast('剧集已归档，可从归档筛选恢复')});return;}

    function renderCharacterAssetDetail() {
      const detail = activeProjectAssetDetail;
      const activeState = detail.characterStates.find(item => item.id === detail.activeStateId) || detail.characterStates[0];
      const voice = detail.voiceProfile;
      const currentVoice = voice.candidates.find(item => item.id === voice.currentCandidateId) || voice.candidates[0] || null;
      const sectionIds = detail.sectionIds || ['overview', 'candidates', 'usage', 'records', 'advanced'];
      const activeSectionId = detail.activeSectionId || 'overview';
      const activeMedia = detail.activeCandidateMedia || 'image';
      const tabs = detail.sections.map((item, index) => `<button class="${sectionIds[index] === activeSectionId ? 'active' : ''}" data-asset-detail-section="${sectionIds[index]}" aria-selected="${sectionIds[index] === activeSectionId}">${item}</button>`).join('');
      const states = detail.characterStates.map(item => `<button class="character-state-card ${item.id === activeState.id ? 'active' : ''}" data-character-state="${item.id}" aria-pressed="${item.id === activeState.id}"><div class="state-thumb ${item.tone}" aria-label="${item.name}当前使用图"></div><b>${item.name}${item.isDefault ? ' · 默认' : ''}</b><small>${item.status}</small><small>${item.usage}</small></button>`).join('');
      const candidates = activeState.candidates.map(item => `<button class="candidate-card ${item.isCurrent ? 'current' : ''}" data-candidate-use="${item.id}" aria-pressed="${item.isCurrent}"><div class="candidate-preview ${item.tone}"></div><span class="candidate-status"><b>${item.label}</b>${item.isCurrent ? '<span class="tag ok">使用中</span>' : `<span class="tag">${detail.candidateActionLabel}</span>`}</span><small>${item.meta}</small></button>`).join('');
      const activeGenerationMode = detail.generationModes.find(item => item.id === activeState.generationModeId) || detail.generationModes[0];
      const activeGenerationChannel = detail.activeGenerationChannel || 'API';
      const generationChannelSelect = `<label>生成通道 <select data-character-generation-channel><option ${activeGenerationChannel === 'API' ? 'selected' : ''}>API</option><option ${activeGenerationChannel === 'ChatGPT 网页' ? 'selected' : ''}>ChatGPT 网页</option><option ${activeGenerationChannel === 'ComfyUI' ? 'selected' : ''}>ComfyUI</option></select></label><span class="tag">创建任务前显示模型、画幅与费用</span>`;
      const characterModes = detail.generationModes.map(item => `<button class="generation-mode ${item.id === activeGenerationMode.id ? 'active' : ''}" data-character-generation-mode="${item.id}" aria-pressed="${item.id === activeGenerationMode.id}"><b>${item.label}</b><small>${item.description}</small><span class="mode-output-list">${item.outputs.map(output => `<span class="tag">${output}</span>`).join('')}</span></button>`).join('');
      const candidateCompare = detail.compareOpen && activeState.candidates.length > 1 ? `<div class="candidate-compare"><div><div class="candidate-preview ${activeState.candidates[0].tone}"></div><b>${activeState.candidates[0].label}</b><small>${activeState.candidates[0].meta}</small></div><div><div class="candidate-preview ${activeState.candidates[1].tone}"></div><b>${activeState.candidates[1].label}</b><small>${activeState.candidates[1].meta}</small></div></div>` : '';

      } else if (activeSectionId === 'usage') {
        sectionContent = `<div class="look-detail-section"><h3>人物使用位置</h3><div class="usage-list">${detail.usageTargets.map(item => `<div class="usage-card"><div><b>${item.label}</b><small>人物形象和音色分别按本集实际音频策略保存版本快照。</small></div><button class="btn" data-asset-usage-route="${item.routeId}" data-project-id="${item.params.projectId}" data-episode-id="${item.params.episodeId}" data-focus-id="${item.params.focusId}">打开分镜</button></div>`).join('')}</div><div class="tool-note">缺少音色不会无条件阻塞。只有本集选择的音频策略明确需要该人物音色且当前音色缺失时，才阻断相关生成。</div></div>`;

        sectionContent = `<div class="look-detail-section"><h3>生成与处理记录</h3><div class="record-list">${detail.generationRecords.map(item => `<div class="record-card"><div><b>${item.kind} · ${item.status}</b><small>${item.source} · ${item.createdAt}</small></div><button class="btn" data-character-record="${item.id}">查看记录</button></div>`).join('')}</div></div>`;
      } else {

      drawerBody.querySelectorAll('[data-asset-detail-section]').forEach(button => button.addEventListener('click', () => {
        activeProjectAssetDetail = fullModel.setProjectAssetDetailSection(activeProjectAssetDetail, button.dataset.assetDetailSection);
        renderProjectAssetDetail();

      drawerBody.querySelectorAll('[data-character-state]').forEach(button => button.addEventListener('click', () => {
        activeProjectAssetDetail = { ...activeProjectAssetDetail, activeStateId: button.dataset.characterState };
        renderProjectAssetDetail();

      drawerBody.querySelector('[data-character-edit]')?.addEventListener('click', () => { activeProjectAssetDetail = { ...activeProjectAssetDetail, editingFields:true }; renderProjectAssetDetail(); });
      drawerBody.querySelector('[data-character-edit-cancel]')?.addEventListener('click', () => { activeProjectAssetDetail = { ...activeProjectAssetDetail, editingFields:false }; renderProjectAssetDetail(); });
      drawerBody.querySelector('#characterAssetEditForm')?.addEventListener('submit', event => {
        event.preventDefault();
        activeProjectAssetDetail = fullModel.saveProjectAssetFields(activeProjectAssetDetail, Object.fromEntries(new FormData(event.currentTarget)));
        activeProjectAssetDetail = { ...activeProjectAssetDetail, editingFields:false };
        renderProjectAssetDetail(); showToast('人物资料已保存；已有候选不会自动重新生成');

      drawerBody.querySelectorAll('[data-character-generation-mode]').forEach(button => button.addEventListener('click', () => {
        activeProjectAssetDetail = fullModel.setProjectAssetCharacterGenerationMode(activeProjectAssetDetail, activeState.id, button.dataset.characterGenerationMode);
        renderProjectAssetDetail();
      }));
      drawerBody.querySelector('[data-character-generation-channel]')?.addEventListener('change', event => {

        renderProjectAssetDetail();

      drawerBody.querySelector('[data-candidate-compare]')?.addEventListener('click', () => {
        activeProjectAssetDetail = { ...activeProjectAssetDetail, compareOpen:!activeProjectAssetDetail.compareOpen };
        renderProjectAssetDetail();
      });
      drawerBody.querySelector('[data-character-image-generate]')?.addEventListener('click', () => {
        const id = `candidate-character-${Date.now()}`;
        activeProjectAssetDetail = fullModel.addProjectAssetCharacterCandidate(activeProjectAssetDetail, activeState.id, {
          id, label:`候选 ${String.fromCharCode(65 + activeState.candidates.length)}`, meta:`${activeGenerationChannel} · ${activeGenerationMode.label} · 刚刚生成`, tone:'teal', source:activeGenerationChannel, status:'已完成',
        });
        renderProjectAssetDetail();
        showToast(`已创建${activeGenerationMode.label}任务；结果只进入${activeState.name}候选`);
      });
      drawerBody.querySelectorAll('[data-character-image-upload]').forEach(button => button.addEventListener('click', () => {
        const id = `candidate-character-upload-${Date.now()}`;
        activeProjectAssetDetail = fullModel.addProjectAssetCharacterCandidate(activeProjectAssetDetail, activeState.id, {
          id, label:`候选 ${String.fromCharCode(65 + activeState.candidates.length)}`, meta:'本地上传 · 待使用', tone:'amber', source:'本地上传', status:'已完成',
        });

        showToast(`上传结果已加入${activeState.name}候选，点击候选后才会使用`);

      drawerBody.querySelectorAll('[data-candidate-use]').forEach(button => button.addEventListener('click', () => {

      drawerBody.querySelectorAll('[data-character-media]').forEach(button => button.addEventListener('click', () => {

      drawerBody.querySelector('[data-manage-character-voice]')?.addEventListener('click', () => {

      drawerBody.querySelectorAll('[data-voice-source]').forEach(button => button.addEventListener('click', () => {
        const source = voice.sources.find(item => item.id === button.dataset.voiceSource);

        const samples = {
          upload:['新上传参考','本地上传','WAV',15,'可用'],
          'tts-preset':['清冷女声 07','TTS 预设','Provider voice id',12,'可用'],
          'personal-library':['夜班女声固定版','个人素材库 v3','WAV',20,'可用'],

    function escapePrototypeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' }[character]));
    }

    function renderStatefulAssetDetail() {
      const detail = activeProjectAssetDetail;
      const activeState = detail.productionStates.find(item => item.id === detail.activeStateId) || detail.productionStates[0];
      const activeView = activeState.views.find(item => item.id === detail.activeViewId) || activeState.views[0];
      const activeSectionId = detail.activeSectionId || 'overview';
      const sectionIds = detail.sectionIds || ['overview', 'candidates', 'usage', 'records', 'advanced'];
      const tabs = detail.sections.map((item, index) => `<button class="${sectionIds[index] === activeSectionId ? 'active' : ''}" data-asset-detail-section="${sectionIds[index]}" aria-selected="${sectionIds[index] === activeSectionId}">${item}</button>`).join('');
      const states = detail.productionStates.map(item => `<button class="character-state-card ${item.id === activeState.id ? 'active' : ''}" data-production-state="${item.id}" aria-pressed="${item.id === activeState.id}"><div class="state-thumb ${item.tone}" aria-label="${item.name}当前使用图"></div><b>${item.name}${item.isDefault ? ' · 默认' : ''}</b><small>${item.status}</small><small>${item.usage}</small></button>`).join('');
      const attributes = activeState.attributes.map(item => `<span class="tag">${item}</span>`).join('');
      const views = activeState.views.map(item => `<button class="asset-view-button ${item.id === activeView.id ? 'active' : ''}" data-production-view="${item.id}" aria-pressed="${item.id === activeView.id}"><b>${item.name}</b><small>${item.purpose}${item.candidates.length ? ` · ${item.candidates.length} 个候选` : ' · 待添加图片'}</small></button>`).join('');
      const candidates = activeView.candidates.length ? activeView.candidates.map(item => `<button class="candidate-card ${item.isCurrent ? 'current' : ''}" data-view-candidate-use="${item.id}" aria-pressed="${item.isCurrent}"><div class="candidate-preview ${item.tone}"></div><span class="candidate-status"><b>${item.label}</b>${item.isCurrent ? '<span class="tag ok">使用中</span>' : `<span class="tag">${detail.candidateActionLabel}</span>`}</span><small>${item.meta}</small></button>`).join('') : '<div class="asset-empty-inline" style="grid-column:1/-1">这个视图参考还没有图片。可以生成或上传候选。</div>';
      const fieldLabels = detail.assetKind === 'scene'
        ? [['location','地点'],['time','默认时间'],['weather','天气/环境'],['condition','剧情状态'],['atmosphere','空间与氛围']]
        : [['name','名称'],['propType','类型'],['storyPurpose','剧情用途'],['form','形制'],['material','材质'],['color','颜色']];
      const fields = fieldLabels.map(([key,label]) => `<div class="asset-field"><small>${label}</small><b>${escapePrototypeHtml(detail.fields[key])}</b></div>`).join('');
      const fieldEditor = `<form class="settings-form asset-inline-form" id="structuredAssetEditForm">${fieldLabels.map(([key,label]) => `<label>${label}<input name="${key}" value="${escapePrototypeHtml(detail.fields[key])}" required></label>`).join('')}<div class="drawer-actions"><button type="button" class="btn" data-asset-edit-cancel>取消</button><button type="submit" class="btn primary">保存资料</button></div></form>`;
      const references = (detail.referenceImages || []).map(item => `<div class="reference-card"><div class="reference-thumb ${item.tone}" aria-label="${item.name}缩略图"></div><div><b>${item.name}</b><small>${item.source} · 用途：${item.role}</small></div><div><button class="btn" data-reference-role="${item.id}">更换用途</button> <button class="btn" data-reference-remove="${item.id}">移除</button></div></div>`).join('') || '<div class="asset-empty-inline">还没有参考图。</div>';
      const referenceManager = `<div class="asset-inline-form"><h3>参考图管理</h3><p style="color:var(--muted)">参考图只约束生成，不是当前使用图；移除只解除引用，不删除原文件。</p><div class="reference-grid">${references}</div><div class="asset-action-row"><button class="btn" data-reference-add="upload">上传本地图片</button><button class="btn" data-reference-add="library">从资产库选择</button><button class="btn" data-reference-add="candidate">加入当前候选</button></div></div>`;
      const addViewForm = `<form class="settings-form asset-inline-form" id="assetViewForm"><label>视图名称<input name="name" placeholder="例如：入口方向" required></label><label>用途<input name="purpose" placeholder="例如：人物进场动线" required></label><div class="drawer-actions"><button type="button" class="btn" data-view-add-cancel>取消</button><button type="submit" class="btn primary">添加视图参考</button></div></form>`;
      const viewChooser = `<div class="look-detail-section"><h3>${activeState.name} · 视图参考</h3><div class="asset-view-strip">${views}</div><div class="tool-note"><b>${activeView.name}</b>用于${activeView.purpose}。视图参考可来自独立生成、四宫格拆分或上传，且不会创建新的剧情状态。</div><div class="asset-action-row"><button class="btn" data-view-add>＋ 新增视图参考</button></div>${detail.addingView ? addViewForm : ''}</div>`;
      const stateChooser = `<div class="look-detail-section"><h3>剧情状态</h3><div class="character-state-strip">${states}</div><div class="look-tags">${attributes}</div></div>`;
      const modeOptions = (detail.generationModes || []).map(item => `<button class="generation-mode ${item.id === detail.activeGenerationModeId ? 'active' : ''}" data-generation-mode="${item.id}" aria-pressed="${item.id === detail.activeGenerationModeId}"><b>${item.label}${item.implementation === 'new-v2.1' ? ' · V2.1 新增' : ''}</b><small>${item.description}</small><span class="mode-output-list">${item.outputs.map(output => `<span class="tag">${output}</span>`).join('')}</span></button>`).join('');
      const activeMode = detail.generationModes?.find(item => item.id === detail.activeGenerationModeId);
      const activeGenerationChannel = detail.activeGenerationChannel || 'API';

          productionStates: activeProjectAssetDetail.productionStates.map(state => state.id !== activeState.id ? state : { ...state, views:state.views.map(view => view.id !== activeView.id ? view : { ...view, candidates:[...view.candidates,{ id, label:`候选 ${String.fromCharCode(65 + view.candidates.length)}`, meta:`${activeGenerationChannel} · ${modeLabel} · 刚刚生成`, tone:'purple', isCurrent:false }] }) }),

        renderProjectAssetDetail();
        showToast(`已创建${modeLabel}任务；结果只进入候选`);
      });
      drawerBody.querySelector('[data-structured-asset-action="upload"]')?.addEventListener('click', () => {

      drawerBody.querySelectorAll('[data-asset-usage-route]').forEach(button => button.addEventListener('click', () => {closeDrawer();navigate(button.dataset.assetUsageRoute,{projectId:button.dataset.projectId,episodeId:button.dataset.episodeId,focusId:button.dataset.focusId})}));

    function renderProjectAssetDetail() {
      if (activeProjectAssetDetail.assetKind === 'character') renderCharacterAssetDetail();
      else renderStatefulAssetDetail();
    }

    function setAssetFocusInLocation(assetId = '') {
      if (currentLocation().routeId !== 'project-assets') return;
      const [path, queryText = ''] = location.hash.split('?');
      const query = new URLSearchParams(queryText);
      if (assetId) query.set('asset', assetId); else query.delete('asset');
      history.replaceState(null, '', `${path}${query.toString() ? `?${query}` : ''}`);
    }

    function openProjectAssetDetail(assetId, updateLocation = true) {
      if (!['character-linxia', 'character-manager', 'scene-corridor', 'scene-lobby', 'prop-keycard'].includes(assetId)) {
        openDrawer('资产详情', `<div class="tool-note">该资产详情使用与“林夏”相同的版本、候选、使用位置和生成记录结构。</div><div class="drawer-actions"><button class="btn primary" data-asset-detail-close>知道了</button></div>`);
        drawerBody.querySelector('[data-asset-detail-close]').addEventListener('click', closeDrawer);
        return;
      }
      activeProjectAssetDetail = fullModel.getProjectAssetDetailModel(assetId);
      if (updateLocation) setAssetFocusInLocation(assetId);
      renderProjectAssetDetail();
    }

    function openNewAssetDrawer(selectedType = '') {
      const assets = fullModel.getProjectAssetsModel('7');
      if (!selectedType) {
        openDrawer('新增资产 · 选择类型', `<div class="drawer-step"><span class="active">1 选择类型</span><span>2 填写资料</span></div><div class="asset-option-list">${assets.createTypes.map(item => `<button data-new-asset-type="${item.id}"><b>${item.label}</b><small>${item.id === 'character' ? '人物状态、形象候选和音色在详情中维护' : item.id === 'scene' ? '支持剧情状态、视图参考和多种场景生图模式' : '支持完整、使用中、损坏等剧情状态'}</small></button>`).join('')}</div><div class="tool-note" style="margin-top:12px">创建资产本身不会调用 AI 或产生费用。</div><div class="drawer-actions"><button class="btn primary" data-new-asset-next disabled>下一步</button></div>`);
        let choice = '';
        drawerBody.querySelectorAll('[data-new-asset-type]').forEach(button => button.addEventListener('click', () => {
          choice = button.dataset.newAssetType;
          drawerBody.querySelectorAll('[data-new-asset-type]').forEach(item => item.classList.toggle('selected', item === button));
          drawerBody.querySelector('[data-new-asset-next]').disabled = false;
        }));
        drawerBody.querySelector('[data-new-asset-next]').addEventListener('click', () => openNewAssetDrawer(choice));
        return;
      }
      const type = assets.createTypes.find(item => item.id === selectedType);
      const fieldDefinitions = {
        character:[['name','人物名称'],['role','角色定位'],['description','基础描述']],
        scene:[['name','场景名称'],['location','地点'],['time','默认时间'],['atmosphere','氛围描述']],
        prop:[['name','道具名称'],['propType','道具类型'],['storyPurpose','剧情用途']],
      };
      const fields = fieldDefinitions[selectedType].map(([id,label],index) => `<label>${label}${index === fieldDefinitions[selectedType].length - 1 ? `<textarea name="${id}" ${id === 'name' ? 'required' : ''}></textarea>` : `<input name="${id}" ${id === 'name' ? 'required' : ''}>`}</label>`).join('');
      openDrawer(`新增${type.label}`, `<div class="drawer-step"><span>1 选择类型</span><span class="active">2 填写资料</span></div><form class="settings-form" id="newAssetForm">${fields}<div class="tool-note">人物音色在人物详情中添加；环境声、音效和音乐在剧集 Audio Plan/Cut 中管理。</div><div class="drawer-actions"><button type="button" class="btn" data-new-asset-back>上一步</button><button class="btn" type="submit" data-new-asset-submit="upload">创建并上传</button><button class="btn" type="submit" data-new-asset-submit="generate">创建并生成候选</button><button class="btn primary" type="submit" data-new-asset-submit="draft">仅创建草稿</button></div></form>`);
      drawerBody.querySelector('[data-new-asset-back]').addEventListener('click', () => openNewAssetDrawer());
      let submitMode = 'draft';
      drawerBody.querySelectorAll('[data-new-asset-submit]').forEach(button => button.addEventListener('click', () => { submitMode = button.dataset.newAssetSubmit; }));
      drawerBody.querySelector('#newAssetForm').addEventListener('submit', event => {
        event.preventDefault();
        const values = Object.fromEntries(new FormData(event.currentTarget));
        if (!String(values.name || '').trim()) { showToast('请先填写资产名称'); return; }
        if (['林夏','酒店经理','酒店大堂','13 层门卡'].includes(values.name.trim())) { showToast('发现同名资产：请打开已有资产或修改名称，系统不会自动合并'); return; }
        closeDrawer();
        showToast(submitMode === 'draft' ? `已创建${type.label}草稿“${values.name}”` : submitMode === 'upload' ? `已创建“${values.name}”，请继续选择本地候选图` : `已创建“${values.name}”并进入生图参数确认；尚未提交任务`);
      });
    }

    function openAssetLibraryDrawer() {
      const assets = fullModel.getProjectAssetsModel('7');
      let selectedIds = new Set();
      let relation = 'reference';
      const render = (query = '') => {
        const items = assets.libraryItems.filter(item => item.name.includes(query));
        openDrawer('从个人资产库添加', `<p style="color:var(--muted)">先选择资产，再选择与项目的关系；个人库更新不会自动替换项目版本。</p><input class="search" style="width:100%" data-library-search value="${escapePrototypeHtml(query)}" placeholder="搜索个人资产库"><div class="asset-option-list" style="margin-top:12px">${items.map(item => `<button class="library-card ${selectedIds.has(item.id) ? 'selected' : ''}" data-library-asset="${item.id}"><b>${item.name} <span class="tag">${item.type}</span></b><small>${item.version} · ${item.license}${item.exists ? ' · 项目中已存在同来源资产' : ''}</small></button>`).join('') || '<div class="asset-empty-inline">没有匹配资产。清空搜索后重试。</div>'}</div><div class="look-detail-section"><h3>添加方式</h3><div class="asset-library-choice"><button class="${relation === 'reference' ? 'selected' : ''}" data-library-choice="reference"><b>引用固定版本</b><small>推荐；记录来源版本，库更新时只提示。</small></button><button class="${relation === 'copy' ? 'selected' : ''}" data-library-choice="copy"><b>复制到项目</b><small>创建可独立修改的项目副本，保留来源 ID、版本和 hash。</small></button></div></div><div class="drawer-actions"><button class="btn primary" data-library-add ${selectedIds.size ? '' : 'disabled'}>添加 ${selectedIds.size || ''}</button></div>`);
        drawerBody.querySelector('[data-library-search]').addEventListener('input', event => render(event.target.value));
        drawerBody.querySelectorAll('[data-library-asset]').forEach(button => button.addEventListener('click', () => { selectedIds.has(button.dataset.libraryAsset) ? selectedIds.delete(button.dataset.libraryAsset) : selectedIds.add(button.dataset.libraryAsset); render(query); }));
        drawerBody.querySelectorAll('[data-library-choice]').forEach(button => button.addEventListener('click', () => { relation = button.dataset.libraryChoice; render(query); }));
        drawerBody.querySelector('[data-library-add]')?.addEventListener('click', () => {
          const duplicated = assets.libraryItems.filter(item => selectedIds.has(item.id) && item.exists);
          if (duplicated.length) { showToast(`“${duplicated[0].name}”已存在：请打开已有资产或改名复制，未重复添加`); return; }
          closeDrawer(); showToast(`已${relation === 'reference' ? '引用固定版本' : '复制到项目'} ${selectedIds.size} 项`);
        });
      };
      render();
    }

    function openAssetBatchDrawer(projectId) {
      const assets = fullModel.getProjectAssetsModel(projectId);
      const render = (actionId = '') => {

    function openProjectOperationDrawer(projectId, operationId) {
      const data = fullModel.getProjectOperationsModel(projectId);
      const operation = data.actions.find(item => item.id === operationId);
      if (!operation) return;
      const back = `<button class="btn" data-project-operation-back>返回项目操作</button>`;
      if (operationId === 'export-backup') {
        openDrawer(operation.label, `<div class="tool-note"><b>导出前检查完成</b><br>包含项目数据库记录、当前媒体、来源清单和版本信息；不包含 API 密钥或全局配置。</div><div class="asset-field-grid" style="margin-top:12px"><div class="asset-field"><small>归档协议</small><b>V2.1</b></div><div class="asset-field"><small>预计大小</small><b>1.8 GB</b></div><div class="asset-field"><small>运行任务</small><b>不写入备份</b></div><div class="asset-field"><small>项目修改</small><b>不会修改</b></div></div><div class="drawer-actions">${back}<button class="btn primary" data-project-operation-confirm="export-backup">导出备份</button></div>`);
      } else if (operationId === 'restore-backup') {
        openDrawer(operation.label, `<div class="drawer-step"><span class="active">1 选择并校验</span><span>2 影响预览</span><span>3 事务恢复</span></div><div class="selection-row"><div><b>凌晨两点的客房服务_2026-09-08.lmd.zip</b><small>V2.1 · 校验通过 · 8 集 · 1.7 GB</small></div></div><div class="settings-warning" style="margin-top:12px"><b>恢复不会直接覆盖当前项目</b><div>提交前先创建当前状态备份；校验、备份或事务任一步失败都保持当前项目不变。</div></div><div class="drawer-actions">${back}<button class="btn" data-project-operation-confirm="choose-backup">重新选择</button><button class="btn primary" data-project-operation-confirm="restore-backup">查看影响并恢复</button></div>`);
      } else {
        openDrawer(operation.label, `<div class="settings-warning"><b>这是可恢复删除</b><div>项目将移入回收站，运行任务必须先停止；恢复窗口内可完整恢复。不会立即物理删除媒体。</div></div><div class="asset-field-grid" style="margin-top:12px"><div class="asset-field"><small>项目</small><b>${data.projectTitle}</b></div><div class="asset-field"><small>影响</small><b>8 集 · 23 个媒体</b></div></div><label style="display:block;margin-top:12px">输入项目名称确认<input class="search" style="width:100%;margin-top:6px" data-delete-project-confirm-input placeholder="${data.projectTitle}"></label><div class="drawer-actions">${back}<button class="btn danger" data-project-operation-confirm="delete-project" disabled>移入回收站</button></div>`);
        const input = drawerBody.querySelector('[data-delete-project-confirm-input]');
        const confirm = drawerBody.querySelector('[data-project-operation-confirm="delete-project"]');
        input.addEventListener('input', () => { confirm.disabled = input.value.trim() !== data.projectTitle; });
      }
      drawerBody.querySelector('[data-project-operation-back]').addEventListener('click', () => openProjectMenuDrawer(projectId));
      drawerBody.querySelectorAll('[data-project-operation-confirm]').forEach(button => button.addEventListener('click', () => {
        const action = button.dataset.projectOperationConfirm;
        if (action === 'choose-backup') { showToast('已打开本地文件选择器演示；尚未读取或写入文件'); return; }
        closeDrawer();
        showToast(action === 'export-backup' ? '项目备份已进入本地导出队列' : action === 'restore-backup' ? '已创建恢复前备份并进入事务恢复演示' : '项目已移入回收站，可在恢复窗口内撤销');
      }));
    }

      return `<div class="cut-workbench"><main class="studio-panel"><div class="studio-panel-head"><strong>镜头 ${model.selectedShot.number} · ${model.selectedShot.status}</strong><span class="tag">${model.selectedShot.duration}</span><button class="btn" data-cut-command="enhance">视频增强⌄</button></div><div class="cut-player"><button class="play-control" data-cut-command="play">▶</button></div><div class="cut-shot-rail">${rail}</div></main><aside class="studio-panel"><div class="studio-panel-head"><strong>本镜审核</strong><span class="tag ok">candidate ${model.selectedShot.candidateId}</span></div><section class="studio-section"><h3>来源快照</h3><p>${model.selectedShot.sourceSnapshot}</p><div class="mini-actions">${model.reviewActions.map(item=>`<button data-cut-command="${item.id}">${item.label}</button>`).join('')}</div></section><section class="studio-section"><h3>候选与时间线</h3><p>点击候选只预览；改选时必须决定是否替换已固定的 Timeline clip。</p><button class="btn" data-cut-command="compare-candidates">比较候选</button></section><section class="studio-section"><h3>稳定帧</h3><p>从候选选择时间点并保存 candidate id/hash；断开下一镜引用不会删除该 artifact。</p><button class="btn" data-cut-command="stable-frame">选择稳定帧</button></section><section class="studio-section"><h3>Video Gate</h3><p>${model.readiness.completed}/${model.readiness.required} 镜已采用 · ${model.readiness.running} 运行中 · ${model.readiness.failed} 失败</p><button class="btn" data-cut-command="gate">查看缺失与豁免</button></section></aside></div>`;
    }

idth:100%;margin-top:10px" data-cut-command="picture-lock" ${model.gates.canPictureLock?'':'disabled'}>${model.timeline.locked?'派生新画面版本':'锁定画面'}</button></section></aside></div>`;
    }

    function renderCutDelivery(model) {
      const post = model.postChain.map(item=>`<div class="post-row"><span>${item.label}</span><span class="post-status ${item.status}">${item.status}</span><button class="btn" data-cut-command="post-${item.id}">设置</button></div>`).join('');
      return `<div class="cut-workbench"><main class="studio-panel"><div class="studio-panel-head"><strong>后期处理链 · Post revision ${model.delivery.postRevision}</strong><button class="btn" data-cut-command="post-history">版本历史</button></div><section class="studio-section">${post}</section><div class="tool-note" style="margin:12px"><b>基础合片母版始终保留</b><br>${model.postArtifacts[0].hash}；超分选择 ${model.upscaleDecision.allowed.join(' / ')} 写入 Post Revision，失败可回退基础母版。</div></main><aside class="studio-panel"><div class="studio-panel-head"><strong>交付预检</strong><span class="tag">不可静默跳过</span></div><section class="studio-section">${model.delivery.checks.map((item,index)=>`<div class="delivery-check"><span>${item}</span><span class="tag ${model.delivery.canExport?'ok':''}"${model.delivery.canExport?'':' style="color:var(--warn)"'}>${model.delivery.canExport?'通过':index===1?'等待':'待复核'}</span></div>`).join('')}${model.delivery.canExport?'':`<div class="tool-note">${model.delivery.blockers.join('；')}</div>`}</section><section class="studio-section"><h3>输出内容</h3>${model.delivery.outputs.map(item=>`<span class="delivery-output">${item}</span>`).join('')}<button class="btn primary" style="width:100%;margin-top:12px" data-cut-command="export-film" ${model.delivery.canExport?'':'disabled'}>导出成片 revision 6</button><p>${model.delivery.lineage}<br>交付后修改派生新 revision；旧成片、manifest 和 hash 保留。</p></section></aside></div>`;

      return `<section class="studio-page" data-feature-id="S-01">${renderStudioHead(model,'script')}<div>${renderStageScenario(model.scenario)}<div class="studio-toolbar"><span class="tag ${model.editor.saveState==='saved'?'ok':''}">${model.editor.saveState==='saved'?'已保存':'保存失败'}</span><span>自动保存 ${model.autosave.delayMs}ms · ${model.autosave.shortcut} · 浏览器恢复副本</span><div class="spacer"></div><button class="btn" data-review-action="script-ai" data-review-title="AI 创作" data-review-detail="想法续写、选段改写、多集草稿和从项目复制均只创建可审阅草稿。">AI 创作</button><button class="btn" data-review-action="script-diff" data-review-title="版本比较" data-review-detail="比较 script-r11 与 script-r12；不会用新版本覆盖旧批准链。">版本与 Diff</button><button class="btn primary" data-review-action="script-approve" data-review-title="确认剧本" data-review-detail="创建新的批准 ScriptRevision；设定与分镜只标记需评估，不自动刷新下游。">确认剧本</button></div></div><div class="script-grid"><aside class="studio-panel"><div class="studio-panel-head"><strong>叙事场次 · ${model.scenes.length}</strong></div><div class="studio-section">${scenes}<button class="btn" style="width:100%" data-review-action="add-scene" data-review-title="新增场次" data-review-detail="插入新场次并保存为当前草稿 revision。">＋ 新增场次</button></div></aside><main class="studio-panel"><div class="studio-panel-head"><strong>${model.scenes[1].heading}</strong><span class="tag">${model.currentRevision.id}</span></div><textarea class="script-editor" aria-label="剧本编辑器">${model.editor.content}</textarea><div class="studio-section mini-actions"><button data-review-action="save-script" data-review-title="立即保存" data-review-detail="按当前 revision 提交；409 时保留草稿并进入差异比较。">立即保存</button><button data-review-action="rewrite-selection" data-review-title="改写选中段落" data-review-detail="先展示模型、费用和改写范围；结果作为候选文本。">改写选段</button><button data-review-action="browser-backup" data-review-title="浏览器恢复副本" data-review-detail="查看、复制或恢复尚未成功写入本地服务的文本。">恢复副本</button></div></main><aside class="studio-panel"><div class="studio-panel-head"><strong>版本与影响</strong></div><section class="studio-section"><h3>版本历史</h3><div class="review-list">${revisions}</div></section><section class="studio-section"><h3>资产解析 Diff</h3><p>新增 ${model.assetExtraction.diff.added} · 修改 ${model.assetExtraction.diff.changed} · 删除 ${model.assetExtraction.diff.removed} · 人工锁定 ${model.assetExtraction.diff.locked}</p><button class="btn" data-review-action="asset-diff" data-review-title="资产解析影响" data-review-detail="逐项确认复用、新建、删除建议；人工锁定字段不会被 AI 覆盖。">查看并解析</button></section><section class="studio-section"><h3>批准边界</h3><p>${model.approval.downstreamEffect}</p></section></aside></div></section>`;
    }

    function renderEpisodeAssetsStage(projectId, episodeId, scenarioId) {

      const groups=model.requiredGroups.map(group=>`<section class="asset-requirement"><div class="asset-requirement-head"><b>${group.label}</b><span class="tag ${group.ready===group.total?'ok':''}">${group.ready}/${group.total}</span></div>${group.items.map(item=>`<div class="asset-requirement-row"><div><b>${item.label}</b><small>${item.status}</small></div><span>项目 ${item.projectCurrent}</span><span>本集 ${item.episodeSelection}</span><button class="btn" data-review-action="episode-asset-${item.id}" data-review-title="${item.label}" data-review-detail="比较项目 current、本集已选版本、候选、hash 和使用影响；只修改本集选择。">${item.status==='阻塞'?'处理缺失':'比较/更换'}</button></div>`).join('')}</section>`).join('');

    function renderLocation() {
      const state = fullModel.parsePrototypeLocation(location.hash || '#/projects');
      drawerBackdrop.classList.remove('open');drawerBackdrop.setAttribute('aria-hidden','true');
      if (!location.hash || state.notFound) history.replaceState(null, '', '#/projects');
      document.getElementById('crumb').textContent = `/ ${routeLabels[state.routeId] || '项目'}${state.scenarioId === 'default' ? '' : ` · ${state.scenarioId}`}`;
      document.querySelectorAll('.nav-route').forEach(button => button.classList.toggle('active',
        (button.dataset.routeId === 'projects' && state.routeId.startsWith('project')) ||
        button.dataset.routeId === state.routeId ||
        (button.dataset.routeId === 'projects' && state.routeId.startsWith('studio-')) ||
        (button.dataset.routeId === 'settings-ai' && state.routeId.startsWith('settings-'))
      ));
      if (state.routeId === 'projects') pageRoot.innerHTML = renderProjects(state.scenarioId);
      else if (state.routeId === 'project-overview') pageRoot.innerHTML = renderProjectOverview(state.params.projectId,state.scenarioId);
      else if (state.routeId === 'project-bible') pageRoot.innerHTML = renderProjectBible(state.params.projectId,state.scenarioId);
      else if (state.routeId === 'project-episodes') pageRoot.innerHTML = renderProjectEpisodes(state.params.projectId,state.scenarioId);
      else if (state.routeId === 'project-assets') pageRoot.innerHTML = renderProjectAssets(state.params.projectId,state.scenarioId,state.params.focusId);
      else if (state.routeId === 'project-new') pageRoot.innerHTML = renderProjectCreate(state.scenarioId);
      else if (state.routeId === 'project-import') pageRoot.innerHTML = renderProjectImport(state.scenarioId);
      else if (state.routeId === 'studio-script') pageRoot.innerHTML = renderScriptStage(state.params.projectId,state.params.episodeId,state.scenarioId);
      else if (state.routeId === 'studio-assets') pageRoot.innerHTML = renderEpisodeAssetsStage(state.params.projectId,state.params.episodeId,state.scenarioId);
      else if (state.routeId === 'studio-storyboard') pageRoot.innerHTML = renderStoryboardStage(state.params.projectId,state.params.episodeId,state.scenarioId);
      else if (state.routeId === 'studio-cut') pageRoot.innerHTML = renderCutStage(state.params.projectId,state.params.episodeId,state.scenarioId);
      else if (state.routeId === 'library') pageRoot.innerHTML = renderLibrary(state.scenarioId);
      else if (state.routeId === 'quick-create') pageRoot.innerHTML = renderQuickCreate(state.scenarioId);
      else if (state.routeId === 'canvas') pageRoot.innerHTML = renderCanvas(state.scenarioId);
      else if (state.routeId === 'settings-ai') pageRoot.innerHTML = renderAiSettings(state.scenarioId);
      else if (state.routeId === 'settings-general') pageRoot.innerHTML = renderGeneralSettings(state.scenarioId);
      else if (state.routeId === 'settings-data') pageRoot.innerHTML = renderAdvancedDataTools(state.scenarioId);
      else pageRoot.innerHTML = renderPlaceholder(state);
      bindPageActions();
      if (state.routeId === 'project-episodes' && state.scenarioId === 'source-picker' && !drawerBackdrop.classList.contains('open')) {
        setTimeout(()=>openEpisodeSourceDrawer(state.params.projectId,state.params.focusId||''),0);
      }
      if (state.routeId === 'project-assets') {
        const assetId = new URLSearchParams((location.hash.split('?')[1] || '')).get('asset');
        if (assetId) openProjectAssetDetail(assetId, false);
      }
    }

    function openStoryboardReextractDrawer(model) {
      const flow = model.reextract;
      const diffLabels = [
        ['新增镜头',flow.diff.added],
        ['内容变化',flow.diff.changed],
        ['拟删除',flow.diff.removed],
        ['保持不变',flow.diff.unchanged],
      ];
      openDrawer(flow.label, `<div class="tool-note"><b>来源：${flow.source.label}</b><br>仅使用当前已确认剧本版本；不会从外部文件或旧剧本重新解析。</div><div class="drawer-step">${flow.steps.map((item,index)=>`<span class="${index===0?'active':''}">${index+1} ${item}</span>`).join('')}</div><div class="settings-form"><label>结构模型<input value="${flow.provider}" readonly></label><label>预计处理时间<input value="${flow.estimatedProcessingTime}" readonly></label><label>预计费用<input value="${flow.estimatedCost}" readonly></label></div><h3>预估差异</h3><div class="batch-summary">${diffLabels.map(item=>`<div class="asset-field"><small>${item[0]}</small><b>${item[1]}</b></div>`).join('')}</div><div class="tool-note" style="margin-top:12px">先生成并展示逐镜差异；保留人工锁定内容、现有图片/视频候选与历史。确认后创建新的 Shot revision，不覆盖当前版本。</div><div class="drawer-actions"><button class="btn" data-stage-drawer-action="cancel">取消</button><button class="btn primary" data-story-reextract-preview>生成结构并查看差异</button></div>`);
      drawerBody.querySelector('[data-story-reextract-preview]').addEventListener('click',()=>{
        openDrawer('确认分镜版本差异', `<div class="tool-note"><b>${flow.source.label} → 新 Shot revision</b><br>已匹配 10 镜；新增 ${flow.diff.added}、变化 ${flow.diff.changed}、拟删除 ${flow.diff.removed}、不变 ${flow.diff.unchanged}。</div><div class="feature-line"><span>镜头 03</span><b>对白时段 5.0–7.0s 有变化</b></div><div class="feature-line"><span>镜头 06–07</span><b>新增；待补资产引用</b></div><div class="feature-line"><span>原镜头 09</span><b>拟删除；其媒体历史继续保留</b></div><div class="tool-note">有冲突的人工锁定镜头保持原值，并进入逐项处理；不会静默覆盖。</div><div class="drawer-actions"><button class="btn" data-reextract-back>返回设置</button><button class="btn primary" data-reextract-confirm>创建新的 Shot revision</button></div>`);
        drawerBody.querySelector('[data-reextract-back]').addEventListener('click',()=>openStoryboardReextractDrawer(model));
        drawerBody.querySelector('[data-reextract-confirm]').addEventListener('click',()=>{closeDrawer();showToast('已创建新的 Shot revision；原版本、锁定内容和媒体历史均已保留')});
      });
    }

    function openStoryboardImportDrawer(model, selectedSourceId = 'excel') {
      const flow = model.storyboardImport;
      const selected = flow.sources.find(item=>item.id===selectedSourceId) || flow.sources[0];
      const sources = flow.sources.map(item=>`<button class="batch-action ${item.id===selected.id?'active':''}" data-story-import-source="${item.id}" ${item.availability==='later'?'disabled':''}><b>${item.label}</b><small>${item.extensions.join(' / ')} · ${item.availability==='v2.1'?'V2.1 支持':'后续版本：AI 辅助解析'}</small></button>`).join('');
      openDrawer(flow.label, `<div class="tool-note">此入口只导入“镜头结构”。完整 Episode Package、外部 AI 回流 JSON 和整集制作包应从剧集页导入。</div><div class="drawer-step">${flow.steps.map((item,index)=>`<span class="${index===0?'active':''}">${index+1} ${item}</span>`).join('')}</div><div class="asset-option-list">${sources}</div><div class="settings-form" style="margin-top:12px"><label>当前来源<input value="${selected.label} · ${selected.extensions.join(' / ')}" readonly></label><label>解析方式<input value="${selected.mode==='column-mapping'?'字段映射':selected.mode==='schema-validation'?'Schema 校验':'AI 辅助解析'}" readonly></label></div><button class="btn" style="width:100%" data-story-import-episodes>${flow.episodePackageTarget.label}</button><div class="drawer-actions"><button class="btn" data-stage-drawer-action="cancel">取消</button><button class="btn primary" data-story-import-preview ${selected.availability==='v2.1'?'':'disabled'}>选择文件并模拟解析</button></div>`);
      drawerBody.querySelectorAll('[data-story-import-source]').forEach(button=>button.addEventListener('click',()=>openStoryboardImportDrawer(model,button.dataset.storyImportSource)));
      drawerBody.querySelector('[data-story-import-episodes]').addEventListener('click',()=>{closeDrawer();navigate(flow.episodePackageTarget.routeId,{projectId:model.projectId},'import-package')});
      drawerBody.querySelector('[data-story-import-preview]')?.addEventListener('click',()=>{
