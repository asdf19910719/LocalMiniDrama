    let externalAiUiState = { step:'target', targetMode:'create_new', targetEpisodeId:'', taskNote:'', taskStatus:'waiting' };
    let projectImportUiState = { projectName:'凌晨两点的客房服务（副本）', workspacePath:'E:/LocalMiniDrama/projects', mediaStrategy:'copy' };

    function readAssetListStateFromLocation() {
      const query = new URLSearchParams((location.hash.split('?')[1] || ''));
      const filters = {};
      for (const id of ['status','usage','source','media','episode','issue','level']) {
        if (query.get(id)) filters[id] = query.get(id);
      }
      return { query:query.get('q') || '', filters, sortId:query.get('sort') || 'updated-desc' };
    }

    function updateAssetLocation(projectId, patch = {}) {
      const next = { ...assetListState, ...patch, filters:{ ...assetListState.filters, ...(patch.filters || {}) } };
      assetListState = next;
      const query = new URLSearchParams();
      const parsed = fullModel.parsePrototypeLocation(location.hash);
      if (parsed.scenarioId !== 'default') query.set('scenario', parsed.scenarioId);
      const activeType = next.filters.type || '';
      if (activeType) query.set('focus', activeType);
      if (next.query) query.set('q', next.query);
      if (next.sortId && next.sortId !== 'updated-desc') query.set('sort', next.sortId);
      for (const [key,value] of Object.entries(next.filters)) {
        if (key !== 'type' && value) query.set(key, value);
      }
      location.hash = `#/projects/${projectId}/assets${query.toString() ? `?${query}` : ''}`;
    }

    function updateProjectLocation(patch = {}) {
      const current = currentLocation();
      const params = { ...current.params, ...patch };
      if (!params.query) delete params.query;
      if (!params.status || params.status === 'all') delete params.status;
      if (!params.sort || params.sort === 'updated-desc') delete params.sort;
      const scenarioId = ['no-results','load-failed'].includes(current.scenarioId) ? 'default' : current.scenarioId;
      navigate('projects', params, scenarioId);
    }

    function readProjectViewMode() {
      try { return localStorage.getItem(projectViewStorageKey); } catch { return 'card'; }
    }

    function saveProjectViewMode(mode) {
      projectViewMode = fullModel.normalizeProjectListViewMode(mode);
      try { localStorage.setItem(projectViewStorageKey, projectViewMode); } catch {}
    }

    function saveAssetViewMode(mode) {
      assetViewMode = mode === 'list' ? 'list' : 'card';
      try { localStorage.setItem(assetViewStorageKey, assetViewMode); } catch {}
    }

    function navigate(routeId, params = {}, scenarioId = 'default') {
      location.hash = fullModel.formatPrototypeLocation(routeId, params, scenarioId);
    }

    function renderProjectTabs(projectId, activeRouteId) {
      const isEmptyProject=String(projectId)==='new-project';
      const tabs = fullModel.getProjectSectionNavigation(projectId).map(item => item.id === activeRouteId
        ? `<button class="active" aria-current="page">${item.label}</button>`
        : `<button data-route-id="${item.id}" data-project-route="${projectId}" ${isEmptyProject?'disabled title="创建第 1 集后可用"':''}>${item.label}</button>`).join('');
      return `<nav class="project-tabs" aria-label="项目详情分区">${tabs}<button class="project-menu-button" data-project-menu="${projectId}" aria-label="打开项目操作" ${isEmptyProject?'disabled title="创建第 1 集后可用"':''}>••• 项目操作</button></nav>`;
    }

    function projectCard(project) {
      const health = project.health.map(item => `<button class="tag ${item.kind}" data-project-health="${item.target}" data-project-id="${project.id}">${item.label}</button>`).join('');
      return `<article class="project-card" data-project-id="${project.id}" data-project-open="${project.id}" tabindex="0" aria-label="打开项目 ${project.title} 的概览">
        <div class="cover ${project.cover.source}"><div class="badges"><span class="tag">${project.episodeCount} 集</span></div><span class="cover-source">${project.cover.label}</span></div>
        <div class="project-body"><div class="title-line"><h2>${project.title}</h2><time title="查看项目概览可见完整更新时间">${project.updatedAt}</time></div><div class="project-recent-work"><small>上次工作</small><b>${project.recentWork.label} · ${project.recentWork.stageLabel} ${project.recentWork.progress}</b></div><div class="project-health">${health || '<span class="tag ok">状态正常</span>'}</div></div>
        <div class="project-foot">${project.locationBadge?`<span class="status project-location">${project.locationBadge}</span>`:'<span class="project-location"></span>'}<button class="btn primary" data-project-continue="${project.id}" data-episode-id="${project.continueEpisodeId}" data-stage="${project.continueStage}">${project.continueLabel}</button></div>
      </article>`;
    }

    function renderProjects(params, scenarioId) {
      const page = hubModel.getProjectListModel({ query:params.query, status:params.status, sort:params.sort, scenarioId });
      const pageHead = `<div class="page-head"><div><h1 tabindex="-1">项目</h1><p>继续最近工作，或创建新项目。</p></div><div class="actions"><button class="btn" data-route-id="project-import" data-feature-id="P-04">导入项目备份</button><button class="btn primary" data-route-id="project-new">＋ 新建项目</button></div></div>`;
      if (scenarioId === 'loading') return `<section class="page" data-feature-id="P-01">${pageHead}<div class="projects"><div class="skeleton"></div><div class="skeleton"></div></div></section>`;
      if (scenarioId === 'empty') return `<section class="page" data-feature-id="P-01">${pageHead}<div class="empty"><div><div class="empty-mark">◇</div><h2>还没有项目</h2><p>创建项目不会立即调用 AI 或产生远端费用。</p><div class="actions" style="justify-content:center"><button class="btn" data-route-id="project-import">导入项目备份</button><button class="btn primary" data-route-id="project-new">创建第一个项目</button></div></div></div></section>`;
      if (page.kind === 'error') return `<section class="page" data-feature-id="P-01">${pageHead}<div class="empty"><div><div class="empty-mark">!</div><h2>${page.title}</h2><p>${page.detail}</p><div class="actions" style="justify-content:center">${page.actions.map(item=>`<button class="btn ${item.id==='retry-project-index'?'primary':''}" data-project-error-action="${item.id}">${item.label}</button>`).join('')}</div></div></div></section>`;
      const offlineBanner = scenarioId === 'offline' ? '<div class="banner"><b>远端服务当前不可用</b><span>本地项目仍可打开和编辑；远端生成任务会保留输入并进入“需要处理”。</span></div>' : '';
      const taskBanner = page.banner ? `<div class="banner"><div><b>${page.banner.title}</b><span>${page.banner.detail}</span></div><div class="spacer"></div>${page.banner.actions.map(item=>`<button class="btn" data-project-banner-action="${item.id}">${item.label}</button>`).join('')}</div>` : '';
      const options = page.statusOptions.map(item=>`<option value="${item.id}" ${page.status===item.id?'selected':''}>${item.label}</option>`).join('');
      const results = page.items.length ? `<div class="projects ${projectViewMode==='list'?'list-view':''}">${page.items.map(projectCard).join('')}</div>` : `<div class="empty"><div><div class="empty-mark">⌕</div><h2>${page.emptyState.title}</h2><p>${page.emptyState.detail}</p><button class="btn" id="clearSearch">${page.emptyState.actions[0].label}</button></div></div>`;
      return `<section class="page" data-feature-id="P-01">
        ${pageHead}${offlineBanner}${taskBanner}
        <div class="toolbar"><input class="search" id="projectSearch" aria-label="搜索项目" placeholder="搜索项目"><select class="btn" id="projectSort" aria-label="项目排序"><option value="updated-desc" ${page.sort==='updated-desc'?'selected':''}>最近更新</option><option value="name-asc" ${page.sort==='name-asc'?'selected':''}>项目名称</option></select><select class="btn" id="projectStatus" aria-label="项目状态">${options}</select><span class="result-count">${page.resultCount}/${page.totalCount} 个项目</span><div class="spacer"></div><div class="segmented" role="group" aria-label="项目视图"><button class="${projectViewMode==='card'?'active':''}" data-project-view="card" aria-pressed="${projectViewMode==='card'}">卡片</button><button class="${projectViewMode==='list'?'active':''}" data-project-view="list" aria-pressed="${projectViewMode==='list'}">列表</button></div></div>
        <div id="projectResults">${results}</div>
      </section>`;
    }

    function renderProjectOverview(projectId, scenarioId) {
      const project = fullModel.getProjectOverviewModel(projectId, scenarioId);
      const data = project.sections;
      const hero = `<div class="overview-hero"><div class="overview-cover" aria-hidden="true"></div><div><h1 tabindex="-1">${project.title}</h1><p>${project.description}</p><div class="overview-meta">${project.metadata.map(item=>`<span class="tag">${item}</span>`).join('')}</div></div><div class="overview-actions"><button class="btn" data-route-id="projects">返回项目列表</button><button class="btn" data-project-profile-edit="${project.projectId}">编辑项目</button></div></div>`;
      const tabs = renderProjectTabs(project.projectId, 'project-overview');
      if (project.viewState.kind === 'loading') return `<section class="page" data-feature-id="P-01">${hero}${tabs}<div class="overview-grid"><article class="overview-panel overview-loading"><div class="skeleton" style="height:96px"></div></article><article class="overview-panel overview-loading"><div class="skeleton" style="height:96px"></div></article><article class="overview-panel wide"><div class="skeleton" style="height:112px"></div></article></div></section>`;
      const stateBanner = project.viewState.kind === 'normal' || project.viewState.kind === 'all-complete' ? '' : `<div class="overview-state"><span class="tag warn">${project.viewState.kind === 'storage-offline' ? '只读' : project.viewState.kind === 'needs-attention' ? '需要处理' : '加载异常'}</span><div class="grow"><b>${project.viewState.title || '当前工作存在阻塞'}</b><small>${project.viewState.detail || '处理当前硬阻塞后可恢复上次工作位置。'}</small></div>${(project.viewState.actions||[]).map(item=>`<button class="btn" data-overview-state-action="${item.id}">${item.label}</button>`).join('')}</div>`;
      if (!project.viewState.contentAvailable) return `<section class="page" data-feature-id="P-01">${hero}${tabs}${stateBanner}</section>`;
      const stages = data.stages.map(item => `<button class="overview-stage" data-tone="${item.tone}" data-project-stage-summary="${item.id}" data-project-id="${project.projectId}" aria-label="查看${item.label}阶段的剧集" ${project.projectId==='new-project'?'disabled title="创建第 1 集后可用"':''}><span>${item.label}</span><b>${item.state}</b><small>${item.summary}</small></button>`).join('');
      const blockers = data.blockers.length ? data.blockers.map(item => `<div class="blocker"><span class="tag ${item.blocksResume?'danger':'warn'}">${item.type}</span><div class="grow"><b>${item.title}</b><small>${item.detail}</small></div><button class="btn" data-overview-blocker-id="${item.id}" data-project-id="${project.projectId}">${item.action}</button></div>`).join('') : '<div class="tool-note">当前没有需要人工处理的问题。</div>';
      const primary = data.primaryAction;
      const primaryButton = `<button class="btn primary" data-overview-primary="${project.projectId}" ${primary.enabled?'':'disabled'}>${primary.kind==='resolve-blocker'?'处理后继续':primary.kind==='create-first-episode'?'选择开始方式':primary.kind==='open-latest-film'?'查看成片':'继续'}</button>`;
      return `<section class="page" data-feature-id="P-01">
        ${hero}${tabs}${stateBanner}
        <div class="overview-grid">
          <article class="overview-panel"><h2>下一步</h2><div class="next-card" data-blocking="${primary.kind==='resolve-blocker'}"><span class="tag">${primary.kind==='resume'?'已保存位置':primary.kind==='resolve-blocker'?'当前阻塞':'推荐操作'}</span><div class="grow"><b>${primary.label}</b><small>${primary.detail}</small></div>${primaryButton}</div></article>
          <article class="overview-panel"><h2>待处理 ${data.blockers.length}</h2>${blockers}</article>
          <article class="overview-panel wide"><h2>项目阶段概览</h2><div class="overview-stages">${stages}</div></article>
          <article class="overview-panel wide"><h2>当前画面风格</h2><div class="look-card"><div class="look-swatch"></div><div><b>${data.projectLook.name}</b><p>版本 ${data.projectLook.version} · ${data.projectLook.status}</p><p>${data.projectLook.aspectRatio} · ${data.projectLook.usage}</p><small>更换项目风格只影响之后的新生成和主动刷新，不自动重做已有图片或视频。</small></div><button class="btn" data-project-look="${project.projectId}">${data.projectLook.action.label}</button></div></article>
          <article class="overview-panel wide"><h2>制作进度</h2><div class="look-card"><div><b>${project.assetSummary.line}</b><small>人物、场景和道具的资料与问题都在项目素材中处理。</small></div><button class="btn" data-route-id="project-assets" data-project-route="${project.projectId}">打开项目素材</button></div></article>
        </div>
      </section>`;
    }

    function renderProjectEpisodes(projectId, scenarioId) {
      const locationState=currentLocation();
      const model = fullModel.getProjectEpisodesModel(projectId, scenarioId, { resultEpisodeId: locationState.params.focusId || '3' });
      const stageLabels = { script:'剧本', assets:'设定', storyboard:'分镜', cut:'成片' };
      let rows = model.visibleRows.filter(item => `${item.number} ${item.title} ${item.recentPosition || ''}`.toLowerCase().includes(episodeUiState.query.trim().toLowerCase()));
      rows = [...rows].sort((a,b)=>episodeUiState.sortId==='updated-desc' ? Date.parse(b.updatedAt)-Date.parse(a.updatedAt) : a.number-b.number);
      const scenario = model.scenario && model.scenario.kind !== 'loading' ? `<div class="stage-scenario ${model.scenario.kind}"><span class="tag">${model.scenario.kind==='blocking'?'阻断':model.scenario.kind==='success'?'完成':model.scenario.kind==='recoverable-error'?'可恢复':'流程提示'}</span><div><b>${model.scenario.title}</b><small>${model.scenario.detail}</small></div><div class="actions">${model.scenario.actions.map(item=>`<button class="btn" data-episode-scenario-action="${item.id}" ${item.episodeId?`data-result-episode-id="${item.episodeId}"`:''}>${item.label}</button>`).join('')}</div></div>` : '';
      const statusFilters = model.statusFilters.map(item=>`<button class="episode-filter ${(item.id==='all'&&!model.activeStatusFilter)||item.id===model.activeStatusFilter?'active':''}" data-episode-status-filter="${item.id}" data-project-id="${model.projectId}">${item.label}</button>`).join('');
      const episodeRows = rows.map(item=>{
        const stages = Object.entries(item.stages).map(([stage,value])=>`<button class="episode-stage" data-status="${value.status}" data-access="${value.access}" data-episode-stage="${stage}" data-episode-id="${item.episodeId}" data-project-id="${model.projectId}" aria-disabled="${value.access==='locked'}" title="${value.reason||`打开第 ${item.number} 集${stageLabels[stage]}`}" aria-label="${value.access==='locked'?`${stageLabels[stage]}待完成前置：${value.reason}`:`打开第 ${item.number} 集${stageLabels[stage]}`}"><small>${stageLabels[stage]}</small><b>${value.label}</b></button>`).join('');
        const sourceLabel = item.importSource?.kind==='external-ai-result' ? '外部 AI 导入' : '制作包导入';
        const source = item.importSource ? `<button class="source-pill" data-episode-source="${item.episodeId}">${sourceLabel}</button>` : '';
        const meta = item.recentPosition ? `上次位于 ${item.recentPosition}` : '空白剧集，进入剧本开始创作';
        return `<article class="episode-row ${item.highlighted?'highlighted':''}" data-episode-row="${item.episodeId}"><div class="episode-number">E${String(item.number).padStart(2,'0')}</div><div class="episode-main"><h2>${item.title} ${source}</h2><p>${item.estimatedDuration?`${item.estimatedDuration} · `:''}${meta}${item.blockers?` · ${item.blockers} 项待处理`:''}</p></div><div class="episode-stages">${stages}</div><div class="episode-actions"><button class="btn" data-episode-menu="${item.episodeId}" aria-label="第 ${item.number} 集更多操作">•••</button><button class="btn ${item.isBlank?'':'primary'}" data-episode-resume="${item.episodeId}" data-project-id="${model.projectId}">${item.nextAction}</button></div></article>`;
      }).join('');
      const baseEmpty = model.emptyState || { kind:'filter-empty', title:'没有匹配剧集', detail:'清除搜索或筛选后重试。', action:{ id:'clear-filters', label:'清除条件' } };
      const emptyState = episodeUiState.query ? { title:'没有匹配剧集', detail:'清除搜索或切换筛选条件。', action:{ id:'clear-filters', label:'清除条件' } } : baseEmpty;
      const empty = `<div class="empty"><div><div class="empty-mark">◇</div><h2>${emptyState.title}</h2><p>${emptyState.detail}</p><button class="btn primary" ${emptyState.action.id==='create-episode'?`data-episode-new="${model.projectId}"`:'data-episode-clear-filters'}>${emptyState.action.label}</button></div></div>`;
      const externalTasks = model.externalCollaborationTasks.map(task=>{
        if(task.status==='mismatch') return `<article class="external-task-card attention"><div><span class="tag warn">外部 AI 协作 · 需要你处理</span><h3>${task.creatorStatus}</h3><p>目标：${task.target.label} · ${task.packageName}</p><small>返回结果与任务不匹配；需要你选择处理方式后才能继续。</small></div><button class="btn primary" data-external-task-center="${task.taskId}">去处理</button></article>`;
        return `<article class="external-task-line"><span class="tag">外部 AI 协作</span><b>${task.creatorStatus}</b><small>${task.target.label} · ${task.packageName} · 可离开页面，任务在任务中心同步</small><span class="spacer"></span><button data-external-task-center="${task.taskId}">在任务中心查看</button></article>`;
      }).join('');
      const compactHead = `<div class="episode-compact-head"><div><h1 tabindex="-1">${model.title}</h1><p>${model.metadata.slice(0,2).join(' · ')} · ${model.description}</p></div><div class="actions"><button class="btn" data-route-id="projects">${model.header.backLabel}</button></div></div>`;
      if(model.scenario?.kind==='loading') return `<section class="page" data-feature-id="EPISODES-001">${compactHead}${renderProjectTabs(model.projectId,'project-episodes')}<div class="skeleton" style="margin-top:18px"></div></section>`;
      return `<section class="page" data-feature-id="EPISODES-001">${compactHead}${renderProjectTabs(model.projectId,'project-episodes')}${scenario}${externalTasks}<div class="episode-stats"><div class="episode-stat"><small>全部</small><b>${model.stats.total}</b></div><div class="episode-stat"><small>制作中</small><b>${model.stats.active}</b></div><div class="episode-stat"><small>需要处理</small><b>${model.stats.needsAttention}</b></div><div class="episode-stat"><small>已完成</small><b>${model.stats.completed}</b></div></div><div class="episode-toolbar"><input class="search" data-episode-search value="${episodeUiState.query}" placeholder="搜索集号、标题或工作位置" aria-label="搜索剧集"><div class="spacer"></div><select class="btn" data-episode-sort aria-label="剧集排序"><option value="number-asc" ${episodeUiState.sortId==='number-asc'?'selected':''}>集号升序</option><option value="updated-desc" ${episodeUiState.sortId==='updated-desc'?'selected':''}>最近工作</option></select><button class="btn" data-episode-reorder="${model.projectId}">排序与管理</button><button class="btn" data-episode-open-sources="${model.projectId}">导入 / 协作</button><button class="btn primary" data-episode-new="${model.projectId}">＋ 新建剧集</button></div><div class="episode-filter-groups"><div class="episode-filter-line"><small>状态</small>${statusFilters}</div></div><div class="episode-list">${episodeRows || empty}</div><div class="tool-note" style="margin-top:14px">四个阶段随时可以进入查看；确认剧本并准备好设定后才能生成媒体。剧集级导入只创建结构化草稿，不自动生成图片、视频或音频。</div></section>`;
    }

    function openEpisodeSourceDrawer(projectId, focusEpisodeId = '') {
      const entry = fullModel.getEpisodeCreationEntryModel(projectId);
      openDrawer('导入 / 协作', `<div class="tool-note">这些流程有各自的数据协议和校验；普通写作请直接点击“新建剧集”。</div><div class="operation-list" style="margin-top:12px">${entry.secondary.items.map(item=>`<button class="operation-card" data-episode-import-item="${item.id}"><span><b>${item.label}</b><small>${item.description}</small></span><span>›</span></button>`).join('')}</div>`);
      drawerBody.querySelectorAll('[data-episode-import-item]').forEach(button=>button.addEventListener('click',()=>{
        const id=button.dataset.episodeImportItem;
        if(id==='package-import'){episodeUiState.importProtocol='episode-package';episodeUiState.targetMode='create_new';episodeUiState.assetDecisions={};openEpisodeImportWizard(projectId,1,{focusEpisodeId});return;}
        if(id==='external-ai'){closeDrawer();navigate('external-ai-wizard',{projectId});return;}
        if(id==='novel-split'){openEpisodeCreationSource(projectId,'novel-split',focusEpisodeId);return;}
        if(id==='source-video'){openEpisodeCreationSource(projectId,'source-video',focusEpisodeId);return;}
      }));
    }

    function openEpisodeTargetSelector(projectId, sourceId, focusEpisodeId = '', creationContext = 'existing-project', selectedTargetId = '') {
      const selector=fullModel.getEpisodeTargetSelectorModel(projectId,sourceId,{focusEpisodeId,creationContext});
      const activeTargetId=selectedTargetId||selector.selectedTargetId;
      const sourceLabels={
        'script-import':'导入或粘贴剧本','ai-script':'让 AI 帮我写','package-import':'导入制作包',
        blank:'空白创建','novel-split':'小说智能拆集','source-video':'从已有视频开始剪辑',external_ai:'外部 AI 协作',
      };
      const targets=selector.targets.map(item=>`<button class="batch-action ${item.id===activeTargetId?'selected':''}" data-episode-target-choice="${item.id}"><b>${item.label}</b><small>${item.mode==='create_new'?'使用项目下一个可用集号，不覆盖现有剧集':'只写入无剧本、分镜、媒体和成功导入记录的空白剧集'}</small></button>`).join('');
      openDrawer(`${sourceLabels[sourceId]||'新建剧集'} · 选择目标`, `<div class="tool-note"><b>先确认写入哪一集</b><br>所有开始方式共用相同目标保护；非空剧集不会出现在可选列表。</div><div class="asset-option-list" style="margin-top:12px">${targets}</div><div class="drawer-actions"><button class="btn" data-episode-target-back>返回来源</button><button class="btn primary" data-episode-target-continue>继续</button></div>`);
      drawerBody.querySelectorAll('[data-episode-target-choice]').forEach(button=>button.addEventListener('click',()=>openEpisodeTargetSelector(projectId,sourceId,focusEpisodeId,creationContext,button.dataset.episodeTargetChoice)));
      drawerBody.querySelector('[data-episode-target-back]').addEventListener('click',()=>{if(creationContext==='new-project'){closeDrawer();navigate('project-new',{},'source-cancelled')}else openEpisodeSourceDrawer(projectId,focusEpisodeId)});
      drawerBody.querySelector('[data-episode-target-continue]').addEventListener('click',()=>{
        const target=selector.targets.find(item=>item.id===activeTargetId);
        openEpisodeCreationSource(projectId,sourceId,focusEpisodeId,creationContext,target);
      });
    }

    function openEpisodeCreationSource(projectId, sourceId, focusEpisodeId = '', creationContext = 'existing-project', targetSelection = null) {
      const sourceMap = {'package-import':'episode_json','ai-script':'ai','novel-split':'novel','source-video':'source_video'};
      const legacySourceId = sourceMap[sourceId] || sourceId;
      const isNewProject = creationContext === 'new-project';
      if(!targetSelection){
        const selector=fullModel.getEpisodeTargetSelectorModel(projectId,sourceId,{focusEpisodeId,creationContext});
        if(selector.targets.length>1){openEpisodeTargetSelector(projectId,sourceId,focusEpisodeId,creationContext);return;}
        targetSelection=selector.targets[0];
      }
      const backToSources = () => {
        if (isNewProject) { closeDrawer(); navigate('project-new',{},'source-cancelled'); }
        else openEpisodeTargetSelector(projectId,sourceId,focusEpisodeId,creationContext,targetSelection.id);
      };
      const targetEpisodeId=targetSelection.mode==='fill_blank'?(targetSelection.episodeId||focusEpisodeId):String(targetSelection.episodeNumber);
      const targetLabel=targetSelection.label;
      if(sourceId==='script-import'){
        openDrawer('导入或粘贴剧本', `<form class="settings-form" data-script-import-form><label>写入目标<input value="${targetLabel}" readonly></label><div class="segmented"><button type="button" class="active">粘贴文本</button><button type="button" data-script-file>选择文件</button></div><label>剧本内容<textarea>内景 · 酒店前台 · 深夜\n林夏接起来自不存在楼层的电话……</textarea><small>支持 TXT、Markdown、DOCX，单文件不超过 20 MB。</small></label><div class="tool-note"><b>导入预览</b><br>当前文本约 31 字 · 检测到 1 个场次。先建立可编辑草稿；不会自动确认剧本、提取素材或调用生图服务。</div><div class="drawer-actions"><button type="button" class="btn" data-source-back>返回目标</button><button class="btn primary" type="submit">预览并创建剧本草稿</button></div></form>`);
        drawerBody.querySelector('[data-source-back]').addEventListener('click',backToSources);
        drawerBody.querySelector('[data-script-file]').addEventListener('click',()=>showToast('已选择：午夜前台-第1集.docx · 1,842 字 · 4 个场次'));
        drawerBody.querySelector('[data-script-import-form]').addEventListener('submit',event=>{event.preventDefault();closeDrawer();navigate('studio-script',{projectId,episodeId:targetEpisodeId})});return;
      }
      const flow = fullModel.getEpisodeCreationFlow(legacySourceId,{creationContext});
      const steps = `<div class="drawer-step">${flow.steps.map((item,index)=>`<span class="${index===0?'active':''}">${index+1} ${item}</span>`).join('')}</div>`;
      const back = `<button type="button" class="btn" data-source-back>${isNewProject?'取消首集创建':'返回来源'}</button>`;
      if(legacySourceId==='blank'){
        const targetField=`<label>写入目标<input value="${targetLabel}" readonly></label>`;
        openDrawer('空白创建', `${steps}<form class="settings-form" data-blank-episode-form>${targetField}<label>集号<input value="${targetSelection.episodeNumber}" readonly></label><label>标题<input value="未命名"></label><div class="tool-note">只创建空白剧本草稿，不调用 AI、不解析素材、不确认阶段。</div><div class="drawer-actions">${back}<button class="btn primary" type="submit">创建并进入剧本</button></div></form>`);
        drawerBody.querySelector('[data-source-back]').addEventListener('click',backToSources);
        drawerBody.querySelector('[data-blank-episode-form]').addEventListener('submit',event=>{event.preventDefault();closeDrawer();navigate('studio-script',{projectId,episodeId:targetEpisodeId})});return;
      }
      if(legacySourceId==='ai'){
        openDrawer('想法 / 剧本 AI', `${steps}<form class="settings-form" data-ai-script-form><label>首个目标<input value="${targetLabel}" readonly></label><label>故事想法或剧本初稿<textarea>凌晨两点，酒店前台接到来自不存在楼层的客房服务电话……</textarea></label><label>生成范围<select><option>只生成本集剧本草稿</option><option>从第 ${targetSelection.episodeNumber} 集开始生成 3 集草稿</option></select></label><div class="tool-note"><b>编号预览</b><br>单集：E${String(targetSelection.episodeNumber).padStart(2,'0')}；三集：E${String(targetSelection.episodeNumber).padStart(2,'0')}–E${String(targetSelection.episodeNumber+2).padStart(2,'0')}。每集独立保存，失败集可单独重试。</div><label>模型与预计费用<input value="文本模型 · ${flow.estimatedCost}" readonly></label><div class="tool-note">结果逐集保存为草稿；不自动解析资产、不确认剧本、不启动媒体生成。</div><div class="drawer-actions">${back}<button class="btn primary" type="submit">确认费用并生成草稿</button></div></form>`);
        drawerBody.querySelector('[data-source-back]').addEventListener('click',backToSources);
        drawerBody.querySelector('[data-ai-script-form]').addEventListener('submit',event=>{event.preventDefault();closeDrawer();navigate('project-episodes',{projectId},'ai-script')});return;
      }
      if(legacySourceId==='novel'){
        openDrawer('小说 / 长文本', `${steps}<div class="settings-form"><label>内容来源<select><option>选择 TXT / DOCX / Markdown 文件</option><option>粘贴长文本</option></select></label><label>拆集策略<select><option>按剧情转折建议</option><option>按章节</option><option>指定 8 集</option></select></label></div><div class="tool-note">先解析并预览章节、建议集数、标题和编号冲突；确认前零写入。</div><div class="drawer-actions">${back}<button class="btn primary" data-novel-preview>解析并预览拆集</button></div>`);
        drawerBody.querySelector('[data-source-back]').addEventListener('click',backToSources);
        drawerBody.querySelector('[data-novel-preview]').addEventListener('click',()=>{closeDrawer();navigate('project-episodes',{projectId},'novel-split')});return;
      }
      if(legacySourceId==='external_ai'){closeDrawer();navigate('external-ai-wizard',{projectId});return;}
      if(legacySourceId==='episode_json'){
        episodeUiState.importProtocol='episode-package';episodeUiState.targetMode=targetSelection.mode;episodeUiState.assetDecisions={};openEpisodeImportWizard(projectId,1,{focusEpisodeId:targetSelection.episodeId||'',creationContext,targetSelection});return;
      }
      if(legacySourceId==='source_video'){
        const videoTarget=`<label>写入目标<input value="${targetLabel}" readonly></label>`;
        openDrawer('从已有视频开始剪辑', `${steps}<div class="settings-form"><label>来源文件<input value="episode-source.mp4" readonly></label><label>媒体信息<input value="1920×1080 · 03:24 · H.264 · 186 MB" readonly></label>${videoTarget}</div><div class="tool-note"><b>引用原文件并保护只读</b><br>登记 SHA-256 和来源路径；也可选择复制进项目。文件离线或内容变化时保留记录并支持重新定位，不生成镜头、不调用远端 Provider。</div><div class="drawer-actions">${back}<button class="btn primary" data-source-video-confirm>登记来源并进入成片</button></div>`);
        drawerBody.querySelector('[data-source-back]').addEventListener('click',backToSources);
        drawerBody.querySelector('[data-source-video-confirm]').addEventListener('click',()=>{closeDrawer();navigate('project-episodes',{projectId},'source-video')});
      }
    }

    function openEpisodeImportWizard(projectId, step=1, {focusEpisodeId='', protocol=episodeUiState.importProtocol, creationContext='existing-project', targetSelection=null}={}) {
      episodeUiState.importStep=step;episodeUiState.importProtocol=protocol;
      const model=fullModel.getEpisodePackageImportModel(step,{targetMode:episodeUiState.targetMode,assetDecisions:episodeUiState.assetDecisions,protocol,creationContext});
      const stepGroups=[[1,2],[3,4],[5]];const groupIndex=Math.max(0,stepGroups.findIndex(g=>g.includes(step)));
      const phaseNames=['选择文件与字段映射','导入预览（结构与资产）','确认写入'];
      const progress=`<div class="drawer-step">${phaseNames.map((item,index)=>`<span class="${index===groupIndex?'active':''}">${index+1} ${item}</span>`).join('')}</div>`;
      const renderStepContent=(st)=>{let content='';
      if(st===1){content=`<div class="tool-note"><b><span class="tag ok">已校验</span> ${model.file.name}</b><br>${model.file.schema}@${model.file.version} · SHA-256 ${model.file.sha256}<div style="margin-top:10px"><button class="btn" data-import-change-file>重新选择文件</button></div></div><div class="asset-option-list" style="margin-top:12px">${model.targets.map(item=>`<button class="batch-action ${episodeUiState.targetMode===item.id?'selected':''}" data-import-target="${item.id}" data-allowed="${item.allowed}"><b>${item.label}</b><small>${item.allowed?(creationContext==='new-project'?'新项目只创建首集':item.id==='create_new'?'使用下一个可用集号，不影响已有剧集':'目标无剧本、分镜、媒体和导入记录'):`${item.code} · 非空目标禁止写入`}</small></button>`).join('')}</div><div class="tool-note" style="margin-top:12px">${creationContext==='new-project'?'当前只会创建第 1 集；不显示已有项目目标。':'只允许创建新剧集或填充空白剧集；不支持合并、覆盖、追加。'}</div>${creationContext==='new-project'?'<button class="btn" style="width:100%;margin-top:12px" data-new-project-external-ai>还没有制作包？创建外部 AI 协作任务</button>':''}`}
      else if(st===2){content=`<div class="batch-summary"><div class="asset-field"><small>剧集</small><b>第 ${model.episodeSummary.number} 集 · ${model.episodeSummary.title}</b></div><div class="asset-field"><small>文本</small><b>梗概 ${model.episodeSummary.synopsisLength} 字 · 剧本 ${model.episodeSummary.scriptLength} 字</b></div></div><h3>梗概预览</h3><p>${model.episodeSummary.synopsisPreview}</p><h3>剧本预览</h3>${model.scriptPreview.paragraphs.map(item=>`<p class="tool-note" style="margin:8px 0">${item}</p>`).join('')}<button class="btn" data-import-full-script>查看完整剧本</button><h3>叙事场次</h3>${model.storyScenes.map((item,index)=>`<div class="feature-line"><span>场次 ${index+1}</span><b>${item}</b></div>`).join('')}${model.contentIssues.map(item=>`<div class="settings-warning"><b>${item.severity==='blocking'?'必须修复':'提示'}</b><div>${item.label}</div></div>`).join('')}<div class="tool-note">项目画面风格不会被外部 JSON 覆盖。</div>`}
      else if(st===3){content=`${model.matches.map(item=>{const decision=item.decision;const type=decision?.type;const label=type==='reuse'?`复用 · ${decision.assetVersionId}`:type==='create'?'新建素材':type==='skip'?'本次不导入':'';return `<div class="import-match"><span>${item.type}</span><div><b>${item.source}</b><small>${item.result}</small></div>${decision?`<button class="btn" ${item.availableDecisions?'data-resolve-import-match="'+item.id+'"':''}>${label}</button>`:`<button class="btn" data-resolve-import-match="${item.id}">选择处理</button>`}</div>`}).join('')}${model.canAdvance?'':`<div class="settings-warning"><b>还有 ${model.unresolvedConflicts} 个冲突未处理</b><div>同名不等于同一素材；必须明确选择后才能继续。</div></div>`}`}
      else if(st===4){content=`<div class="batch-summary"><div class="asset-field"><small>叙事场次</small><b>${model.structure.storySceneCount}</b></div><div class="asset-field"><small>分镜</small><b>${model.structure.shotCount}</b></div><div class="asset-field"><small>时段</small><b>${model.structure.segmentCount}</b></div><div class="asset-field"><small>计划时长</small><b>${model.structure.plannedDuration}</b></div></div>${model.validation.map(item=>`<div class="delivery-check"><span><b>${item.label}</b><small>${item.detail}</small></span><span class="tag ${item.level==='passed'?'ok':''}">${item.level==='passed'?'通过':'稍后校验'}</span></div>`).join('')}<div class="tool-note">导入只验证结构合法；具体 Provider 的时长、引用数和格式在生成前校验。</div>`}
      else{content=`<div class="batch-summary"><div class="asset-field"><small>写入目标</small><b>${model.targetMode==='fill_blank'?`填充空白第 ${model.targetEpisodeNumber} 集`:`创建第 ${model.targetEpisodeNumber} 集`}</b></div><div class="asset-field"><small>对象与结构</small><b>${model.summary.characters} 人物 · ${model.summary.scenes} 场景 · ${model.summary.props} 道具</b></div><div class="asset-field"><small>分镜与时段</small><b>${model.summary.shots} 个分镜 · ${model.summary.segments} 个时段</b></div><div class="asset-field"><small>远端费用 / 媒体任务</small><b>¥${model.remoteGenerationCost} / ${model.createdMediaTasks.length}</b></div></div><div class="feature-line"><span>素材决策</span><b>新建人物 ${model.writeSummary.createdCharacters} · 复用 ${model.writeSummary.reusedAssets} · 新建 ${model.writeSummary.createdAssets} · 跳过 ${model.writeSummary.skippedObjects}</b></div><div class="feature-line"><span>外部媒体</span><b>${model.writeSummary.externalMedia} 个</b></div><div class="tool-note"><b>单事务写入</b><br>提交前重新检查目标仍为空；任一步失败全部回滚，不留部分数据。</div>`}
      return content;};
      const content=stepGroups[groupIndex].map(st=>renderStepContent(st)).join('');
      const nextLabel=step===5?'导入为结构化草稿':'下一步';
      openDrawer(`${protocol==='external-ai-result'?'外部 AI 结果':'单集制作包'} · ${phaseNames[groupIndex]}`, `${progress}${content}<div class="drawer-actions"><button class="btn" data-import-cancel>${step===1?model.cancelLabel:'取消'}</button>${step>1?'<button class="btn" data-import-previous>上一步</button>':''}<button class="btn primary" data-import-next ${model.canAdvance?'':'disabled'}>${nextLabel}</button></div>`);
      drawerBody.querySelectorAll('[data-import-target]').forEach(button=>button.addEventListener('click',()=>{if(button.dataset.allowed!=='true'){closeDrawer();navigate('project-episodes',{projectId,focusId},'json-target-not-blank');return;}episodeUiState.targetMode=button.dataset.importTarget;openEpisodeImportWizard(projectId,1,{focusEpisodeId,protocol,creationContext,targetSelection})}));
      drawerBody.querySelectorAll('[data-resolve-import-match]').forEach(button=>button.addEventListener('click',()=>openImportMatchDecisionDrawer(projectId,button.dataset.resolveImportMatch,{focusEpisodeId,protocol,creationContext})));
      drawerBody.querySelector('[data-import-change-file]')?.addEventListener('click',()=>showToast('请选择新的 V2.1 JSON 文件；选择后将重新校验'));
      drawerBody.querySelector('[data-import-full-script]')?.addEventListener('click',()=>{openDrawer(`第 ${model.episodeSummary.number} 集 · 完整剧本预览`,model.scriptPreview.paragraphs.map((item,index)=>`<div class="feature-line"><span>${index+1}</span><b>${item}</b></div>`).join('')+`<div class="drawer-actions"><button class="btn primary" data-import-full-script-back>返回导入向导</button></div>`);document.getElementById('closeDrawer').addEventListener('click',()=>openEpisodeImportWizard(projectId,step,{focusEpisodeId,protocol,creationContext,targetSelection}),{once:true});drawerBody.querySelector('[data-import-full-script-back]')?.addEventListener('click',()=>openEpisodeImportWizard(projectId,step,{focusEpisodeId,protocol,creationContext,targetSelection}));});
      drawerBody.querySelector('[data-new-project-external-ai]')?.addEventListener('click',()=>openExternalAiWorkflow(projectId,'context','',creationContext,targetSelection));
      drawerBody.querySelector('[data-import-cancel]').addEventListener('click',()=>{if(step===1){if(creationContext==='new-project'){closeDrawer();navigate('project-new',{},'source-cancelled')}else openEpisodeSourceDrawer(projectId,focusEpisodeId)}else closeDrawer()});
      drawerBody.querySelector('[data-import-previous]')?.addEventListener('click',()=>openEpisodeImportWizard(projectId,stepGroups[groupIndex][0]===3?1:stepGroups[groupIndex-1][0],{focusEpisodeId,protocol,creationContext,targetSelection}));
      drawerBody.querySelector('[data-import-next]').addEventListener('click',()=>{const nextGroupStart=groupIndex<2?stepGroups[groupIndex+1][0]:5;if(step<nextGroupStart||groupIndex<2)openEpisodeImportWizard(projectId,nextGroupStart,{focusEpisodeId,protocol,creationContext,targetSelection});else{closeDrawer();navigate('project-episodes',{projectId,focusId:String(model.targetEpisodeNumber)},'import-succeeded')}});
    }

    function openImportMatchDecisionDrawer(projectId, matchId, {focusEpisodeId='', protocol='episode-package', creationContext='existing-project'}={}) {
      const model=fullModel.getEpisodePackageImportModel(3,{targetMode:episodeUiState.targetMode,assetDecisions:episodeUiState.assetDecisions,protocol,creationContext});
      const match=model.matches.find(item=>item.id===matchId);
      if(!match?.availableDecisions){openEpisodeImportWizard(projectId,3,{focusEpisodeId,protocol,creationContext});return;}
      const options=match.availableDecisions.map(item=>`<button class="batch-action ${match.decision?.type===item.id?'selected':''}" data-import-decision="${item.id}"><b>${item.label}</b><small>${item.id==='reuse'?'继续选择项目中的素材版本、人物状态和当前媒体':item.id==='create'?'创建独立项目素材并保留外部来源':match.required?'必需引用不能跳过':'该对象未被本集引用，可安全略过'}</small></button>`).join('');
      openDrawer(`处理匹配 · ${match.source}`, `<div class="tool-note"><b>${match.result}</b><br>${match.required?'本集必需引用，必须复用或新建。':'本集可选对象，可以不导入。'}</div><div class="asset-option-list" style="margin-top:12px">${options}</div><div class="drawer-actions"><button class="btn" data-import-decision-back>返回匹配列表</button></div>`);
      drawerBody.querySelectorAll('[data-import-decision]').forEach(button=>button.addEventListener('click',()=>{
        if(button.dataset.importDecision==='reuse'&&match.reuseOptions?.length){openImportReuseVersionDrawer(projectId,matchId,{focusEpisodeId,protocol,creationContext});return;}
        episodeUiState.assetDecisions={...episodeUiState.assetDecisions,[matchId]:button.dataset.importDecision};openEpisodeImportWizard(projectId,3,{focusEpisodeId,protocol,creationContext});
      }));
      drawerBody.querySelector('[data-import-decision-back]').addEventListener('click',()=>openEpisodeImportWizard(projectId,3,{focusEpisodeId,protocol,creationContext}));
    }

    function openImportReuseVersionDrawer(projectId, matchId, {focusEpisodeId='', protocol='episode-package', creationContext='existing-project'}={}) {
      const model=fullModel.getEpisodePackageImportModel(3,{targetMode:episodeUiState.targetMode,assetDecisions:episodeUiState.assetDecisions,protocol,creationContext});
      const match=model.matches.find(item=>item.id===matchId);
      openDrawer(`选择精确版本 · ${match.source}`, `<div class="tool-note">复用必须固定到具体素材版本；后续项目素材更新不会静默改写本次导入结果。</div><div class="asset-option-list" style="margin-top:12px">${match.reuseOptions.map(item=>`<button class="batch-action" data-import-reuse-version="${item.assetVersionId}"><b>${item.label}</b><small>素材版本 ${item.assetVersionId} · 当前媒体 ${item.mediaVersionId}</small></button>`).join('')}</div><div class="drawer-actions"><button class="btn" data-import-reuse-back>返回处理方式</button></div>`);
      drawerBody.querySelectorAll('[data-import-reuse-version]').forEach(button=>button.addEventListener('click',()=>{episodeUiState.assetDecisions={...episodeUiState.assetDecisions,[matchId]:`reuse:${button.dataset.importReuseVersion}`};openEpisodeImportWizard(projectId,3,{focusEpisodeId,protocol,creationContext})}));
      drawerBody.querySelector('[data-import-reuse-back]').addEventListener('click',()=>openImportMatchDecisionDrawer(projectId,matchId,{focusEpisodeId,protocol,creationContext}));
    }

    function openEpisodeSourceAuditDrawer(projectId, episodeId, sectionId='raw') {
      let audit;
      try{audit=fullModel.getEpisodeSourceAuditModel(projectId,episodeId,sectionId)}catch(error){showToast('该剧集没有外部导入来源');return;}
      const tabs=audit.sections.map(item=>`<button class="batch-action ${item.id===audit.activeSection.id?'selected':''}" data-source-audit-section="${item.id}"><b>${item.label}</b><small>${item.description}</small></button>`).join('');
      const entries=audit.activeSection.entries.map(item=>`<div class="feature-line"><span>${item.label}</span><b>${item.value}</b></div>`).join('');
      openCentralModal(`第 ${audit.episodeNumber} 集 · 外部来源`, `<div class="tool-note"><b>${audit.filename}</b><br>协议 ${audit.schemaVersion} · 只读且不可变；仅用于追溯本次导入。</div><div class="asset-option-list" style="margin-top:12px">${tabs}</div><h3 style="margin-top:16px">${audit.activeSection.label}</h3><p class="recent">${audit.activeSection.description}</p>${entries}<details style="margin-top:12px"><summary>技术详情</summary><div class="feature-line"><span>package_id</span><b>${audit.packageId}</b></div><div class="feature-line"><span>SHA-256</span><b>${audit.sha256}</b></div></details><div class="tool-note" style="margin-top:12px">当前项目素材后续改名、换图或新增版本，都不会改写这份导入证据。</div>`);
      drawerBody.querySelectorAll('[data-source-audit-section]').forEach(button=>button.addEventListener('click',()=>openEpisodeSourceAuditDrawer(projectId,episodeId,button.dataset.sourceAuditSection)));
    }

    function openEpisodeMenuDrawer(projectId, episodeId) {
      const page=fullModel.getProjectEpisodesModel(projectId,'default');
      const row=page.rows.find(item=>item.episodeId===String(episodeId));
      const descriptions={rename:'只修改显示名称，不改变集号或阶段内容', reorder:'打开统一的排序与管理面板', 'view-source':'查看原始/规范化 JSON、Hash、匹配决策和报告', delete:'移入回收站并保留恢复窗口，不物理删除'};
      openDrawer(`第 ${row.number} 集 · 更多操作`, `<div class="operation-list">${page.managementActions.map(item=>`<button class="operation-card" data-episode-menu-action="${item.id}" ${item.id==='view-source'&&!row.importSource?'disabled':''}><span><b>${item.label}</b><small>${descriptions[item.id]}</small></span><span>›</span></button>`).join('')}</div>`);
      drawerBody.querySelectorAll('[data-episode-menu-action]').forEach(button=>button.addEventListener('click',()=>{
        const action=button.dataset.episodeMenuAction;
        if(action==='view-source'){openEpisodeSourceAuditDrawer(projectId,episodeId);return;}
        if(action==='reorder'){openEpisodeReorderDrawer(projectId);return;}
        if(action==='delete'){openDrawer('删除剧集',`<div class="settings-warning"><b>第 ${row.number} 集将移入回收站</b><div>30 天内可恢复；剧本、资产快照、分镜、候选和导入来源全部保留，不会物理删除。</div></div><div class="drawer-actions"><button class="btn" data-stage-drawer-action="cancel">取消</button><button class="btn primary" data-episode-archive-confirm>确认删除</button></div>`);drawerBody.querySelector('[data-episode-archive-confirm]').addEventListener('click',()=>{closeDrawer();showToast('剧集已删除，30 天内可在回收站恢复')});return;}
        openDrawer(page.managementActions.find(item=>item.id===action).label,`<div class="settings-form"><label>当前剧集<input value="第 ${row.number} 集 · ${row.title}" readonly></label><label>调整内容<input value="${action==='rename'?row.title:''}"></label></div><div class="tool-note">确认前不写入；保存后保留剧集历史。</div><div class="drawer-actions"><button class="btn primary" data-episode-menu-confirm>保存</button></div>`);drawerBody.querySelector('[data-episode-menu-confirm]').addEventListener('click',()=>{closeDrawer();showToast('剧集管理修改已保存')});
      }));
    }

    function openEpisodeReorderDrawer(projectId, orderIds=null) {
      const sourceRows=fullModel.getProjectEpisodesModel(projectId,'default').rows;
      const ids=orderIds||sourceRows.map(item=>item.episodeId);
      const rows=ids.map(id=>sourceRows.find(item=>item.episodeId===id));
      openDrawer('排序与管理', `<div class="tool-note">调整只改变集序；剧集 ID、来源记录和各阶段内容保持不变。归档剧集可从“已归档”筛选恢复。</div>${rows.map((item,index)=>`<div class="selection-row" style="margin-top:8px"><div><b>${index+1}. 第 ${item.number} 集 · ${item.title}</b><small>${item.isBlank?'空白剧集':item.recentPosition||'尚未开始'}</small></div><div class="mini-actions"><button data-reorder-move="up" data-reorder-index="${index}" ${index===0?'disabled':''}>上移</button><button data-reorder-move="down" data-reorder-index="${index}" ${index===rows.length-1?'disabled':''}>下移</button></div></div>`).join('')}<div class="drawer-actions"><button class="btn" data-stage-drawer-action="cancel">取消</button><button class="btn primary" data-episode-reorder-confirm>保存顺序</button></div>`);
      drawerBody.querySelectorAll('[data-reorder-move]').forEach(button=>button.addEventListener('click',()=>{const index=Number(button.dataset.reorderIndex);const targetIndex=button.dataset.reorderMove==='up'?index-1:index+1;const next=[...ids];[next[index],next[targetIndex]]=[next[targetIndex],next[index]];openEpisodeReorderDrawer(projectId,next)}));
      drawerBody.querySelector('[data-episode-reorder-confirm]').addEventListener('click',()=>{closeDrawer();showToast('剧集顺序已保存；内容和来源未改变')});
    }

    function renderProjectBible(projectId, scenarioId) {
      const bible = fullModel.getProjectBibleModel(projectId, scenarioId);
      return `<section class="page"><div class="tool-note">项目设置已合并到项目概览；项目资料与画面风格都在概览中编辑。</div></section>`;

    function openProjectAssetGenerationEnvelope(envelope, onConfirm) {
      const references = envelope.references.length
        ? envelope.references.map(item => `<div class="feature-line"><span>${item.label}</span><b>${item.purpose} · ${item.source}</b></div>`).join('')
        : '<div class="feature-line"><span>参考图</span><b>无</b></div>';
      const environment = envelope.environmentCheck.required
        ? `<div class="tool-note"><b>${envelope.environmentCheck.status}</b><br>${envelope.environmentCheck.checks.join('、')}均正常；环境检查本身不提交生成、不产生费用。</div>`
        : '';
      openDrawer('生成前检查', `${environment}<div class="feature-line"><span>生成对象</span><b>${envelope.objectLabel}</b></div><div class="feature-line"><span>模式 / 通道</span><b>${envelope.modeLabel} · ${envelope.channel}</b></div><div class="feature-line"><span>项目画面风格</span><b>${envelope.projectStyle}</b></div>${references}<div class="feature-line"><span>输出 / 任务</span><b>${envelope.outputCount} 个结果 · ${envelope.taskCount} 个任务</b></div><div class="feature-line"><span>预计费用</span><b>${envelope.estimatedCost}</b></div><details style="margin-top:12px"><summary>预览 Prompt 与能力检查</summary><div class="tool-note" style="margin-top:10px">${escapePrototypeHtml(envelope.promptPreview)}</div>${envelope.capabilityCheck.items.map(item => `<div class="feature-line"><span>检查</span><b>${item}</b></div>`).join('')}</details><div class="tool-note" style="margin-top:12px">${envelope.resultPolicy}。提交后进入排队，可关闭抽屉并在任务中心恢复。</div><div class="drawer-actions"><button class="btn" data-stage-drawer-action="cancel">取消</button><button class="btn primary" data-generation-envelope-confirm>${envelope.channel === 'ChatGPT 网页' ? '打开网页并排队' : '确认并排队'}</button></div>`);
      drawerBody.querySelector('[data-generation-envelope-confirm]').addEventListener('click', onConfirm);
    }

      const sourceTags = { existing:'已有能力', 'v2.1':'V2.1', 'new-v2.1':'V2.1 新增', future:'后续增强' };

      const voiceSummary = currentVoice ? `<div class="voice-summary"><div class="voice-wave" aria-label="当前音色波形">▥▥▥</div><div><b>${voice.displayName}</b><small style="display:block;color:var(--muted);margin-top:4px">${currentVoice.source} · ${currentVoice.durationSeconds} 秒 · ${voice.language} · ${voice.accent}</small><div class="look-tags" style="margin-top:7px">${voice.capabilities.map(item => `<span class="tag">${item}</span>`).join('')}</div><div class="asset-action-row"><button class="btn" data-voice-play="${currentVoice.id}">${voice.playingCandidateId === currentVoice.id ? '■ 停止试听' : '▶ 试听当前音色'}</button></div></div></div>` : `<div class="asset-empty-inline"><b>尚未配置人物音色</b><p>只有当前剧集的音频策略明确需要该人物音色时才会阻塞。</p><button class="btn primary" data-manage-character-voice>配置人物音色</button></div>`;
      const characterFields = detail.fields || { name:detail.title, role:'人物', description:'', appearance:'' };
      const characterFieldEditor = detail.editingFields ? `<form class="settings-form asset-inline-form" id="characterAssetEditForm"><label>名称<input name="name" value="${escapePrototypeHtml(characterFields.name)}" required></label><label>角色定位<input name="role" value="${escapePrototypeHtml(characterFields.role)}"></label><label>基础描述<textarea name="description">${escapePrototypeHtml(characterFields.description)}</textarea></label><label>稳定外貌<textarea name="appearance">${escapePrototypeHtml(characterFields.appearance)}</textarea></label><div class="drawer-actions"><button type="button" class="btn" data-character-edit-cancel>取消</button><button type="submit" class="btn primary">保存资料</button></div></form>` : `<div class="asset-field-grid"><div class="asset-field"><small>角色定位</small><b>${characterFields.role}</b></div><div class="asset-field"><small>基础描述</small><b>${characterFields.description}</b></div><div class="asset-field" style="grid-column:1/-1"><small>稳定外貌</small><b>${characterFields.appearance}</b></div></div><div class="asset-action-row"><button class="btn" data-character-edit>编辑资料</button></div>`;
      let sectionContent = '';
      if (activeSectionId === 'overview') {
        sectionContent = `${detail.primaryIssue ? `<div class="settings-warning"><b>${detail.primaryIssue.label}</b><div><button class="btn primary" style="margin-top:8px" data-manage-character-voice>${detail.primaryIssue.action}</button></div></div>` : ''}<div class="look-detail-section"><h3>人物资料</h3>${characterFieldEditor}</div><div class="look-detail-section"><h3>人物状态</h3><div class="character-state-strip">${states}</div><div class="tool-note"><b>${activeState.name}</b> · ${activeState.usage}<br>每个人物状态单独保存当前形象图和生图模式。</div><details style="margin-top:9px"><summary>完整提示词（只读摘要，编辑在「高级」）</summary><p style="white-space:pre-wrap">${escapePrototypeHtml(detail.advancedSettings.prompt)}</p></details></div><div class="look-detail-section"><h3>人物声音身份</h3>${voiceSummary}<div class="tool-note">人物音色只定义声音身份；愤怒、耳语、哭腔、语速和停顿由具体对白或时段设置。</div></div>`;
      } else if (activeSectionId === 'candidates') {
        sectionContent = `<div class="media-switch"><button class="btn ${activeMedia === 'image' ? 'active' : ''}" data-character-media="image">人物形象</button><button class="btn ${activeMedia === 'voice' ? 'active' : ''}" data-character-media="voice">人物音色</button></div>${activeMedia === 'image' ? `<div class="look-detail-section"><h3>人物状态</h3><div class="character-state-strip">${states}</div></div><div class="look-detail-section"><h3>${activeState.name} · 生图设置</h3><div class="asset-action-row">${generationChannelSelect}</div><label>生图类型 <select data-character-generation-mode-select>${detail.generationModes.map(item => `<option value="${item.id}" ${item.id === activeGenerationMode.id ? 'selected' : ''}>${item.label}</option>`).join('')}</select></label>${activeGenerationChannel === 'ChatGPT 网页' ? `<div class="tool-note" style="margin-top:8px"><b>网页环境：可用 ✓</b> · 检测不产生费用 <button data-chatgpt-check-env>重新检测</button></div>` : ''}<div class="tool-note" style="margin-top:8px">默认使用单图；需要跨镜一致性且通道支持时，再使用三/四视图。每个状态独立保存模式。</div></div><div class="look-detail-section"><h3>${activeState.name} · 候选图（左右滑动查看更多）</h3><div class="candidate-scroll">${candidates}</div><div class="asset-action-row"><button class="btn primary" data-character-image-generate>用 ${activeGenerationChannel} 按“${activeGenerationMode.label}”生成候选</button><button class="btn" data-character-image-upload>上传候选</button>${activeState.candidates.length > 1 ? `<button class="btn" data-candidate-compare>${detail.compareOpen ? '关闭对比' : '对比候选'}</button>` : ''}</div></div><div class="tool-note">生成或上传只会新增候选；点击某个候选即设为当前图，旧图继续保留在历史里。${detail.snapshotImpact}</div>` : `<div class="look-detail-section"><h3>当前音色与候选</h3><div class="voice-candidate-list">${voiceCandidates || '<div class="asset-empty-inline">还没有音色候选。</div>'}</div><div class="tool-note">试听不改变选择；点击“使用此音色”才更新人物当前音色，旧音色继续保留。</div></div><div class="look-detail-section"><h3>添加音色候选</h3><div class="voice-source-grid">${voiceSources}</div></div>`}`;
      } else if (activeSectionId === 'usage') {
        sectionContent = `<div class="look-detail-section"><h3>人物使用位置</h3><div class="usage-list">${detail.usageTargets.map(item => `<div class="usage-card"><div><b>${item.label}</b><small>人物形象和音色分别按本集实际音频策略保存版本记录。</small></div><button class="btn" data-asset-usage-route="${item.routeId}" data-project-id="${item.params.projectId}" data-episode-id="${item.params.episodeId}" data-focus-id="${item.params.focusId}">打开分镜</button></div>`).join('')}</div><div class="tool-note">缺少音色不会无条件阻塞。只有本集选择的音频策略明确需要该人物音色且当前音色缺失时，才阻断相关生成。</div></div>`;
      } else if (activeSectionId === 'records') {
        sectionContent = `<div class="look-detail-section"><h3>生成与处理记录</h3><div class="record-list">${detail.generationRecords.map(item => `<div class="record-card"><div><b>${item.kind} · ${item.status}</b><small>${item.source} · ${item.createdAt}</small></div><button class="btn" data-character-record="${item.id}">查看记录</button></div>`).join('')}</div></div>`;
      } else {
        sectionContent = `<form class="settings-form" id="characterVoiceAdvancedForm"><h3>人物形象生成设置</h3><label>完整 Prompt<textarea name="prompt">${escapePrototypeHtml(detail.advancedSettings.prompt)}</textarea></label><label>负面 Prompt<textarea name="negativePrompt">${escapePrototypeHtml(detail.advancedSettings.negativePrompt)}</textarea></label><div class="reference-grid">${detail.referenceImages.map(item => `<div class="reference-card"><div class="reference-thumb ${item.tone}"></div><div><b>${item.name}</b><small>${item.role} · ${item.source}</small></div><button type="button" class="btn" data-character-reference="${item.id}">管理</button></div>`).join('')}</div><div class="drawer-actions"><button type="button" class="btn danger" data-character-archive>删除人物</button><button type="submit" class="btn primary">保存高级设置</button></div></form>`;
      }
      const currentImage = activeState.candidates.find(item => item.id === activeState.currentCandidateId);
      openDrawer(detail.title, `<div class="asset-detail-hero"><div class="asset-detail-image ${detail.identityImage.tone}" aria-label="${detail.title}基础身份图"></div><div><span class="tag ok">${activeState.name}当前图：${currentImage?.label || '未设置'}</span><span class="tag" style="margin-left:6px">${detail.dataRevision}</span><h3>${detail.fields?.role || '人物'} · ${detail.characterStates.length} 个状态</h3><p style="color:var(--muted)">形象和音色都属于人物；生成或上传只进入各自候选。</p></div></div><div class="asset-detail-tabs" role="tablist">${tabs}</div>${sectionContent}`);
      document.querySelector('.drawer').classList.add('wide');
      drawerBody.querySelectorAll('[data-asset-detail-section]').forEach(button => button.addEventListener('click', () => {
        activeProjectAssetDetail = fullModel.setProjectAssetDetailSection(activeProjectAssetDetail, button.dataset.assetDetailSection);
        renderProjectAssetDetail();
      }));
      drawerBody.querySelectorAll('[data-character-state]').forEach(button => button.addEventListener('click', () => {
        activeProjectAssetDetail = { ...activeProjectAssetDetail, activeStateId: button.dataset.characterState };
        renderProjectAssetDetail();
      }));
      drawerBody.querySelector('[data-open-character-candidates]')?.addEventListener('click', () => {
        activeProjectAssetDetail = { ...activeProjectAssetDetail, activeSectionId:'candidates', activeCandidateMedia:'image' };
        renderProjectAssetDetail();
      });
      drawerBody.querySelector('[data-character-edit]')?.addEventListener('click', () => { activeProjectAssetDetail = { ...activeProjectAssetDetail, editingFields:true }; renderProjectAssetDetail(); });
      drawerBody.querySelector('[data-character-edit-cancel]')?.addEventListener('click', () => { activeProjectAssetDetail = { ...activeProjectAssetDetail, editingFields:false }; renderProjectAssetDetail(); });
      drawerBody.querySelector('#characterAssetEditForm')?.addEventListener('submit', event => {
        event.preventDefault();
        activeProjectAssetDetail = fullModel.saveProjectAssetFields(activeProjectAssetDetail, Object.fromEntries(new FormData(event.currentTarget)));
        activeProjectAssetDetail = { ...activeProjectAssetDetail, editingFields:false };
        renderProjectAssetDetail(); showToast('人物资料已保存；已有候选不会自动重新生成');
      });
      drawerBody.querySelectorAll('[data-character-generation-mode]').forEach(button => button.addEventListener('click', () => {
        activeProjectAssetDetail = fullModel.setProjectAssetCharacterGenerationMode(activeProjectAssetDetail, activeState.id, button.dataset.characterGenerationMode);
        renderProjectAssetDetail();
      }));
      drawerBody.querySelector('[data-character-generation-channel]')?.addEventListener('change', event => {
        activeProjectAssetDetail = { ...activeProjectAssetDetail, activeGenerationChannel:event.target.value };
        renderProjectAssetDetail();
      });
      drawerBody.querySelector('[data-candidate-compare]')?.addEventListener('click', () => {
        activeProjectAssetDetail = { ...activeProjectAssetDetail, compareOpen:!activeProjectAssetDetail.compareOpen };
        renderProjectAssetDetail();
      });
      drawerBody.querySelector('[data-character-image-generate]')?.addEventListener('click', () => {
        if (guardProjectAssetMutation('generate')) return;
        const envelope = fullModel.getProjectAssetGenerationEnvelope(activeProjectAssetDetail, { stateId:activeState.id, modeId:activeGenerationMode.id, channel:activeGenerationChannel });
        openProjectAssetGenerationEnvelope(envelope, () => {
          activeProjectAssetDetail = fullModel.submitProjectAssetGeneration(activeProjectAssetDetail, envelope, `job-character-${Date.now()}`);
          renderProjectAssetDetail();
          showToast(`任务已排队；完成后只进入${activeState.name}候选`);
        });
      });
      drawerBody.querySelectorAll('[data-character-image-upload]').forEach(button => button.addEventListener('click', () => {
        if (guardProjectAssetMutation('upload')) return;
        const id = `candidate-character-upload-${Date.now()}`;
        activeProjectAssetDetail = fullModel.addProjectAssetCharacterCandidate(activeProjectAssetDetail, activeState.id, {
          id, label:`候选 ${String.fromCharCode(65 + activeState.candidates.length)}`, meta:'本地上传 · 待使用', tone:'amber', source:'本地上传', status:'已完成',
        });
        renderProjectAssetDetail();
        showToast(`上传结果已加入${activeState.name}候选，点击候选后才会使用`);
      }));
      drawerBody.querySelectorAll('[data-candidate-use]').forEach(button => button.addEventListener('click', () => {
        if (guardProjectAssetMutation('select')) return;
        const selected = activeState.candidates.find(item => item.id === button.dataset.candidateUse);
        activeProjectAssetDetail = fullModel.useProjectAssetCandidate(activeProjectAssetDetail, activeState.id, button.dataset.candidateUse);
        renderProjectAssetDetail();
        showUndoToast(`已将${activeState.name}的「${selected.label}」设为当前图`, () => {
          activeProjectAssetDetail = fullModel.undoProjectAssetMediaSelection(activeProjectAssetDetail);
          renderProjectAssetDetail();
          showToast('已恢复之前的当前图');
        });
      }));
      drawerBody.querySelectorAll('[data-character-media]').forEach(button => button.addEventListener('click', () => {
        activeProjectAssetDetail = { ...activeProjectAssetDetail, activeCandidateMedia: button.dataset.characterMedia };
        renderProjectAssetDetail();
      }));
      drawerBody.querySelector('[data-manage-character-voice]')?.addEventListener('click', () => {
        activeProjectAssetDetail = { ...activeProjectAssetDetail, activeSectionId: 'candidates', activeCandidateMedia: 'voice' };
        renderProjectAssetDetail();
      });
      drawerBody.querySelectorAll('[data-voice-play]').forEach(button => button.addEventListener('click', () => {
        const isPlaying = activeProjectAssetDetail.voiceProfile.playingCandidateId === button.dataset.voicePlay;
        activeProjectAssetDetail = { ...activeProjectAssetDetail, voiceProfile:{ ...activeProjectAssetDetail.voiceProfile, playingCandidateId:isPlaying ? null : button.dataset.voicePlay } };
        renderProjectAssetDetail();
        showToast(isPlaying ? '已停止试听' : '正在试听音色；播放其他候选会自动停止当前试听');
      }));
      drawerBody.querySelectorAll('[data-voice-use]').forEach(button => button.addEventListener('click', () => {
        if (guardProjectAssetMutation('select')) return;
        const selected = voice.candidates.find(item => item.id === button.dataset.voiceUse);
        activeProjectAssetDetail = fullModel.useProjectAssetVoiceCandidate(activeProjectAssetDetail, selected.id);

      }));
      drawerBody.querySelectorAll('[data-voice-source]').forEach(button => button.addEventListener('click', () => {
        if (guardProjectAssetMutation('upload')) return;
        const source = voice.sources.find(item => item.id === button.dataset.voiceSource);
        if (!source || source.availability === 'future') return;
        const addVoiceCandidate = () => {
        const samples = {
          upload:['新上传参考','本地上传','WAV',15,'可用'],
          'tts-preset':['清冷女声 07','TTS 预设','Provider voice id',12,'可用'],
          'personal-library':['夜班女声固定版','个人素材库 v3','WAV',20,'可用'],
          extract:['提取任务候选','从音视频提取','WAV',10,'处理中'],
        };
        const [label,sourceLabel,format,durationSeconds,status] = samples[source.id];
        const candidate = { id:`voice-${source.id}-${Date.now()}`, label, source:sourceLabel, format, durationSeconds, status, isCurrent:false };
        activeProjectAssetDetail = { ...activeProjectAssetDetail,
          voiceProfile:{ ...activeProjectAssetDetail.voiceProfile, candidates:[...activeProjectAssetDetail.voiceProfile.candidates,candidate] },
          generationRecords:[{ id:`job-voice-${Date.now()}`, kind:'人物音色', status, source:sourceLabel, createdAt:'刚刚' }, ...activeProjectAssetDetail.generationRecords],
        };
        renderProjectAssetDetail();
        showToast(`${source.label}结果已加入音色候选，尚未设为当前音色`);
        };
        if (source.id === 'extract') {

    function escapePrototypeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' }[character]));
    }

    function renderStatefulAssetDetail() {
      const detail = activeProjectAssetDetail;

      const otherStates = detail.productionStates.filter(item => item.id !== activeState.id);
      const states = `${renderStateButton(activeState)}${otherStates.length ? `<details style="grid-column:1/-1"><summary>其他剧情状态（${otherStates.length}）</summary><div class="character-state-strip">${otherStates.map(renderStateButton).join('')}</div></details>` : ''}`;
      const attributes = activeState.attributes.map(item => `<span class="tag">${item}</span>`).join('');
      const renderViewButton = item => `<button class="asset-view-button ${item.id === activeView.id ? 'active' : ''}" data-production-view="${item.id}" aria-pressed="${item.id === activeView.id}"><b>${item.name}</b><small>${item.purpose}${item.candidates.length ? ` · ${item.candidates.length} 个候选` : ' · 待添加图片'}</small></button>`;
      const otherViews = activeState.views.filter(item => item.id !== activeView.id);
      const views = `${renderViewButton(activeView)}${otherViews.length ? `<details><summary>其他视图（${otherViews.length}）</summary><div class="asset-view-strip">${otherViews.map(renderViewButton).join('')}</div></details>` : ''}`;
      const candidates = activeView.candidates.length ? activeView.candidates.map(item => `<button class="candidate-card ${item.isCurrent ? 'current' : ''}" data-view-candidate-use="${item.id}" aria-pressed="${item.isCurrent}"><div class="candidate-preview ${item.tone}"></div><span class="candidate-status"><b>${item.label}</b>${item.isCurrent ? '<span class="tag ok">使用中</span>' : `<span class="tag">${detail.candidateActionLabel}</span>`}</span><small>${item.meta}</small></button>`).join('') : '<div class="asset-empty-inline" style="grid-column:1/-1">这个视图参考还没有图片。可以生成或上传候选。</div>';
      const fieldLabels = detail.assetKind === 'scene'
        ? [['location','地点'],['time','默认时间'],['weather','天气/环境'],['condition','剧情状态'],['atmosphere','空间与氛围']]
        : [['name','名称'],['propType','类型'],['storyPurpose','剧情用途'],['form','形制'],['material','材质'],['color','颜色']];
      const fields = fieldLabels.map(([key,label]) => `<div class="asset-field"><small>${label}</small><b>${escapePrototypeHtml(detail.fields[key])}</b></div>`).join('');
      const fieldEditor = `<form class="settings-form asset-inline-form" id="structuredAssetEditForm">${fieldLabels.map(([key,label]) => `<label>${label}<input name="${key}" value="${escapePrototypeHtml(detail.fields[key])}" required></label>`).join('')}<div class="drawer-actions"><button type="button" class="btn" data-asset-edit-cancel>取消</button><button type="submit" class="btn primary">保存资料</button></div></form>`;
      const references = (detail.referenceImages || []).map(item => `<div class="reference-card"><div class="reference-thumb ${item.tone}" aria-label="${item.name}缩略图"></div><div><b>${item.name}</b><small>${item.source} · 用途：${item.role}</small></div><div><button class="btn" data-reference-role="${item.id}">更换用途</button> <button class="btn" data-reference-remove="${item.id}">移除</button></div></div>`).join('') || '<div class="asset-empty-inline">还没有参考图。</div>';
      const referenceManager = `<div class="asset-inline-form"><h3>参考图管理</h3><p style="color:var(--muted)">参考图只约束生成，不是当前使用图；移除只解除引用，不删除原文件。</p><div class="reference-grid">${references}</div><div class="asset-action-row"><button class="btn" data-reference-add="upload">上传本地图片</button><button class="btn" data-reference-add="library">从资产库选择</button><button class="btn" data-reference-add="candidate">加入当前候选</button></div></div>`;
      const addViewForm = `<form class="settings-form asset-inline-form" id="assetViewForm"><label>视图名称<input name="name" placeholder="例如：入口方向" required></label><label>用途<input name="purpose" placeholder="例如：人物进场动线" required></label><div class="drawer-actions"><button type="button" class="btn" data-view-add-cancel>取消</button><button type="submit" class="btn primary">添加视图参考</button></div></form>`;

      const baseModeOptions = (detail.generationModes || []).filter(item => item.presentation !== 'advanced').map(item => `<button class="generation-mode ${item.id === detail.activeGenerationModeId ? 'active' : ''}" data-generation-mode="${item.id}" aria-pressed="${item.id === detail.activeGenerationModeId}"><b>${item.label}</b><small>${item.description}</small><span class="mode-output-list">${item.outputs.map(output => `<span class="tag">${output}</span>`).join('')}</span></button>`).join('');

      const modeOptions = `${baseModeOptions}${advancedModeOptions ? `<details style="grid-column:1/-1"><summary>空间一致性高级模式</summary><div class="generation-mode-grid" style="margin-top:10px">${advancedModeOptions}</div></details>` : ''}`;
      const activeMode = detail.generationModes?.find(item => item.id === detail.activeGenerationModeId);

      let sectionContent = '';

      if (activeSectionId === 'overview') {
        sectionContent = `<div class="look-detail-section"><h3>${typeNoun}资料</h3>${detail.editingFields ? fieldEditor : `<div class="asset-field-grid">${fields}</div><div class="asset-action-row"><button class="btn" data-structured-asset-action="edit">编辑资料</button><button class="btn" data-structured-asset-action="reference">管理参考图（${detail.referenceImages?.length || 0}）</button><button class="btn" data-structured-asset-action="library">资产库</button></div>`}</div>${detail.referenceManagerOpen ? referenceManager : ''}${stateChooser}${viewChooser}${proposed}`;
      } else if (activeSectionId === 'candidates') {
        sectionContent = `${stateChooser}${viewChooser}<div class="look-detail-section"><h3>生成设置</h3>${generationChannelSelect}${activeGenerationChannel === 'ChatGPT 网页' ? `<div class="tool-note" style="margin-top:8px"><b>网页环境：可用 ✓</b> · 检测不产生费用 <button data-chatgpt-check-env>重新检测</button></div>` : ''}<label>生图类型 <label>生图类型 <select data-structured-mode-select>${detail.generationModes.map(item => `<option value="${item.id}" ${item.id === detail.activeGenerationModeId ? 'selected' : ''}>${item.label}</option>`).join('')}</select></label><div class="tool-note">${detail.assetKind === 'scene' ? '默认使用单图；四宫格用于补充空间视角。俯视图和全景图仅在分镜引用或 H3 编译需要时展开。' : '道具默认使用单图；四视图按需补充正面、侧面、背面与顶部参考。'}</div></div><div class="look-detail-section"><h3>${activeState.name} / ${activeView.name} · 候选图（左右滑动查看更多）</h3><div class="candidate-scroll">${candidates}</div><div class="asset-action-row"><button class="btn primary" data-structured-asset-action="generate">用 ${activeGenerationChannel} 按“${activeMode?.label || '单图'}”生成候选</button><button class="btn" data-structured-asset-action="upload">上传候选</button>${detail.activeGenerationModeId === 'quad-grid' ? `<button class="btn" data-extract-grid>将最新${detail.assetKind === 'scene' ? '四宫格' : '四视图'}拆为视图参考</button>` : ''}</div></div><div class="tool-note">生成或上传只增加候选；点击候选即设为当前图，旧图保留。${detail.snapshotImpact}</div>`;
      } else if (activeSectionId === 'usage') {
        sectionContent = `<div class="look-detail-section"><h3>使用位置与影响</h3><p>按剧集、场次和分镜列出真实引用；点击可精确跳转。</p><div class="usage-list">${detail.usageTargets.map(item => `<div class="usage-card"><div><b>${item.label}</b><small>用途：${activeView.purpose}参考 · 固定当前版本快照</small></div><button class="btn" data-asset-usage-route="${item.routeId}" data-project-id="${item.params.projectId}" data-episode-id="${item.params.episodeId}" data-focus-id="${item.params.focusId}">打开分镜</button></div>`).join('')}</div><div class="tool-note">切换项目当前候选只影响未来使用；已经确认的剧集快照不会被静默改写或自动重新生成。</div></div>`;
      } else if (activeSectionId === 'records') {
        const records = detail.generationRecords || [];
        sectionContent = `<div class="look-detail-section"><h3>生成记录</h3><p>记录真实任务及其输入快照；失败任务保留原输入，可从这里恢复。</p><div class="record-list">${records.length ? records.map(item => `<div class="record-card"><div><b>${item.provider} · ${item.mode} · ${item.status}</b><small>${item.model} · ${item.createdAt}</small><small>Prompt 快照：${item.promptSnapshot}</small></div><button class="btn" data-generation-record="${item.id}">${item.status === '失败' ? '重试' : item.status === '排队中' ? '查看队列' : '查看结果'}</button></div>`).join('') : '<div class="asset-empty-inline">暂无生成记录。</div>'}</div></div>`;
      } else {

        sectionContent = `<form class="settings-form" id="assetAdvancedForm"><label>完整 Prompt<textarea name="prompt">${escapePrototypeHtml(advanced.prompt)}</textarea></label><label>负面 Prompt<textarea name="negativePrompt">${escapePrototypeHtml(advanced.negativePrompt)}</textarea></label><label>项目画面风格<input value="${escapePrototypeHtml(advanced.projectLook)}" disabled><small>项目级继承；在项目设置中修改。</small></label><div class="asset-field-grid"><div class="asset-field"><small>来源</small><b>${advanced.provenance}</b></div><div class="asset-field"><small>输入校验值</small><b>${advanced.fingerprint}</b></div></div><div class="drawer-actions"><button class="btn" type="button" data-asset-archive>归档资产</button><button class="btn primary" type="submit">保存高级设置</button></div></form>`;

      drawerBody.querySelectorAll('[data-reference-add]').forEach(button => button.addEventListener('click', () => {

    function openProjectMenuPopover(projectId, anchor) {
      closeProjectMenuPopover();
      const data = fullModel.getProjectOperationsModel(projectId);
      const popover = document.createElement('div');
      popover.className = 'project-menu-popover';
      popover.setAttribute('role', 'menu');
      popover.setAttribute('aria-label', `${data.projectTitle}项目操作`);
      popover.innerHTML = `${data.actions.map(item => `<button class="${item.id === 'delete-project' ? 'danger' : ''}" role="menuitem" data-project-operation="${item.id}">${item.label}</button>`).join('')}<hr><button role="menuitem" data-open-data-tools>高级数据工具</button>`;
      document.body.appendChild(popover);
      const rect = anchor.getBoundingClientRect();
      popover.style.top = `${Math.min(rect.bottom + 6, innerHeight - popover.offsetHeight - 12)}px`;
      popover.style.left = `${Math.max(12, Math.min(rect.right - popover.offsetWidth, innerWidth - popover.offsetWidth - 12))}px`;
      activeProjectMenuPopover = popover;
      popover.querySelectorAll('[data-project-operation]').forEach(button => button.addEventListener('click', event => {
        event.stopPropagation(); closeProjectMenuPopover(); openProjectOperationDrawer(projectId, button.dataset.projectOperation);

        event.stopPropagation(); closeProjectMenuPopover(); navigate(data.advancedToolsTarget.routeId, data.advancedToolsTarget.params);

      popover.querySelector('button')?.focus();

      if (!operation) return;
      const back = `<button class="btn" data-project-operation-back>返回项目概览</button>`;
      if (operationId === 'export-backup') {
        openDrawer(operation.label, `<div class="tool-note"><b>导出前检查完成</b><br>包含项目数据库记录、当前媒体、来源清单和版本信息；不包含 API 密钥或全局配置。</div><div class="asset-field-grid" style="margin-top:12px"><div class="asset-field"><small>归档协议</small><b>V2.1</b></div><div class="asset-field"><small>预计大小</small><b>1.8 GB</b></div><div class="asset-field"><small>运行任务</small><b>不写入备份</b></div><div class="asset-field"><small>项目修改</small><b>不会修改</b></div></div><div class="drawer-actions">${back}<button class="btn primary" data-project-operation-confirm="export-backup">导出备份</button></div>`);
      } else if (operationId === 'restore-backup') {

      } else {
        openDrawer(operation.label, `<div class="settings-warning"><b>这是可恢复删除</b><div>项目将移入回收站，运行任务必须先停止；恢复窗口内可完整恢复。不会立即物理删除媒体。</div></div><div class="asset-field-grid" style="margin-top:12px"><div class="asset-field"><small>项目</small><b>${data.projectTitle}</b></div><div class="asset-field"><small>影响</small><b>8 集 · 23 个媒体</b></div></div><label style="display:block;margin-top:12px">输入项目名称确认<input class="search" style="width:100%;margin-top:6px" data-delete-project-confirm-input placeholder="${data.projectTitle}"></label><div class="drawer-actions">${back}<button class="btn danger" data-project-operation-confirm="delete-project" disabled>移入回收站</button></div>`);

    function openDataIntegrityResultDrawer(scenarioId = 'integrity-warning') {
      const data = fullModel.getAdvancedDataToolsModel(scenarioId);
      const hasIssues = data.integrity.issues.length > 0 && scenarioId !== 'integrity-success';
      const rows = hasIssues ? data.integrity.issues.map(item => `<article class="record-card" data-integrity-issue="${item.id}"><div><span class="tag ${item.severity === 'error' ? 'danger' : 'warn'}">${item.category}</span><b>${item.title}</b><small>${item.detail}</small><small>影响：${item.affected}</small></div><button class="btn" data-integrity-recovery="${item.recovery.id}">${item.recovery.label}</button></article>`).join('') : '<div class="tool-note"><b>检查通过</b><br>本轮没有需要写入修复的问题；报告仍可查看和导出。</div>';
      const summary = data.integrity.summary;
      openDrawer('完整性检查结果', `<div class="batch-summary"><div class="asset-field"><small>正常</small><b>${summary.normal}</b></div><div class="asset-field"><small>警告</small><b>${hasIssues ? summary.warning : 0}</b></div><div class="asset-field"><small>错误</small><b>${hasIssues ? summary.error : 0}</b></div><div class="asset-field"><small>检查时间</small><b>${summary.checkedAt}</b></div></div><div class="record-list" style="margin-top:12px">${rows}</div><div class="drawer-actions"><button class="btn" data-integrity-report>查看检查报告</button><button class="btn" data-stage-drawer-action="cancel">关闭</button></div>`);
      drawerBody.querySelectorAll('[data-integrity-recovery]').forEach(button => button.addEventListener('click', () => handleDataScenarioAction(button.dataset.integrityRecovery)));

      if (actionId === 'open-media-relocation') { navigateDataTools('relocation-selecting', () => openMediaRelocationDrawer('select')); return; }
      if (actionId === 'retry-integrity-check') { startDataIntegrityCheck(); return; }
      if (actionId === 'rebuild-task-index') {
        navigateDataTools('integrity-checking');
        openDrawer('正在重建任务索引', `<div class="tool-note"><b>只重算本地任务索引</b><br>不会重新提交 Provider、覆盖候选或删除任务记录。</div>`);
        setTimeout(() => { navigateDataTools('integrity-success'); openDataIntegrityResultDrawer('integrity-success'); }, 520);
        return;
      }
      if (actionId === 'open-integrity-report') { openDataIntegrityResultDrawer('integrity-success'); return; }
      if (actionId === 'review-relocation-items') { openMediaRelocationDrawer('preview'); return; }
      if (actionId === 'open-journal') { openMigrationJournalDetail(); return; }
      if (actionId === 'view-backup') { openMigrationBackupDrawer(); return; }
      if (actionId === 'continue-migration') { beginMigrationRecovery(); return; }
      if (actionId === 'rollback-migration') { openMigrationRollbackConfirm(); return; }
      if (actionId === 'open-manual-recovery') { openMigrationManualRecovery(); return; }
      if (actionId === 'export-migration-report') { openMigrationReportDrawer(); return; }
      if (actionId === 'open-cleanup-preview') { dataToolsUiState.cleanupDryRun = true; openPhysicalCleanupDrawer('preview'); return; }
      if (actionId === 'open-cleanup-report' || actionId === 'retry-cleanup-report') { openDataCleanupReport(); return; }
      if (actionId === 'open-task-center') { navigate('tasks', {}, 'default'); return; }
      if (actionId === 'open-general-settings') { navigate('settings-general', {}, 'default'); return; }
      showToast('该安全动作已在原型中保留，当前没有额外写入。');
    }

    function openAdvancedDataToolDrawer(toolId) {
      if (toolId === 'integrity-check') { openDataIntegrityDrawer(); return; }
      if (toolId === 'media-relocation') { openMediaRelocationDrawer('select'); return; }
      if (toolId === 'migration-journal') { openMigrationJournalDrawer(); return; }
      if (toolId === 'physical-cleanup') { openPhysicalCleanupDrawer('start'); }
    }
