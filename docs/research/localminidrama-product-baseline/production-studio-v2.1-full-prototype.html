    function openStoryboardCommand(command) {
      const state = currentLocation();
      if (command === 'open-2d' || command === 'open-3d') { navigate('canvas', {}, 'restore-context'); return; }
      const stageModel = fullModel.getStoryboardStageModel(state.params.projectId,state.params.episodeId,state.scenarioId || 'default');
      if (command === 'open-cut') { navigate('studio-cut', state.params); return; }
      if (command === 'reextract') { openStoryboardReextractDrawer(stageModel); return; }
      if (command === 'import') { openStoryboardImportDrawer(stageModel); return; }
      if (command === 'generate-h3') { openH3PromptDrawer(stageModel); return; }
      if (command === 'batch') {
        const model = fullModel.getStoryboardStageModel(state.params.projectId,state.params.episodeId,'default');
        openDrawer('批量操作预检', `<div class="tool-note">先计算命中、跳过、阻塞和费用；部分失败不会回滚成功项。</div>${model.batchActions.map((item,index)=>`<div class="feature-line"><input type="checkbox" ${index<3?'checked':''}><div><b>${item.label}</b><small>${item.id==='generate-videos'?'命中 3 镜 · 跳过 4 镜 · 阻塞 2 镜 · 预计 ¥5.40':'不会静默改写已有采用结果'}</small></div></div>`).join('')}<div class="drawer-actions"><button class="btn primary" data-stage-drawer-action="batch-run">确认并执行可运行项</button></div>`); return;
      }
      if (command === 'export') {
        const model = fullModel.getStoryboardStageModel(state.params.projectId,state.params.episodeId,'default');
        openDrawer('导出分镜资料', model.exportActions.map(item=>`<div class="feature-line"><div><b>${item.label}</b><small>包含 ${item.includes}</small></div><button class="btn" data-stage-drawer-action="export-item">导出</button></div>`).join('')); return;
      }
      if (command === 'generate-video') {
        const generation = stageModel.videoGeneration;
        openDrawer('确认镜头视频生成', `<div class="tool-note"><b>Generation Envelope 已通过</b><br>Shot r18 · Recipe r7 · H3 草稿校验通过 · 3 个精确引用</div><div class="feature-line"><span>任务数 / 并发</span><b>1 / ${generation.concurrency}</b></div><div class="feature-line"><span>输出视频时长</span><b>计划 ${generation.plannedDuration} / 请求 ${generation.requestedDuration}</b></div><div class="feature-line"><span>模型与规格</span><b>${generation.aspectRatio} · ${generation.resolution}</b></div><div class="feature-line"><span>预计排队</span><b>${generation.timing.estimatedQueueWait}</b></div><div class="feature-line"><span>预计生成处理</span><b>${generation.timing.estimatedProcessingTime}</b></div><div class="feature-line"><span>预计总耗时</span><b>${generation.timing.estimatedTotalTime}</b></div><div class="feature-line"><span>预计费用</span><b>${generation.estimatedCost}</b></div><div class="tool-note">${generation.timing.estimateBasis}，是参考区间而非承诺值。没有隐式降级；成功后只追加候选，不自动替换“用于本镜”的视频。</div><div class="drawer-actions"><button class="btn" data-stage-drawer-action="cancel">取消</button><button class="btn primary" data-story-generation-confirm>确认生成</button></div>`);
        drawerBody.querySelector('[data-story-generation-confirm]').addEventListener('click',()=>{closeDrawer();navigate('studio-storyboard',state.params,'video-generating')}); return;
      }
      if (command === 'use-image') { storyboardUiState.currentImageId=storyboardUiState.previewImageId;renderLocation();showToast('已设为当前分镜图；旧候选仍保留在历史');return; }
      if (command === 'use-video') {
        const candidate = fullModel.getStoryboardStageModel(state.params.projectId,state.params.episodeId,'default').videoGeneration.candidates.find(item=>item.id===storyboardUiState.previewVideoId);
        if (!candidate || candidate.status!=='ready') { showToast('该候选尚不可用；可查看任务或按原输入重试'); return; }
        storyboardUiState.adoptedVideoId=storyboardUiState.previewVideoId;renderLocation();showToast('已用于本镜；旧视频候选和输入快照仍保留');return;
      }
      if (command === 'video-retake') {
        openDrawer('局部重拍', `<div class="settings-form"><label>原候选<input value="${storyboardUiState.previewVideoId}" readonly></label><label>重拍范围<input value="2.0–4.5s"></label><label>重拍意图<textarea>门卡亮起后，人物回头动作更克制，保持走廊和服装一致。</textarea></label></div><div class="tool-note">重拍会生成新候选，不覆盖原视频；失败可按同一输入快照重试。</div><div class="drawer-actions"><button class="btn primary" data-stage-drawer-action="retake">生成重拍候选</button></div>`);return;
      }
      const drawerMap = {
        assets:['镜头引用','按时段管理人物状态、场景、道具、首尾帧、稳定帧和音频；必需引用不可静默降级。'],
        continuity:['连续性比较','并排查看上一镜结束帧、本镜当前图和下一镜参考；只有确认稳定帧后才建立依赖。'],
        'image-history':['分镜图历史','历史候选按生成任务和输入快照分组；删除当前使用图前必须先改选。'],
        'compare-images':['图片候选比较','比较构图、人物一致性、场景一致性和技术质量；点击只预览。'],
        'generate-image':['生成图片候选','选择单图/首尾帧/多视图模式、Provider 和引用后生成；结果不会自动设为当前。'],
        'open-2d':['2D 画板','用于构图、站位和参考草图；保存为 composition_previs，不等同于正式分镜图。'],
        'open-3d':['3D 导演台','用于人物位置、机位、轴线、焦段和运动预演；截图或录制作为镜头参考。'],
        'video-history':['镜头视频候选历史','查看候选、失败任务、Recipe、Provider、费用和输入快照；改选不会删除历史。'],
        compile:['Prompt 编译','基础模式显示可读摘要；高级模式显示完整 Prompt、槽位、H3 JSON 和 AV contract。'],
        manifest:['引用能力预检','逐时段核对引用角色、能力、数量、必需/可选、降级和最终快照。'],
        filter:['镜头筛选与多选','支持状态筛选、连续/离散多选、键盘切镜和拖拽重排；确认后生成新顺序 revision。'],
      };
      const value=drawerMap[command];
      if(value){openDrawer(value[0],`<div class="tool-note">${value[1]}</div><div class="drawer-actions"><button class="btn primary" data-stage-drawer-action="ok">知道了</button></div>`);return;}
      showToast('原型已展示该操作的前置、结果和恢复语义');
    }

        openDrawer('导出成片',`<div class="tool-note"><b>交付预检通过</b><br>Picture revision 12 · Post revision 5 · 编码/黑帧/静音/字幕/目录/空间均通过。</div><div class="feature-line"><span>主文件</span><b>episode-01-r6.mp4</b></div><div class="feature-line"><span>随包文件</span><b>manifest + SRT/ASS + 质检报告</b></div><div class="drawer-actions"><button class="btn primary" data-cut-export-confirm>确认导出</button></div>`);

        openDrawer('选择稳定帧',`<div class="visual-canvas" style="min-height:190px;margin:0 0 12px"></div><label>时间点<input class="search" style="width:100%" value="00:07.200"></label><div class="tool-note" style="margin-top:10px">将创建独立 artifact：candidate video-a · sha256:a81c…；下一镜可选择引用，断开引用不删除它。</div><div class="drawer-actions"><button class="btn primary" data-stage-drawer-action="save-frame">保存稳定帧</button></div>`);return;
      }

        openDrawer('Video Gate',`<div class="feature-line"><span>已采用候选</span><b>6 镜</b></div><div class="feature-line"><span>缺少候选</span><b>2 镜</b></div><div class="feature-line"><span>生成失败</span><b>1 镜</b></div><div class="tool-note">只有采用候选或带原因与有效期的豁免才能通过；“生成成功”不等于“已采用”。</div><div class="drawer-actions"><button class="btn" data-stage-drawer-action="back-story">返回分镜处理</button><button class="btn" data-stage-drawer-action="waiver">登记豁免</button></div>`);return;
      }

        openDrawer('BGM 与混音',`<div class="settings-form"><label>策略<select><option>整集单轨</option><option>无 BGM</option><option>逐时段</option></select></label><label>目标响度<input value="-16 LUFS"></label><label>Ducking<input value="-6 dB"></label><label>淡入 / 淡出<input value="1.2s / 1.8s"></label></div><div class="tool-note">写入 Post revision，不改 Shot 状态。</div>`);return;
      }
      if(command==='subtitles'){
        openDrawer('字幕编辑',`<div class="tool-note">支持导入/从剧本生成、文本编辑、时间吸附、安全区和重叠检查。只改字幕且不改变画面时长时，不打破 Picture Lock。</div><div class="segment-card"><b>00:05.000–00:07.000</b><p>谁在那里？</p><span class="tag">安全区通过</span></div>`);return;
      }
      const explanations={
        'play-all':'按时间线顺序连续播放所有已采用镜头；缺失镜头显示明确占位。',
        'task-center':'任务状态、网页回填、重绑、取消、重试、暂停和重排均按 Provider capability 展示；未知状态保留诊断。',
        enhance:'视频增强包含技术匹配、画质修复和可选超分；不会直接覆盖当前候选。',
        'open-history':'候选历史保留输入快照、失败诊断和采用事件。',
        'history-revision':'查看 Picture revision、Post revision 和最终交付 revision 的差异与恢复点。',
        reorder:'调整镜头顺序后生成新的 Timeline revision。',trim:'调整 clip 入/出点，不裁毁原候选。',speed:'只提供基础变速，不扩展成专业 NLE。',transition:'只提供基础转场和明确时长。',
        'post-history':'每个后期步骤保留输入、输出和失败恢复点。',
      };
      if(explanations[command]){openDrawer('功能说明',`<div class="tool-note">${explanations[command]}</div>`);return;}
      showToast('该操作已进入原型状态；不会调用真实 Provider 或写入媒体');

    function bindPageActions() {
      pageRoot.querySelectorAll('[data-review-action]').forEach(button=>button.addEventListener('click',()=>{
        const action=button.dataset.reviewAction;
        if(action==='create-shell'){navigate('project-new',{},'source-picker');return;}
        if(action.startsWith('new-source-')){navigate('project-new',{},'shell-created');return;}
        if(action==='commit-project-import'){navigate('project-import',{},'succeeded');return;}
        if(action==='open-task'){openTaskDrawer();return;}
        if(action.startsWith('quick-image')||action.startsWith('quick-video')){navigate('quick-create',{},'generating');return;}
        const title=button.dataset.reviewTitle||button.textContent.trim();
        const detail=button.dataset.reviewDetail||'该操作保留输入、版本与恢复位置，不调用真实 Provider。';

      pageRoot.querySelectorAll('[data-cut-tab]').forEach(button=>button.addEventListener('click',()=>{cutUiState.activeTab=button.dataset.cutTab;renderLocation()}));
      pageRoot.querySelectorAll('[data-cut-shot]').forEach(button=>button.addEventListener('click',()=>{cutUiState.selectedShotId=button.dataset.cutShot;showToast(`已切换到 ${button.dataset.cutShot}`)}));
      pageRoot.querySelectorAll('[data-cut-command]').forEach(button=>button.addEventListener('click',()=>openCutCommand(button.dataset.cutCommand)));
      pageRoot.querySelectorAll('[data-audio-owner]').forEach(select=>select.addEventListener('change',()=>showToast(`声音 owner 已切换为 ${select.value}；冲突时将明确静音或重新生成影响`)));
      pageRoot.querySelectorAll('[data-stage-scenario-action]').forEach(button=>button.addEventListener('click',()=>{
        const action=button.dataset.stageScenarioAction;
        if(action==='back-storyboard'||action==='back-story') openCutCommand('back-storyboard');
        else if(action==='regenerate-h3'||action==='edit-h3'||action==='compare-h3-source') openStoryboardCommand('generate-h3');
        else if(action==='open-task') openTaskDrawer('task-shot-03-video');
        else if(action==='split-shot'||action==='change-provider'||action==='recompile'||action==='retry-snapshot'||action==='retry-failed') showToast('已执行恢复动作演示；原输入和成功结果保持不变');
        else showToast('已打开该异常的精确处理入口');
      }));
      pageRoot.querySelectorAll('[data-route-id]:not([data-project-route])').forEach(button => button.addEventListener('click', () => navigate(button.dataset.routeId)));
      pageRoot.querySelectorAll('[data-project-open]').forEach(card => {
        const openCard = () => {
          const target = fullModel.getProjectCardNavigationTarget({projectId:card.dataset.projectOpen,action:'open-card'});
          navigate(target.routeId,target.params);
        };
        card.addEventListener('click', event => {if (!event.target.closest('button,input,select,a')) openCard()});
        card.addEventListener('keydown', event => {if ((event.key === 'Enter' || event.key === ' ') && event.target === card){event.preventDefault();openCard()}});
      });
      pageRoot.querySelectorAll('[data-project-continue]').forEach(button => button.addEventListener('click', () => {
        const target = fullModel.getProjectCardNavigationTarget({projectId:button.dataset.projectContinue,episodeId:button.dataset.episodeId,action:'continue',continueStage:button.dataset.stage});
        navigate(target.routeId,target.params);
      }));
      pageRoot.querySelectorAll('[data-project-route]').forEach(button => button.addEventListener('click', event => navigate(event.currentTarget.dataset.routeId,{projectId:event.currentTarget.dataset.projectRoute})));
      pageRoot.querySelectorAll('[data-project-menu]').forEach(button => button.addEventListener('click', () => openProjectMenuDrawer(button.dataset.projectMenu)));
      pageRoot.querySelectorAll('[data-data-tool]').forEach(button => button.addEventListener('click', () => openAdvancedDataToolDrawer(button.dataset.dataTool)));
      pageRoot.querySelectorAll('[data-project-view]').forEach(button => button.addEventListener('click', () => {saveProjectViewMode(button.dataset.projectView);renderLocation()}));
      pageRoot.querySelectorAll('[data-bible-look]').forEach(button => button.addEventListener('click', () => navigate('project-bible',{projectId:button.dataset.bibleLook},'look')));
      pageRoot.querySelectorAll('[data-settings-edit]').forEach(button => button.addEventListener('click', () => openProjectSettingsEditor(button.dataset.settingsEdit)));
      pageRoot.querySelectorAll('[data-settings-object]').forEach(button => button.addEventListener('click', () => {
        const settings = fullModel.getProjectBibleModel(button.dataset.projectId, 'default');
        const target = settings.productionObjects.find(item => item.id === button.dataset.settingsObject).target;
        navigate(target.routeId,target.params);
      }));
      pageRoot.querySelectorAll('[data-settings-retry]').forEach(button => button.addEventListener('click', () => navigate('project-bible',{projectId:button.dataset.settingsRetry})));
      pageRoot.querySelectorAll('[data-settings-blank]').forEach(button => button.addEventListener('click', () => navigate('project-episodes',{projectId:button.dataset.settingsBlank},'blank-manual')));
      pageRoot.querySelectorAll('[data-asset-tab]').forEach(button => button.addEventListener('click', () => {
        assetListState.filters = {};
        navigate('project-assets',{projectId:button.dataset.projectId,focusId:button.dataset.assetTab === 'all' ? '' : button.dataset.assetTab});
      }));
      pageRoot.querySelectorAll('[data-asset-stat]').forEach(button => button.addEventListener('click', () => {
        const selection = fullModel.getProjectAssetStatSelection(button.dataset.assetStat);
        assetListState = { query:'', sortId:'updated-desc', filters:{ ...selection } };
        updateAssetLocation(button.dataset.projectId, assetListState);
      }));
      pageRoot.querySelectorAll('.project-asset-card').forEach(card => {
        const open = event => { if (!event?.target.closest('button')) openProjectAssetDetail(card.dataset.assetOpen); };
        card.addEventListener('click', open);
        card.addEventListener('keydown', event => {if ((event.key === 'Enter' || event.key === ' ') && event.target === card){event.preventDefault();openProjectAssetDetail(card.dataset.assetOpen)}});
      });
      pageRoot.querySelectorAll('button[data-asset-open]').forEach(button => button.addEventListener('click', event => {event.stopPropagation();openProjectAssetDetail(button.dataset.assetOpen)}));
      pageRoot.querySelectorAll('[data-asset-more]').forEach(button => button.addEventListener('click', event => {event.stopPropagation();openAssetMoreDrawer(button.dataset.assetMore)}));
      pageRoot.querySelectorAll('[data-asset-recovery]').forEach(button => button.addEventListener('click', () => {
        const action = button.dataset.assetRecovery;
        if (action === 'open-character') { openProjectAssetDetail('character-linxia'); activeProjectAssetDetail = { ...activeProjectAssetDetail, activeSectionId:'candidates', activeCandidateMedia:'image', compareOpen:true }; renderProjectAssetDetail(); }
        else if (action === 'open-scene-records') { openProjectAssetDetail('scene-lobby'); activeProjectAssetDetail = { ...activeProjectAssetDetail, activeSectionId:'records' }; renderProjectAssetDetail(); }
        else if (action === 'open-usage') { openProjectAssetDetail('character-linxia'); activeProjectAssetDetail = { ...activeProjectAssetDetail, activeSectionId:'usage' }; renderProjectAssetDetail(); }
        else if (action === 'batch') openAssetBatchDrawer(currentLocation().params.projectId);
        else if (action === 'compare-library') openAssetLibraryDrawer();
        else if (action === 'open-license') openAssetMoreDrawer('scene-corridor');
        else showToast({ relocate:'已打开文件重新定位器；确认新路径前不会改写记录', history:'已显示仍在线的历史候选，可手动设为当前', retry:'已按失败任务的原输入重新排队', refresh:'已刷新候选与当前指针，请重新选择', archive:'已改为可恢复归档；历史引用保持可读' }[action]);
      }));
      pageRoot.querySelectorAll('[data-asset-new]').forEach(button => button.addEventListener('click', () => openNewAssetDrawer()));
      pageRoot.querySelectorAll('[data-asset-library]').forEach(button => button.addEventListener('click', openAssetLibraryDrawer));
      pageRoot.querySelectorAll('[data-asset-batch]').forEach(button => button.addEventListener('click', () => openAssetBatchDrawer(button.dataset.assetBatch)));
      pageRoot.querySelectorAll('[data-asset-view]').forEach(button => button.addEventListener('click', () => {saveAssetViewMode(button.dataset.assetView);renderLocation()}));
      pageRoot.querySelectorAll('[data-asset-filter-group]').forEach(select => select.addEventListener('change', () => {
        const filters = { ...assetListState.filters };
        if (select.value) filters[select.dataset.assetFilterGroup] = select.value;
        else delete filters[select.dataset.assetFilterGroup];
        updateAssetLocation(currentLocation().params.projectId, { filters });
      }));
      pageRoot.querySelector('[data-asset-sort]')?.addEventListener('change', event => updateAssetLocation(currentLocation().params.projectId, { sortId:event.target.value }));
      pageRoot.querySelectorAll('[data-filter-clear]').forEach(button => button.addEventListener('click', () => {
        const key = button.dataset.filterClear;
        if (key === 'all') assetListState = { query:'', filters:{}, sortId:'updated-desc' };
        else if (key === 'query') assetListState.query = '';
        else if (key === 'type') delete assetListState.filters.type;
        else delete assetListState.filters[key];
        updateAssetLocation(currentLocation().params.projectId, assetListState);
      }));
      pageRoot.querySelector('[data-load-more]')?.addEventListener('click', () => showToast('当前示例资产已全部显示；正式产品每次继续加载 30～50 项'));
      pageRoot.querySelectorAll('[data-project-settings-primary]').forEach(button => button.addEventListener('click', () => {
        const settings = fullModel.getProjectBibleModel(button.dataset.projectSettingsPrimary, 'default');
        navigate(settings.primaryAction.routeId, settings.primaryAction.params, settings.primaryAction.scenarioId);
      }));
      pageRoot.querySelectorAll('[data-project-stage-summary]').forEach(button => button.addEventListener('click', () => {
        const target = fullModel.getProjectStageNavigationTarget({projectId:button.dataset.projectId,stage:button.dataset.projectStageSummary});
        navigate(target.routeId,target.params,target.scenarioId);
      }));
      pageRoot.querySelectorAll('[data-project-look]').forEach(button => button.addEventListener('click', () => openProjectLookDrawer(button.dataset.projectLook)));
      pageRoot.querySelectorAll('[data-overview-blocker-id]').forEach(button => button.addEventListener('click', () => {
        const target = fullModel.getProjectOverviewBlockerTarget({projectId:button.dataset.projectId,blockerId:button.dataset.overviewBlockerId});
        if (target.kind === 'task-drawer') openTaskDrawer(target.taskId);
        else navigate(target.routeId,target.params,target.scenarioId);
      }));
      const search = document.getElementById('projectSearch');
      if (search) search.addEventListener('input', () => {
        const term = search.value.trim().toLowerCase();
        document.querySelectorAll('.project-card').forEach(card => card.hidden = !card.textContent.toLowerCase().includes(term));
      });
      const assetSearch = document.getElementById('assetSearch');
      if (assetSearch) assetSearch.addEventListener('input', () => {
        clearTimeout(assetSearch.updateTimer);
        assetSearch.updateTimer = setTimeout(() => updateAssetLocation(currentLocation().params.projectId, { query:assetSearch.value.trim() }), 280);
      });
      document.getElementById('clearSearch')?.addEventListener('click', () => navigate('projects'));
      document.getElementById('sortButton')?.addEventListener('click', event => {event.currentTarget.textContent = event.currentTarget.textContent.startsWith('最近')?'项目名称⌄':'最近更新⌄';showToast('已切换项目排序演示');});
      document.getElementById('statusFilter')?.addEventListener('click', event => {event.currentTarget.textContent = event.currentTarget.textContent.startsWith('全部')?'有待处理⌄':'全部状态⌄';showToast('已切换项目状态筛选演示');});
    }

    function openDrawer(title, body) {
      drawerTitle.textContent = title;drawerBody.innerHTML = body;drawerBackdrop.classList.add('open');drawerBackdrop.setAttribute('aria-hidden','false');document.getElementById('closeDrawer').focus();
      drawerBody.querySelectorAll('[data-stage-drawer-action]').forEach(button=>button.addEventListener('click',()=>{closeDrawer();showToast('操作演示已完成；旧候选、输入快照和中间结果均保留')}));
    }
    function openTaskDrawer(focusTaskId = '') {
      const model=fullModel.getGlobalTaskModel(focusTaskId);
      const body = model.tasks.map(task => `<div class="task ${task.id === focusTaskId ? 'focused' : ''}" data-task-id="${task.id}"><div class="task-top"><strong>${task.title}</strong><span class="tag ${task.lifecycle === 'running' ? 'ok' : ''}"${task.lifecycle === 'blocked' ? ' style="color:var(--warn)"' : ''}>${task.status}</span></div><p>${task.lifecycle} · ${task.elapsed} · ${task.estimate}${task.progressSource==='provider'?' · Provider 真实进度':' · 无可信百分比'}</p>${task.actions.map(action=>`<button class="btn" data-task-action="${task.id}">${action}</button>`).join(' ')}</div>`).join('');
      openDrawer(focusTaskId ? '全局任务 · 已定位' : '全局任务', body);
      drawerBody.querySelectorAll('[data-task-action]').forEach(button=>button.addEventListener('click',()=>showToast(`${button.textContent.trim()}：已按该任务 capability 打开操作`)));
      if (focusTaskId) drawerBody.querySelector(`[data-task-id="${focusTaskId}"]`)?.scrollIntoView({block:'nearest'});
    }
    function closeDrawer(){drawerBackdrop.classList.remove('open');drawerBackdrop.setAttribute('aria-hidden','true');setAssetFocusInLocation('')}
    function showToast(message){const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),1800)}
    function currentLocation(){return fullModel.parsePrototypeLocation(location.hash || '#/projects')}

    document.querySelectorAll('.rail [data-route-id]').forEach(button => button.addEventListener('click', () => navigate(button.dataset.routeId)));
    document.getElementById('coverageButton').addEventListener('click', () => {
      const coverage=fullModel.buildFeatureCoverageIndex();
      const rows=coverage.map(item=>`<button class="feature-line" style="width:100%;background:transparent;color:inherit;text-align:left" data-feature-id="${item.featureId}" data-coverage-route="${item.routeId}"><code>${item.featureId}</code><span style="flex:1">${routeLabels[item.routeId]||item.routeId}</span><span class="tag ok">原型已覆盖</span></button>`).join('');
      openDrawer(`功能覆盖 · ${coverage.length}/52`, `<div class="tool-note"><b>52/52 原版本能力均有可导航原型落点</b><br>这表示规格与交互原型完成，不代表 API、数据库、Provider 或真实媒体处理已经开发。</div><div style="margin-top:12px">${rows}</div>`);
      drawerBody.querySelectorAll('[data-coverage-route]').forEach(button=>button.addEventListener('click',()=>{const routeId=button.dataset.coverageRoute;const params=routeId.startsWith('studio-')?{projectId:'7',episodeId:'1'}:routeId.startsWith('project-')&&!['project-new','project-import'].includes(routeId)?{projectId:'7'}:{};closeDrawer();navigate(routeId,params)}));
    });
    document.getElementById('scenarioButton').addEventListener('click', () => {
      const current = currentLocation();
      const definition = fullModel.buildPrototypeRouteRegistry().find(item => item.id === current.routeId);
      const buttons = definition.scenarios.map(id => `<button class="btn" data-scenario-id="${id}">${id}</button>`).join('');
      openDrawer('场景切换', `<div class="tool-note">场景写入 URL，刷新或复制地址仍可复现。</div><div class="scenario-list" style="margin-top:14px">${buttons}</div>`);
      drawerBody.querySelectorAll('[data-scenario-id]').forEach(button => button.addEventListener('click', () => {closeDrawer();navigate(current.routeId,current.params,button.dataset.scenarioId)}));
    });
    document.getElementById('taskButton').addEventListener('click', () => openTaskDrawer());
    document.getElementById('themeButton').addEventListener('click', () => {document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light'});
    document.getElementById('closeDrawer').addEventListener('click',closeDrawer);
    drawerBackdrop.addEventListener('click',event=>{if(event.target===drawerBackdrop)closeDrawer()});
    document.addEventListener('keydown',event=>{if(event.key==='Escape')closeDrawer()});
    window.addEventListener('hashchange',renderLocation);
    if (!location.hash) location.hash = '#/projects'; else renderLocation();
  </script>
</body>
</html>
