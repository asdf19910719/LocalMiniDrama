        openDrawer('生成分镜图', `<div class="tool-note"><b>默认使用 ${channel.label}</b><br>浏览器、桥接、登录和结果捕获均已检测；检测本身不产生费用。</div><div class="feature-line"><span>引用素材</span><b>${stageModel.segmentEditor.referenceChips.length} 个已绑定</b></div><div class="feature-line"><span>环境</span><b>${environment.canSubmit?'可用':'需要处理'}</b></div><div class="feature-line"><span>结果规则</span><b>只新增候选，不自动替换当前图</b></div><details style="margin-top:10px"><summary>本次使用的图片提示词</summary><p>${stageModel.imagePrompt.text}</p><div class="mini-actions"><button data-story-image-prompt-reset>恢复自动拼装</button></div></details><div class="mini-actions" style="margin-top:12px"><button data-image-channel-once="api">本次改用 API</button><button data-image-channel-once="comfyui">本次改用 ComfyUI</button><button data-open-image-settings>通道设置</button></div><div class="drawer-actions"><button class="btn" data-stage-drawer-action="cancel">取消</button><button class="btn primary" data-image-generate-confirm>使用 ${channel.label} 生成</button></div>`);
        drawerBody.querySelector('[data-image-generate-confirm]').addEventListener('click',()=>{storyboardUiState.page=fullModel.submitStoryboardImageGeneration(stageModel,{channel:resolvedChannel.channel});const candidateId=storyboardUiState.page.imageGeneration.activeTask.candidateId;closeDrawer();renderLocation();showToast(`已创建 ${channel.label} 分镜生图任务；结果将进入候选`);setTimeout(()=>{storyboardUiState.page=fullModel.completeStoryboardImageGeneration(storyboardUiState.page,{candidateId,source:channel.label});renderLocation();showToast('分镜图候选已生成；当前分镜图没有自动改变')},650)});
        drawerBody.querySelector('[data-story-image-prompt-reset]')?.addEventListener('click',()=>{storyboardUiState.page=fullModel.resetStoryboardImagePrompt(storyboardUiState.page);renderLocation();showToast('已恢复由时段与引用自动拼装的图片提示词')});
        drawerBody.querySelectorAll('[data-image-channel-once]').forEach(button=>button.addEventListener('click',()=>{const label=button.dataset.imageChannelOnce==='api'?'API':'ComfyUI';closeDrawer();showToast(`已仅对本次任务改用 ${label}；默认通道仍是 ChatGPT 网页`)}));
        drawerBody.querySelector('[data-open-image-settings]').addEventListener('click',()=>{closeDrawer();navigate('settings-ai')});
        return;
      }
      if (command === 'batch') {
        const model = stageModel;
        openDrawer('批量操作预检', `<div class="tool-note">先计算命中、跳过、阻塞和费用；部分失败不会回滚成功项。</div>${model.batchActions.map((item,index)=>`<div class="feature-line"><input type="checkbox" ${index<3?'checked':''}><div><b>${item.label}</b><small>${item.id==='generate-videos'?'命中 3 镜 · 跳过 4 镜 · 阻塞 2 镜 · 预计 ¥5.40':'不会静默改写已有采用结果'}</small></div></div>`).join('')}<div class="drawer-actions"><button class="btn primary" data-stage-drawer-action="batch-run">确认并执行可运行项</button></div>`); return;
      }
      if (command === 'export') {
        const model = stageModel;
        openDrawer('导出分镜资料', model.exportActions.map(item=>`<div class="feature-line"><div><b>${item.label}</b><small>包含 ${item.includes}</small></div><button class="btn" data-stage-drawer-action="export-item">导出</button></div>`).join('')); return;
      }
      if (command === 'generate-video') {
        const generation = stageModel.videoGeneration;
        if(!generation.gate.canSubmit){showToast(generation.gate.blockers.join('；'));return}
        let selectedCount=1;
        const renderVideoDrawer=()=>{
          const quote=fullModel.getStoryboardVideoBatchQuote(stageModel,selectedCount);
          openDrawer('确认用 H3 生成视频', `<div class="tool-note"><b>引用素材、模型能力和 H3 提示词均已通过</b><br>提交后会创建可恢复任务；生成成功只新增候选，不自动采用。</div><div class="feature-line"><span>生成数量</span><span class="mini-actions">${[1,2,3].map(item=>`<button class="${item===selectedCount?'btn':''}" data-video-count="${item}">${item} 个候选${item===1?'（默认）':''}</button>`).join('')}</span></div><div class="feature-line"><span>输出时长</span><b>${generation.outputDuration} × ${quote.count}</b></div><div class="feature-line"><span>模型与规格</span><b>${generation.provider} · ${generation.aspectRatio} · ${generation.resolution}</b></div><div class="feature-line"><span>预计耗时</span><b>${quote.time}</b></div><div class="feature-line"><span>预计费用</span><b>${quote.cost}</b></div><div class="drawer-actions"><button class="btn" data-stage-drawer-action="cancel">取消</button><button class="btn primary" data-story-generation-confirm>确认生成 ${quote.count} 个候选</button></div>`);
          drawerBody.querySelectorAll('[data-video-count]').forEach(button=>button.addEventListener('click',()=>{selectedCount=Number(button.dataset.videoCount);renderVideoDrawer()}));
          drawerBody.querySelector('[data-story-generation-confirm]').addEventListener('click',()=>{storyboardUiState.page=fullModel.submitStoryboardVideoGeneration(stageModel,{count:selectedCount});closeDrawer();renderLocation();showToast(`已提交 ${selectedCount} 个视频任务；离开页面不会中断`)});
        };
        renderVideoDrawer(); return;
      }
      if (command === 'upload-image') {
        storyboardUiState.page=fullModel.uploadStoryboardImage(stageModel);renderLocation();showToast('已上传的分镜图进入候选；点击缩略图可预览并设为当前');return;
      }
      if (command === 'video-history') { openVideoHistoryDrawer(stageModel); return; }
      if (command === 'use-video') {
        const id=stageModel.resultPanel.previewVideoCandidateId;
        try{storyboardUiState.page=fullModel.adoptStoryboardVideoCandidate(stageModel,id);renderLocation();showToast('已用于本镜；底部镜头状态和成片准备度已同步')}catch(error){showToast(error.message)}return;
      }
      if(command==='undo-video'){storyboardUiState.page=fullModel.undoStoryboardVideoAdoption(stageModel);renderLocation();showToast('已撤销采用；候选历史仍保留');return}
      if(command==='retry-video'){try{storyboardUiState.page=fullModel.retryStoryboardVideoCandidate(stageModel,stageModel.resultPanel.previewVideoCandidateId);renderLocation();showToast('已按原输入快照创建重试任务')}catch(error){showToast(error.message)}return}
      if(command==='cancel-video'){try{storyboardUiState.page=fullModel.cancelStoryboardVideoGeneration(stageModel);renderLocation();showToast('已请求取消；任务记录和输入快照继续保留')}catch(error){showToast(error.message)}return}
      if(command==='play-video'){if(stageModel.resultPanel.player.loadState!=='ready'){showToast('视频尚未加载完成');return}stageModel.resultPanel.player.playbackState=stageModel.resultPanel.player.playbackState==='playing'?'paused':'playing';storyboardUiState.page=stageModel;renderLocation();showToast(stageModel.resultPanel.player.playbackState==='playing'?'正在播放当前视频候选':'已暂停');return}
      if(command==='save-h3'){
        try{storyboardUiState.page=fullModel.startStoryboardH3Save(stageModel);renderLocation();setTimeout(()=>{storyboardUiState.page=fullModel.completeStoryboardH3Save(storyboardUiState.page,{valid:true});renderLocation();showToast('H3 草稿已保存并通过校验')},360)}catch(error){showToast(error.message)}return;
      }
      const drawerMap = {
        filter:['镜头筛选','按状态筛选未完成、失败或处理中的镜头。'],
      };
      const value=drawerMap[command];
      if(value){openDrawer(value[0],`<div class="tool-note">${value[1]}</div><div class="drawer-actions"><button class="btn primary" data-stage-drawer-action="ok">知道了</button></div>`);return;}
      showToast('原型已展示该操作的前置、结果和恢复语义');
    }

    function openCutCommand(command) {
      const state=currentLocation();
      const stageModel=cutUiState.page||fullModel.getCutStageModel(state.params.projectId,state.params.episodeId,state.scenarioId||'default');
      if(command==='back-storyboard'){navigate('studio-storyboard',state.params);return;}
      if(command==='repair-shot'){navigate('studio-storyboard',{projectId:state.params.projectId,episodeId:state.params.episodeId,shotId:stageModel.review.selectedShotId});return;}
      if(command==='play-all'){cutUiState.page=fullModel.toggleCutPlayAll(stageModel);renderLocation();showToast(cutUiState.page.review.mode==='play-all'?'连续播放已开始：按镜头顺序连播已完成镜头':'已停止连播，回到逐镜审看');return;}
      if(command==='play-pause'){cutUiState.page.review.playbackState=cutUiState.page.review.playbackState==='playing'?'paused':'playing';renderLocation();showToast(cutUiState.page.review.playbackState==='playing'?'正在播放当前镜头':'已暂停');return;}
      if(command==='prev-shot'||command==='next-shot'){try{cutUiState.page=fullModel.selectCutShotByStep(stageModel,command==='next-shot'?1:-1);renderLocation()}catch(error){showToast(error.message)}return;}
      if(command==='compose'){
        if(!stageModel.compose.gate.canCompose){showToast(stageModel.compose.gate.blockers.join('；'));return}
        const settings=stageModel.compose.settings;
        openDrawer('生成成片', `<div class="tool-note"><b>全部镜头已就绪</b><br>按分镜顺序拼接，并按以下设置混音；离开页面不会中断任务。</div><div class="feature-line"><span>整集 BGM</span><b>${stageModel.compose.bgmOptions.find(item=>item.id===settings.bgmStrategy)?.label||settings.bgmStrategy}</b></div><div class="feature-line"><span>旁白 TTS</span><b>${settings.narrationTts?'混入旁白配音':'不使用'}</b></div><div class="feature-line"><span>字幕烧录</span><b>${settings.subtitleBurn?'烧录进画面':'仅导出 SRT'}</b></div><div class="feature-line"><span>超分增强</span><b>${settings.upscale?'开启 · 更清晰耗时更长':'关闭'}</b></div><div class="drawer-actions"><button class="btn" data-stage-drawer-action="cancel">取消</button><button class="btn primary" data-cut-compose-confirm>确认生成</button></div>`);
        drawerBody.querySelector('[data-cut-compose-confirm]').addEventListener('click',()=>{cutUiState.page=fullModel.composeEpisode(stageModel);closeDrawer();renderLocation();showToast('成片生成任务已提交；完成后生成新的成片版本')});return;
      }
      if(command==='cancel-compose'){try{cutUiState.page=fullModel.cancelEpisodeCompose(stageModel);renderLocation();showToast('已请求取消；任务记录与设置继续保留')}catch(error){showToast(error.message)}return;}
      if(command==='retry-compose'){try{cutUiState.page=fullModel.composeEpisode(stageModel);renderLocation();showToast('已按原设置创建新的合成任务')}catch(error){showToast(error.message)}return;}
      if(command==='export-mp4'||command==='export-srt'){
        try{cutUiState.page=fullModel.exportCutResult(stageModel,command);renderLocation();showToast(command==='export-mp4'?'成片 MP4 已导出到输出目录':'SRT 字幕已导出')}catch(error){showToast(error.message)}return;
      }
      const drawerMap={
        'keep-stale':['继续使用旧视频','旧候选保留采用状态并参与合成；成片版本历史会记录本次选择。'],
        'open-task':['查看任务','合成任务可在全局任务中心查看进度、取消与重试。'],
        'open-diagnostic':['查看诊断','失败步骤、输入快照与恢复点都会保留。'],
        'open-output':['打开输出目录','已打开成片输出文件夹演示。'],
        'compare-versions':['比较历史版本','每个成片版本按镜头候选与设置记录差异，可回看但不会互相覆盖。'],
      };
      const value=drawerMap[command];
      if(value){openDrawer(value[0],`<div class="tool-note">${value[1]}</div><div class="drawer-actions"><button class="btn primary" data-stage-drawer-action="ok">知道了</button></div>`);return;}
      showToast('该操作已进入原型状态；不会调用真实 Provider 或写入媒体');
    }

    function bindPageActions() {
      const scriptLocation=currentLocation();
      if(scriptLocation.routeId==='studio-script'){
        const ensureScriptState=()=>{const key=`${scriptLocation.params.projectId}/${scriptLocation.params.episodeId}`;if(scriptLocation.scenarioId!=='default'){scriptUiKey=key;scriptUiState=fullModel.getScriptStageModel(scriptLocation.params.projectId,scriptLocation.params.episodeId,scriptLocation.scenarioId)}else if(!scriptUiState||scriptUiKey!==key){scriptUiKey=key;scriptUiState=getScriptStageUiModel(scriptLocation.params.projectId,scriptLocation.params.episodeId,'default')}};
        pageRoot.querySelectorAll('[data-script-action]').forEach(button=>button.addEventListener('click',()=>{
          ensureScriptState();
          const action=button.dataset.scriptAction;
          if(action==='select-scene'){scriptUiState=fullModel.selectScriptScene(scriptUiState,button.dataset.sceneId);renderLocation();return}
          if(action==='scene-menu'){openScriptSceneMenu(button.dataset.sceneId);return}
          if(action==='add-scene'){scriptUiState=fullModel.addScriptScene(scriptUiState);if(scriptLocation.scenarioId!=='default')navigate('studio-script',{projectId:scriptLocation.params.projectId,episodeId:scriptLocation.params.episodeId});else renderLocation();return}
          if(action==='ai'){openScriptAiDrawer();return}
          if(action==='paste-import'){openScriptPasteImport();return}
          if(action==='ai-draft'){openScriptAiDrawer();return}
          if(action==='manual-write'){scriptUiState=fullModel.addScriptScene(scriptUiState);if(scriptLocation.scenarioId!=='default')navigate('studio-script',{projectId:scriptLocation.params.projectId,episodeId:scriptLocation.params.episodeId});else renderLocation();showToast('已创建第一个场次，直接开始写');return}
          if(action==='history'){openScriptHistoryDrawer(scriptUiState);return}
          if(action==='compare'){openScriptVersionComparison(scriptUiState);return}
          if(action==='asset-diff'){openScriptAssetDiff(scriptUiState);return}
          if(action==='rewrite-selection'){openScriptAiDrawer('rewrite-selection');return}
          if(action==='recovery'){openDrawer('浏览器恢复副本',`<div class="tool-note"><b>恢复副本与服务端草稿不同</b><br>可以复制内容，或由恢复内容创建新草稿；不会覆盖已确认版本。</div><div class="script-diff-columns" style="margin-top:12px"><div class="removed"><small>服务端</small>${escapePrototypeHtml(scriptUiState.conflict.serverContent)}</div><div class="added"><small>浏览器恢复副本</small>${escapePrototypeHtml(scriptUiState.editor.content)}</div></div><div class="drawer-actions"><button class="btn" data-script-copy-recovery>复制恢复内容</button><button class="btn primary" data-script-use-recovery>创建新草稿</button></div>`);drawerBody.querySelector('[data-script-copy-recovery]').addEventListener('click',()=>showToast('恢复内容已复制'));drawerBody.querySelector('[data-script-use-recovery]').addEventListener('click',()=>{closeDrawer();showToast('已由恢复副本创建新草稿')});return}
          if(action==='revision'){const revision=scriptUiState.revisions.find(item=>item.key===button.dataset.revisionKey);openDrawer(revision.label,`<div class="feature-line"><span>更新时间</span><b>${revision.updatedAt}</b></div><div class="feature-line"><span>来源</span><b>${revision.source}</b></div><div class="feature-line"><span>与当前差异</span><b>${revision.differenceCount} 处</b></div><div class="tool-note">历史版本只读。复制会创建新草稿，不会覆盖任何历史。</div>${revision.key==='current'?'':`<div class="drawer-actions"><button class="btn primary" data-script-copy-history="${revision.key}">复制为新草稿</button></div>`}`);drawerBody.querySelector('[data-script-copy-history]')?.addEventListener('click',event=>{scriptUiState=fullModel.createScriptDraftFromHistory(scriptUiState,event.currentTarget.dataset.scriptCopyHistory);closeDrawer();renderLocation();showToast('已复制为新草稿')});return}
          if(action==='save'){scriptUiState=fullModel.startScriptDraftSave(scriptUiState);renderLocation();setTimeout(()=>{scriptUiState=fullModel.completeScriptDraftSave(scriptUiState,new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}));renderLocation()},360);return}
          if(action==='primary'){
            if(scriptUiState.primaryAction.id==='enter-assets'){navigate('studio-assets',{projectId:scriptUiState.projectId,episodeId:scriptUiState.episodeId});return}
            if(scriptUiState.primaryAction.id==='retry-save'){scriptUiState=fullModel.startScriptDraftSave(scriptUiState);renderLocation();setTimeout(()=>{scriptUiState=fullModel.completeScriptDraftSave(scriptUiState,'刚刚');renderLocation()},360);return}
            if(scriptUiState.primaryAction.id==='resolve-conflict'){openScriptConflict(scriptUiState);return}
            openScriptApprovalCheck();return;
          }
        }));

      const wrap = document.createElement('div');
      wrap.className = 'style-modal-backdrop';
      wrap.innerHTML = `<div class="style-modal"><div class="drawer-head"><h2>${title}</h2><button class="icon-btn" id="centralModalClose" aria-label="关闭">×</button></div><div id="centralModalBody">${body}</div></div>`;
      document.body.appendChild(wrap);
      wrap.querySelector('#centralModalClose').addEventListener('click', () => wrap.remove());
    }
    function openDrawer(title, body, opts = {}) {
      drawerCloseGuard = null;
      drawerTitle.textContent = title;document.querySelector('.drawer').classList.toggle('wide', Boolean(opts.wide));drawerBody.innerHTML = body;drawerBackdrop.classList.add('open');drawerBackdrop.setAttribute('aria-hidden','false');document.getElementById('closeDrawer').focus();
      drawerBody.querySelectorAll('[data-stage-drawer-action]').forEach(button=>button.addEventListener('click',()=>{closeDrawer();showToast('操作演示已完成；旧候选、输入快照和中间结果均保留')}));
    }
    function handleTaskPrimary(task) {
      if (task.primaryAction.disabled) { showToast('当前离线；连接恢复后才能执行此操作'); return; }
      const target=task.primaryAction.target;
      if (!target) { showToast('该任务暂无可执行动作'); return; }
      closeDrawer(true);
      if (target.routeId === 'tasks') { navigate('tasks',target.params||{},target.scenarioId||'default'); return; }
      navigate(target.routeId,target.params||{},target.scenarioId||'default');
    }
    function openTaskDrawer(focusTaskId = '') {
      const current=currentLocation();
      const center=fullModel.getTaskCenterModel({projectId:current.params.projectId,episodeId:current.params.episodeId,focusTaskId},current.scenarioId);
      const task=center.tasks.find(item=>item.id===focusTaskId) || center.tasks[0];
      if(!task){openDrawer('全局任务','<div class="empty"><h2>没有可查看的任务</h2><p>清除筛选后再试。</p></div>');return;}
      const lifecycle=[['提交',task.timestamps.submittedAt],['开始',task.timestamps.startedAt||'尚未开始'],['最后确认',task.timestamps.lastConfirmedAt],['完成',task.timestamps.completedAt||'尚未完成']];
      const body=`<div class="task-drawer-section"><div class="task-top"><strong>${task.creatorStatus}</strong><span class="tag">${task.taskType} · ${task.provider}</span></div><p>${task.context.project} / ${task.context.episode} / ${task.context.stage} / ${task.context.object}</p><div class="drawer-actions"><button class="btn primary" data-task-drawer-primary="${task.id}" ${task.primaryAction.disabled?'disabled':''}>${task.primaryAction.label}</button></div></div><div class="task-drawer-section"><b>生命周期</b>${lifecycle.map(item=>`<div class="feature-line"><span>${item[0]}</span><b>${item[1]}</b></div>`).join('')}<div class="feature-line"><span>排队 / 执行 / 总计</span><b>${task.timestamps.queueDuration} · ${task.timestamps.executionDuration} · ${task.timestamps.totalDuration}</b></div></div><div class="task-drawer-section"><b>输入与费用</b><div class="feature-line"><span>Provider / 模型</span><b>${task.provider} · ${task.model}</b></div><div class="feature-line"><span>预计 / 实际</span><b>${task.cost.estimate} / ${task.cost.actual||'—'} · ${task.cost.billingStatus}</b></div><div class="tool-note">任务使用冻结输入快照；重试会创建新的 attempt，既有候选不会被覆盖。</div></div>${task.error?`<div class="task-drawer-section"><b>错误与恢复</b><div class="feature-line"><span>${task.error.code}</span><b>${task.error.userMessage}</b></div><p>来源：${task.error.source} · 计费：${task.error.charged}</p></div>`:''}<details class="task-drawer-section"><summary>技术详情</summary><div class="feature-line"><span>lifecycle</span><b>${task.lifecycle}</b></div><div class="feature-line"><span>attempt</span><b>${task.technical.attemptId}</b></div><div class="feature-line"><span>fingerprint</span><b>${task.technical.fingerprint}</b></div><div class="feature-line"><span>runtime owner</span><b>${task.technical.runtimeOwner}</b></div></details>`;
      openDrawer(focusTaskId ? '任务详情 · 已定位' : '任务详情', body);
      drawerBody.querySelector('[data-task-drawer-primary]')?.addEventListener('click',()=>handleTaskPrimary(task));
      drawerBody.querySelector('[data-task-drawer-primary]')?.focus();
    }
    function closeDrawer(force=false){if(force!==true&&drawerCloseGuard){drawerCloseGuard();return}drawerCloseGuard=null;drawerBackdrop.classList.remove('open');drawerBackdrop.setAttribute('aria-hidden','true');setAssetFocusInLocation('')}

    document.addEventListener('change',event=>{
      const modeSel=event.target.closest('[data-character-generation-mode-select]');
      if(modeSel){const st=activeProjectAssetDetail.characterStates.find(item=>item.id===activeProjectAssetDetail.activeStateId)||activeProjectAssetDetail.characterStates[0];st.generationModeId=modeSel.value;renderProjectAssetDetail();showToast('生图类型已更新；每个状态独立保存');return}
      const structSel=event.target.closest('[data-structured-mode-select]');
      if(structSel){activeProjectAssetDetail.activeGenerationModeId=structSel.value;renderProjectAssetDetail();showToast('生图类型已更新');return}
    });
    document.addEventListener('click',event=>{
      if(event.target.closest('[data-chatgpt-check-env]')){showToast('环境检测完成：浏览器、桥接和登录均可用；检测不产生费用');return}
      if(event.target.closest('[data-more-action="delete"]')){showToast('删除前会检查引用：当前素材被剧集引用，需先解除引用（原型演示）');return}
    });
    function showToast(message){const toast=document.getElementById('toast');toast.classList.remove('actionable');toast.textContent=message;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),1800)}
    function showUndoToast(message,onUndo){const toast=document.getElementById('toast');toast.classList.add('actionable');toast.innerHTML=`${escapePrototypeHtml(message)}<button type="button">撤销</button><small style="display:block;color:var(--muted)">只影响未来选择；已确认剧集快照不变。</small>`;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),5000);toast.querySelector('button').addEventListener('click',()=>{clearTimeout(showToast.timer);onUndo();})}
    function currentLocation(){return fullModel.parsePrototypeLocation(location.hash || '#/projects')}
    function guardProjectAssetMutation(action){
      const scenarioId=currentLocation().scenarioId;
      if(scenarioId==='read-only'){
        showToast('项目当前为只读状态；请恢复写入权限后再操作');
        return true;
      }
      if(scenarioId==='low-disk' && (action==='generate' || action==='upload')){
        showToast('本地磁盘空间不足；清理或更换存储位置后再提交');
        return true;
      }
      if(scenarioId==='adoption-failed' && action==='select'){
        showToast('设为当前图时保存失败；原当前图保持不变，可刷新后重试');
        return true;
      }
      if(scenarioId==='upload-invalid' && action==='upload'){
        showToast('文件格式或内容不受支持；请重新选择有效图片或音视频');
        return true;
      }
      if(scenarioId==='unsupported-mode' && action==='generate'){
        showToast('当前通道不支持此生成模式；请切换模式或生成通道');
        return true;
      }
      if(scenarioId==='reference-limit' && action==='generate'){
        showToast('参考图数量超过通道上限；请减少引用后重新预检');
        return true;
      }
      return false;
    }

    document.querySelectorAll('.rail [data-route-id]').forEach(button => button.addEventListener('click', () => navigate(button.dataset.routeId)));
    document.getElementById('coverageButton').addEventListener('click', () => {
      const coverage=fullModel.buildFeatureCoverageIndex();
      const rows=coverage.map(item=>`<button class="feature-line" style="width:100%;background:transparent;color:inherit;text-align:left" data-feature-id="${item.featureId}" data-coverage-route="${item.routeId}"><code>${item.featureId}</code><span style="flex:1">${routeLabels[item.routeId]||item.routeId}</span><span class="tag ok">原型已覆盖</span></button>`).join('');
      openDrawer(`功能覆盖 · ${coverage.length}/52`, `<div class="tool-note"><b>52/52 原版本能力均有可导航原型落点</b><br>这表示规格与交互原型完成，不代表 API、数据库、Provider 或真实媒体处理已经开发。</div><div style="margin-top:12px">${rows}</div>`);
      drawerBody.querySelectorAll('[data-coverage-route]').forEach(button=>button.addEventListener('click',()=>{const routeId=button.dataset.coverageRoute;const params=routeId.startsWith('studio-')?{projectId:'7',episodeId:'1'}:routeId.startsWith('project-')&&!['project-new','project-import'].includes(routeId)?{projectId:'7'}:{};closeDrawer();navigate(routeId,params)}));
    });
    document.getElementById('scenarioButton').addEventListener('click', () => {
      const current = currentLocation();
      const definition = fullModel.buildPrototypeRouteRegistry().find(item => item.id === current.routeId);
      const buttons = definition.scenarios.map(id => `<button class="btn" data-scenario-id="${id}">${id}</button>`).join('');
      openDrawer('场景切换', `<div class="tool-note">场景写入 URL，刷新或复制地址仍可复现。</div><div class="scenario-list" style="margin-top:14px">${buttons}</div>`);
      drawerBody.querySelectorAll('[data-scenario-id]').forEach(button => button.addEventListener('click', () => {closeDrawer();navigate(current.routeId,current.params,button.dataset.scenarioId)}));
    });
    document.getElementById('moreToolsButton').addEventListener('click', () => {
      const entries=fullModel.getAuxiliaryToolEntries({projectId:'7',episodeId:'1'}).moreTools;
      openDrawer('更多工具', `<div class="tool-note">这些能力保留，但不会与“完成一集成片”的默认路径竞争。</div>${entries.map(item=>`<button class="review-item" style="width:100%;margin-top:10px" data-more-tool="${item.routeId}"><div><b>${item.label}</b><small>${item.description}</small></div><span>›</span></button>`).join('')}`);
      drawerBody.querySelectorAll('[data-more-tool]').forEach(button=>button.addEventListener('click',()=>{closeDrawer();navigate(button.dataset.moreTool)}));
    });
    document.getElementById('taskButton').addEventListener('click', () => navigate('tasks'));
    document.getElementById('themeButton').addEventListener('click', () => {document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light'});
    document.getElementById('closeDrawer').addEventListener('click',closeDrawer);
    drawerBackdrop.addEventListener('click',event=>{if(event.target===drawerBackdrop)closeDrawer()});
    document.addEventListener('keydown',event=>{if(event.key==='Escape')closeDrawer()});
    window.addEventListener('hashchange',renderLocation);
    if (!location.hash) location.hash = '#/projects'; else renderLocation();
  </script>
</body>
</html>
