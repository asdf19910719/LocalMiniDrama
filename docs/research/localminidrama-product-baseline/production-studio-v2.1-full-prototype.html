    function bindExternalAiWizard(projectId) {
      pageRoot.querySelectorAll('[data-external-wizard-exit]').forEach(button=>button.addEventListener('click',()=>{externalAiUiState={...externalAiUiState,step:'target'};closeDrawer();navigate('project-episodes',{projectId})}));
      pageRoot.querySelectorAll('[data-external-wizard-target]').forEach(button=>button.addEventListener('click',()=>{
        const mode=button.dataset.mode;const episodeId=button.dataset.episodeId||'';
        externalAiUiState={...externalAiUiState,targetMode:mode,targetEpisodeId:episodeId,step:'target'};
        renderLocation();
      }));
      pageRoot.querySelectorAll('[data-external-wizard-back]').forEach(button=>button.addEventListener('click',()=>{externalAiUiState={...externalAiUiState,step:button.dataset.back};renderLocation()}));
      pageRoot.querySelectorAll('[data-external-wizard-next]').forEach(button=>button.addEventListener('click',()=>{
        externalAiUiState={...externalAiUiState,step:button.dataset.next};
        renderLocation();
      }));

      pageRoot.querySelectorAll('[data-external-wizard-import]').forEach(button=>button.addEventListener('click',()=>{episodeUiState.importProtocol='external-ai-result';episodeUiState.targetMode=externalAiUiState.targetMode;episodeUiState.assetDecisions={};openEpisodeImportWizard(projectId,1,{creationContext:'existing-project'})}));
      pageRoot.querySelectorAll('[data-external-wizard-open-script]').forEach(button=>button.addEventListener('click',()=>{externalAiUiState={...externalAiUiState,step:'target',taskNote:''};navigate('studio-script',{projectId,episodeId:'new'},'blocked')}));
    }

    function renderStoryboardStage(projectId, episodeId, scenarioId, resumeParams = {}) {
      const key=`${projectId}/${episodeId}/${scenarioId}`;
      if(storyboardUiState.key!==key||!storyboardUiState.page){
        storyboardUiState.key=key;
        storyboardUiState.page=fullModel.getStoryboardStageModel(projectId,episodeId,scenarioId);
        if(resumeParams.shotId&&storyboardUiState.page.shotDetails.some(item=>item.id===resumeParams.shotId)) storyboardUiState.page=fullModel.selectStoryboardShot(storyboardUiState.page,resumeParams.shotId);
      }
      const model=storyboardUiState.page;
      const resumeBanner=resumeParams.shotId?`<div class="stage-scenario info"><span class="tag ok">已恢复</span><div><b>${model.sceneSummary.selected} · 镜头 ${model.selectedShot?.number||''}</b><small>已恢复到上次镜头和工作模式。</small></div></div>`:'';
      if(model.pageState==='loading') return `<section class="studio-page" data-feature-id="STORYBOARD-001">${renderStudioHead(model,'storyboard')}<div>${renderStageScenario(model.scenario)}</div><div class="story-empty"><div><div class="empty-mark">↻</div><h2>正在恢复分镜工作台</h2><p>场次、镜头、候选与上次工作位置正在载入。</p></div></div><footer class="shot-rail"><span class="tag">加载中</span></footer></section>`;
      if(model.pageState==='empty') return `<section class="studio-page" data-feature-id="STORYBOARD-001">${renderStudioHead(model,'storyboard')}<div>${renderStageScenario(model.scenario)}</div><div class="story-empty"><div><div class="empty-mark">＋</div><h2>本集还没有分镜</h2><p>从已确认剧本创建镜头，或导入 Excel、CSV、Shot Package 分镜结构。</p><div class="actions"><button class="btn primary" data-story-command="create-from-script">从已确认剧本创建</button><button class="btn" data-story-command="import">${model.storyboardImport.label}</button></div></div></div><footer class="shot-rail"><span>0 镜 · 尚未开始</span></footer></section>`;
      const shot=model.selectedShot;
      const imageStatusLabels={current:'已选用',stale:'需要更新',optional:'可选',missing:'未生成'};
      const videoStatusLabels={adopted:'已用于本镜',stale:'需确认旧视频',ready:'有可用候选',generating:'生成中',missing:'未生成',failed:'生成失败'};
      const saveLabels={saved:'已自动保存',dirty:'有未保存修改',saving:'保存中',conflict:'版本冲突','save-failed':'保存失败'};
      const sceneOptions=model.scenes.map(item=>`<option value="${item.id}" ${item.id===model.selectedSceneId?'selected':''}>${item.label}</option>`).join('');
      const shotOptions=model.shotDetails.filter(item=>item.sceneId===model.selectedSceneId).map(item=>`<option value="${item.id}" ${item.id===model.selectedShotId?'selected':''}>镜头 ${item.number} · ${item.durationSeconds}s</option>`).join('');
      const assetRow = (item, index) => `<button class="story-asset-thumb ${item.status==='missing'?'missing':''}" data-asset-preview="${index}"><div><b>${item.label}</b><small>${item.status==='missing'?'缺失 · 点击查看':'已固定本集版本 · 点击查看'}</small></div></button>`;
      const inspectorCharacters=model.inspector.characters.map((item,i)=>assetRow(item, i+1)).join('')||'<p>本镜尚未添加出场角色。</p>';
      const inspectorScene=model.inspector.scene?assetRow(model.inspector.scene, model.inspector.characters.length+1):'<p>本镜尚未选择场景。</p>';
      const inspectorProps=model.inspector.props.map((item,i)=>assetRow(item, model.inspector.characters.length+2+i)).join('')||'<p>本镜尚未添加场景道具。</p>';
      const frameChaining=model.inspector.frameChaining;
      const frameRow=frameChaining.enabled?`<div class="story-asset-thumb"><div><b>首尾帧衔接</b><small>${frameChaining.previousLabel} → ${frameChaining.currentLabel} · ${frameChaining.status==='linked'?'已衔接':frameChaining.status==='available'?'可衔接':'等待上一镜完成'}</small></div></div>`:'<p>本镜是第一镜，没有上一镜尾帧可衔接。</p>';
      const imageThumb=item=>`<button class="story-image-thumb ${item.isCurrent?'current':''}" data-story-image-candidate="${item.id}"><span class="thumb-visual ${item.tone||''}"></span><b>${item.label}${item.isCurrent?' · 当前':''}</b><small>${item.meta.replace(/ · 当前/g,'')}</small></button>`;
      const leftImageSection=`<section class="studio-section"><h3>分镜图</h3><div class="story-image-thumbs">${model.imageCandidates.map(imageThumb).join('')||'<p>尚无分镜图候选。</p>'}</div><div class="mini-actions" style="margin-top:8px"><button class="btn" data-story-command="generate-image" ${model.imageGeneration.activeTask?'disabled':''}>${model.imageGeneration.activeTask?'生成中…':'生成分镜图'}</button><button data-story-command="upload-image">上传图片</button></div></section>`;
      const leftPanel=`<aside class="studio-panel"><div class="studio-panel-head"><strong>镜头 ${shot.number}</strong><span class="tag">${shot.durationSeconds}s</span><span class="tag ${shot.autoSave==='saved'?'ok':''}">${saveLabels[shot.autoSave]||shot.autoSave}</span></div><section class="studio-section"><h3>出场角色</h3>${inspectorCharacters}</section><section class="studio-section"><h3>分镜场景</h3>${inspectorScene}</section><section class="studio-section"><h3>场景道具</h3>${inspectorProps}</section><section class="studio-section"><h3>首尾帧</h3>${frameRow}<button class="btn" data-story-command="assets">管理镜头引用</button></section>${leftImageSection}</aside>`;
      const referenceChips=model.segmentEditor.referenceChips.map(item=>`<span class="asset-chip ${item.status==='missing'?'missing':''}">@图片${item.index} ${item.label}</span>`).join('');
      const segments=shot.segments.map((segment,index)=>`<article class="segment-card" data-feature-id="STORYBOARD-004"><div class="segment-top"><strong>${segment.timecode}</strong><span class="spacer"></span><button class="btn" data-segment-action="split" data-segment-id="${segment.id}">拆分</button></div><label><small>画面与动作</small><textarea class="story-segment-input" rows="3" data-story-segment-field="visual" data-segment-id="${segment.id}">${segment.visual}</textarea></label><label><small>对白与声音</small><textarea class="story-segment-input" rows="2" data-story-segment-field="dialogue" data-segment-id="${segment.id}">${segment.dialogue}</textarea></label><div>${(segment.assets||[]).map(item=>`<span class="asset-chip">${item}</span>`).join('')}</div><div class="mini-actions"><button data-segment-action="merge" data-segment-id="${segment.id}" ${index===shot.segments.length-1?'disabled':''}>与下一段合并</button><button data-segment-action="move-up" data-segment-id="${segment.id}" ${index===0?'disabled':''}>上移</button><button data-segment-action="move-down" data-segment-id="${segment.id}" ${index===shot.segments.length-1?'disabled':''}>下移</button></div></article>`).join('');
      const h3Draft=model.h3Draft;
      const h3Tone={stale:'warn',dirty:'warn',saving:'warn',invalid:'danger'}[h3Draft.status]||'ok';
      const h3Block=`<section class="studio-section" data-feature-id="STORYBOARD-008"><h3>H3 提示词</h3><div class="feature-line"><span>状态</span><span class="tag ${h3Tone}">${h3Draft.statusLabel}</span></div><div class="mini-actions" style="margin:7px 0"><button class="btn" data-story-command="generate-h3">${h3Draft.actionLabel}</button><button data-story-command="save-h3" ${h3Draft.status==='dirty'?'':'disabled'}>保存并校验草稿</button></div><details ${['stale','invalid','dirty'].includes(h3Draft.status)?'open':''}><summary>查看并编辑草稿</summary><div class="feature-line"><span>来源</span><b>${h3Draft.sourceLabel}</b></div><textarea class="story-shot-description" rows="6" data-story-h3-draft>${h3Draft.text}</textarea><div>${h3Draft.validationChecks.map(item=>`<span class="asset-chip">${item}</span>`).join('')}${(h3Draft.validationErrors||[]).map(item=>`<span class="asset-chip missing">${item}</span>`).join('')}</div></details></section>`;
      const imagePrompt=model.imagePrompt;
      const imagePromptBlock=`<section class="studio-section"><h3>分镜图提示词${imagePrompt.manuallyEdited?' <span class="tag ok">已手工覆盖</span>':''}</h3><details ${imagePrompt.manuallyEdited||imagePrompt.autoSave!=='saved'?'open':''}><summary>${imagePrompt.sourceLabel}</summary><textarea class="story-shot-description" rows="3" data-story-image-prompt>${imagePrompt.text}</textarea><div class="mini-actions"><button data-story-image-prompt-reset>恢复自动拼装</button></div></details></section>`;
      const gateRows=model.videoGeneration.gate.checks.map(item=>`<div class="story-gate-row"><span>${item.label}</span><span class="tag ${item.passed?'ok':''}">${item.passed?'通过':'需处理'}</span></div>`).join('');
      const generateBar=`<section class="studio-section" data-feature-id="STORYBOARD-009"><h3>生成本镜视频</h3><div class="mini-actions"><button class="btn primary" data-story-command="generate-video" ${model.videoGeneration.gate.canSubmit?'':'disabled'}>用 H3 生成视频 · ${model.videoGeneration.estimatedCost}</button>${model.videoGeneration.activeTask?`<button data-story-command="cancel-video">取消当前任务</button>`:''}</div><div class="feature-line" style="margin-top:8px"><span>输出时长</span><b>${model.videoGeneration.outputDuration}</b></div><div class="feature-line"><span>预计耗时</span><b>${model.videoGeneration.estimatedTime}</b></div>${gateRows}${model.videoGeneration.gate.blockers.length?`<div class="tool-note">${model.videoGeneration.gate.blockers.join('；')}</div>`:''}</section>`;
      const middlePanel=`<main class="studio-panel"><div class="studio-panel-head"><strong>时段提示词 · 镜头 ${shot.number}</strong><span class="tag">${shot.segments.length} 个时段</span></div><section class="studio-section"><h3>引用素材</h3><div>${referenceChips||'<p>本镜尚未绑定引用素材。</p>'}</div></section><section class="studio-section"><h3>时段提示词</h3>${segments}</section>${imagePromptBlock}${h3Block}${generateBar}</main>`;
      const videoCandidates=model.videoGeneration.candidates.map(item=>`<button class="candidate-card ${model.resultPanel.previewVideoCandidateId===item.id?'active':''} ${item.isAdopted?'adopted':''}" data-story-video-candidate="${item.id}" data-video-status="${item.status}"><span class="candidate-preview ${item.status==='failed'?'amber':''}"></span><b>${item.label}${item.isAdopted?' · 用于本镜':''}</b><small>${item.status==='failed'?'失败 · 可重试':item.status==='running'?'生成中':item.sourceState==='previous-image'?'可用 · 基于旧分镜图':`${item.duration} · ${item.resolution}`}</small></button>`).join('');
      const previewCandidate=model.videoGeneration.candidates.find(item=>item.id===model.resultPanel.previewVideoCandidateId);
      const mainPreview=`<div class="story-main-preview video" aria-label="视频主预览"><button class="play-control" data-story-command="play-video" ${model.resultPanel.player.loadState==='ready'?'':'disabled'}>▶</button><span class="preview-caption">${previewCandidate?`${previewCandidate.label} · ${previewCandidate.duration||''} · ${previewCandidate.sourceState==='previous-image'?'基于旧分镜图':'当前输入'}`:'选择视频候选后在这里播放审核'}</span></div>`;
      const mediaActions=`<button data-story-command="use-video" ${model.resultPanel.player.loadState==='ready'?'':'disabled'}>用于本镜</button><button data-story-command="undo-video" ${model.videoGeneration.adoptedCandidateId?'':'disabled'}>撤销采用</button><button data-story-command="retry-video" ${previewCandidate?.status==='failed'?'':'disabled'}>按原输入重试</button>`;
      const rightPanel=`<aside class="studio-panel"><div class="studio-panel-head"><strong>视频审核 · 镜头 ${shot.number}</strong><span class="tag ${model.videoGeneration.gate.canSubmit?'ok':''}">${model.videoGeneration.gate.canSubmit?'可生成':'需处理'}</span><button class="btn" data-story-command="video-history">生成历史</button></div>${mainPreview}<div class="story-candidate-film">${videoCandidates}</div><section class="studio-section"><div class="mini-actions">${mediaActions}</div></section></aside>`;
      const shotRail=model.shots.map(item=>`<button class="shot-card ${item.tone} ${item.id===model.selectedShotId?'selected':''}" data-shot-select="${item.id}"><b>镜头 ${item.number} · ${item.duration}s</b><small>分镜图：${imageStatusLabels[item.imageStatus]||item.imageStatus}</small><small>视频：${videoStatusLabels[item.videoStatus]||item.videoStatus}</small></button>`).join('');
      return `<section class="studio-page" data-feature-id="STORYBOARD-001">${renderStudioHead(model,'storyboard')}<div>${resumeBanner}${renderStageScenario(model.scenario)}<div class="studio-toolbar"><select aria-label="场次" data-story-scene-select>${sceneOptions}</select><select aria-label="当前镜头" data-story-shot-select>${shotOptions}</select><button class="btn" data-story-shot-prev ${model.progress.current<=1?'disabled':''}>‹ 上一镜</button><button class="btn" data-story-shot-next ${model.progress.current>=model.progress.total?'disabled':''}>下一镜 ›</button><span class="tag">${model.progress.adopted}/${model.progress.total} 已采用</span><div class="spacer"></div><button class="btn" data-story-command="batch">批量生成</button><details><summary class="btn">更多</summary><div class="popover-menu" style="display:grid"><button data-story-command="reextract">更新分镜结构</button><button data-story-command="import">${model.storyboardImport.label}</button><button data-story-command="export">导出分镜资料</button><button data-story-command="advanced-canvas">高级画布</button></div></details></div></div>
        <div class="story-workbench" data-feature-id="STORYBOARD-002">${leftPanel}${middlePanel}${rightPanel}</div>
        <footer class="shot-rail" data-feature-id="STORYBOARD-012"><button class="btn" data-story-command="filter">筛选未完成 / 失败 / 处理中</button>${shotRail}<span class="spacer"></span><button class="btn primary" data-story-command="open-cut">${model.nextStage.label}</button></footer></section>`;
    }

    function getCutUiModel(projectId, episodeId, scenarioId) {
      const key=`${projectId}/${episodeId}/${scenarioId}`;
      if(cutUiState.key!==key||!cutUiState.page){cutUiState.key=key;cutUiState.page=fullModel.getCutStageModel(projectId,episodeId,scenarioId)}
      return cutUiState.page;
    }

    function renderCutStage(projectId, episodeId, scenarioId) {
      const model=getCutUiModel(projectId,episodeId,scenarioId);
      const review=model.review;
      const compose=model.compose;
      const shell=inner=>`<section class="studio-page" data-feature-id="CUT-001">${renderStudioHead(model,'cut')}${inner}</section>`;
      if(model.scenarioId==='loading') return shell(`<div>${renderStageScenario(model.scenario)}</div><div class="story-empty"><div><div class="empty-mark">↻</div><h2>正在恢复短片工作台</h2><p>镜头、成片版本与导出状态正在载入。</p></div></div><footer class="shot-rail"><span class="tag">加载中</span></footer>`);
      if(review.shots.length===0) return shell(`<div>${renderStageScenario(model.scenario)}</div><div class="story-empty"><div><div class="empty-mark">＋</div><h2>本集还没有可审片的镜头</h2><p>返回分镜生成并采用至少一个镜头视频后再来审片。</p><div class="actions"><button class="btn primary" data-cut-command="back-storyboard">返回分镜</button></div></div></div><footer class="shot-rail"><span>0 镜 · 尚未开始</span></footer>`);
      const statusLabels={completed:'已完成',stale:'需确认旧视频',generating:'生成中',failed:'生成失败',missing:'未生成'};
      const sceneIds=[...new Set(review.shots.map(item=>item.sceneId))];
      const sceneOptions=['all',...sceneIds].map(id=>`<option value="${id}" ${review.sceneFilter===id?'selected':''}>${id==='all'?'全部场次':`场次 ${id.replace('scene-','')}`}</option>`).join('');
      const scopedShots=review.sceneFilter==='all'?review.shots:review.shots.filter(item=>item.sceneId===review.sceneFilter);
      const shotOptions=scopedShots.map(item=>`<option value="${item.id}" ${item.id===review.selectedShotId?'selected':''}>镜头 ${item.number} · ${item.duration}s</option>`).join('');
      const currentShot=review.currentShot;
      const playerCaption=review.mode==='play-all'
        ? '连续播放 · 第 1 集 · 已完成镜头按顺序连播'
        : `镜头 ${currentShot.number} · ${currentShot.sourceLabel}`;
      const player=`<div class="cut-player" aria-label="短片审片播放器"><span class="cut-player-caption">${playerCaption}</span><button class="play-control" data-cut-command="play-pause">${review.playbackState==='playing'?'Ⅱ':'▶'}</button><div class="cut-player-controls"><button data-cut-command="prev-shot">|◀</button><button data-cut-command="play-pause">${review.playbackState==='playing'?'暂停':'播放'}</button><button data-cut-command="next-shot">▶|</button></div></div>`;
      const repairNote=currentShot.stale?'<div class="tool-note" style="margin-top:10px">当前镜头候选基于旧分镜图；合成前建议回分镜确认。</div>':'';
      const mainPanel=`<main class="studio-panel"><div class="studio-panel-head"><strong>${review.mode==='play-all'?'连续播放整集':`镜头 ${currentShot.number} 审看`}</strong><span class="tag">${review.completed}/${review.total} 已完成</span><span class="tag ${currentShot.stale?'':'ok'}">${statusLabels[currentShot.status]||'已完成'}</span></div>${player}<section class="studio-section"><div class="mini-actions"><button class="btn" data-cut-command="repair-shot">回分镜修复此镜</button><span class="tag">${currentShot.candidateId?currentShot.candidateId:'无候选'}</span></div>${repairNote}</section></main>`;
      const settingSelect=(key,label,options,current)=>`<label>${label}<select data-cut-setting="${key}">${options.map(item=>`<option value="${item.value}" ${String(current)===String(item.value)?'selected':''}>${item.label}</option>`).join('')}</select></label>`;
      const settingsPanel=`<aside class="studio-panel"><div class="studio-panel-head"><strong>成片设置</strong><span class="tag ${compose.gate.canCompose?'ok':''}">${compose.gate.canCompose?'可合成':'需处理'}</span></div><section class="studio-section"><div class="settings-form">${settingSelect('bgmStrategy','整集 BGM',compose.bgmOptions.map(item=>({value:item.id,label:item.label})),compose.settings.bgmStrategy)}${settingSelect('narrationTts','旁白 TTS',[{value:'true',label:'开 · 混入旁白配音'},{value:'false',label:'关'}],compose.settings.narrationTts)}${settingSelect('subtitleBurn','字幕烧录',[{value:'true',label:'开 · 烧录进画面'},{value:'false',label:'关 · 仅导出 SRT'}],compose.settings.subtitleBurn)}${settingSelect('upscale','超分增强',[{value:'true',label:'开 · 更清晰耗时更长'},{value:'false',label:'关'}],compose.settings.upscale)}</div><p>${compose.narrationNote}</p></section><section class="studio-section"><h3>生成成片</h3><div class="story-gate-row"><span>镜头完成度</span><span class="tag ${review.completed===review.total?'ok':''}">${review.completed}/${review.total}</span></div>${compose.gate.blockers.map(item=>`<div class="tool-note">${item}</div>`).join('')}${compose.gate.canCompose?'<div class="tool-note">全部镜头已就绪；合成按分镜顺序进行，生成新的成片版本。</div>':''}<button class="btn primary" style="width:100%;margin-top:9px" data-cut-command="compose" ${compose.gate.canCompose?'':'disabled'}>生成成片</button></section></aside>`;
      let composeStrip='';
      if(compose.activeTask){
        composeStrip=`<section class="cut-compose-strip"><span class="tag">${compose.activeTask.status==='running'?'正在合成':'取消请求中'}</span><div class="post-progress"><span style="width:${compose.activeTask.progress||8}%"></span></div><b>${compose.activeTask.progress||8}%</b><span class="spacer"></span><button data-cut-command="cancel-compose" ${compose.activeTask.status==='running'?'':'disabled'}>取消任务</button></section>`;
      }else if(compose.lastError){
        composeStrip=`<section class="cut-compose-strip"><span class="tag">合成失败</span><div><b>${compose.lastError}</b><small>镜头、候选与合成设置均已保留。</small></div><span class="spacer"></span><button class="btn" data-cut-command="retry-compose">按原设置重试</button></section>`;
      }else if(compose.result){
        composeStrip=`<section class="cut-compose-strip"><span class="tag ok">成片 v${compose.result.version}</span><div><b>${compose.result.fileName}</b><small>${compose.result.durationLabel} · ${compose.result.resolution}${compose.result.exported?` · 已导出于 ${compose.result.exportedAt}`:' · 尚未导出'}</small></div><span class="spacer"></span><details><summary>历史版本</summary><div>${compose.history.map(item=>`<div class="feature-line"><span>成片 v${item.version}</span><b>${item.createdAt} · ${item.statusLabel}</b></div>`).join('')}</div></details><button class="btn" data-cut-command="export-mp4">导出 MP4</button><button data-cut-command="export-srt">导出 SRT</button></section>`;
      }else{
        composeStrip=`<section class="cut-compose-strip"><span class="tag">尚未合成</span><div><b>完成全部镜头后即可生成成片</b><small>合成按分镜顺序拼接，并按上方设置混音。</small></div></section>`;
      }
      const timeline=review.shots.map(item=>`<button class="cut-shot-card ${item.tone} ${item.id===review.selectedShotId?'active':''}" data-cut-shot="${item.id}"><b>镜头 ${item.number} · ${item.duration}s</b><small>${statusLabels[item.status]||item.status}</small><small>${item.candidateId?item.candidateId:'待生成'}</small></button>`).join('');
      return shell(`<div>${renderStageScenario(model.scenario)}<div class="studio-toolbar"><select aria-label="场次" data-cut-scene-select>${sceneOptions}</select><select aria-label="当前镜头" data-cut-shot-select>${shotOptions}</select><span class="tag">${review.completed}/${review.total} 已完成</span><div class="spacer"></div><button class="btn" data-cut-command="play-all">${review.mode==='play-all'?'停止连播':'连续播放'}</button><button class="btn primary" data-cut-command="compose" ${compose.gate.canCompose?'':'disabled'}>生成成片</button></div></div>
        <div class="cut-workbench" data-feature-id="CUT-001">${mainPanel}${settingsPanel}</div>
        ${composeStrip}
        <footer class="shot-rail" data-feature-id="CUT-002"><span class="tag">镜头时间线</span><span>顺序与分镜一致；发现问题的镜头回分镜修复。</span><span class="spacer"></span></footer><div class="cut-shot-rail">${timeline}</div>`);
    }

    function getScriptStageUiModel(projectId,episodeId,scenarioId){
      const key=`${projectId}/${episodeId}`;
      if(scenarioId!=='default') return fullModel.getScriptStageModel(projectId,episodeId,scenarioId);
      if(!scriptUiState||scriptUiKey!==key||scriptUiState.scenarioId!=='default'){scriptUiKey=key;scriptUiState=fullModel.getScriptStageModel(projectId,episodeId,'default')}
      return scriptUiState;
    }

    function renderScriptDiffRows(model){
      return model.versionComparison.rows.map(item=>`<article class="script-diff-row"><span class="tag">${item.kind}</span><b>${item.sceneLabel}</b><div class="script-diff-columns"><div class="removed"><small>已确认版本</small>${escapePrototypeHtml(item.before)||'—'}</div><div class="added"><small>当前草稿</small>${escapePrototypeHtml(item.after)||'—'}</div></div></article>`).join('');
    }

    function renderScriptStage(projectId, episodeId, scenarioId) {
      const model=getScriptStageUiModel(projectId,episodeId,scenarioId);
      const selectedScene=model.scenes.find(item=>item.id===model.editor.selectedSceneId)||model.scenes[0]||null;
      const scenes=model.scenes.map(item=>`<div class="script-scene-row"><button class="script-scene ${item.id===model.editor.selectedSceneId?'active':''}" data-script-action="select-scene" data-scene-id="${item.id}"><b>${item.number} · ${escapePrototypeHtml(item.heading)}</b><small>${item.wordCount} 字 · ${item.status}</small></button><button class="btn script-scene-more" data-script-action="scene-menu" data-scene-id="${item.id}" aria-label="${escapePrototypeHtml(item.heading)}场次操作">•••</button></div>`).join('');
      const revisions=model.revisions.map(item=>`<button class="review-item" data-script-action="revision" data-revision-key="${item.key}"><div><b>${item.label}</b><small>${item.updatedAt} · ${item.source}${item.differenceCount?` · ${item.differenceCount} 处差异`:''}</small></div><span>›</span></button>`).join('');
      const saveTone=model.editor.persistence.state==='saved'?'ok':model.editor.persistence.state==='save_failed'||model.editor.persistence.state==='offline'||model.editor.persistence.state==='conflict'?'danger':'';
      const recovery=model.editor.persistence.hasRecoveryCopy?'<button data-script-action="recovery">恢复副本</button>':'';
      const editor=selectedScene?`<div class="studio-panel-head"><strong>${escapePrototypeHtml(selectedScene.heading)}</strong><span class="tag">${model.editor.baseVersionLabel}</span></div><div class="script-meta-grid"><label>内/外景<input data-script-meta="interiorExterior" value="${selectedScene.metadata.interiorExterior}"></label><label>地点<input data-script-meta="location" value="${selectedScene.metadata.location}"></label><label>时间<input data-script-meta="timeOfDay" value="${selectedScene.metadata.timeOfDay}"></label></div><textarea class="script-editor" data-script-editor aria-label="剧本正文" ${model.editor.persistence.state==='loading'?'readonly':''}>${escapePrototypeHtml(model.editor.content)}</textarea><div class="studio-section mini-actions"><button data-script-action="save" ${['dirty','save_failed','offline','conflict'].includes(model.editor.persistence.state)?'':'disabled'}>立即保存</button><button data-script-action="rewrite-selection" disabled title="请先选择一段正文">改写选段</button>${recovery}</div>`:`<div class="script-empty"><div><h2>${model.emptyStart.title}</h2><p>${model.emptyStart.detail}</p><div class="actions" style="justify-content:center">${model.emptyStart.actions.map(a=>`<button class="btn ${a.id==='ai-draft'?'primary':''}" data-script-action="${a.id}">${a.label}</button>`).join('')}</div></div></div>`;
      return `<section class="studio-page" data-feature-id="S-01">${renderStudioHead(model,'script')}<div>${renderStageScenario(model.scenario)}<div class="studio-toolbar"><span class="tag ${saveTone}" data-script-save-state>${model.editor.persistence.label}</span><span>${model.autosave.userMessage} · ${model.autosave.shortcut}</span><div class="spacer"></div>${model.editor.isEmpty?`<button class="btn" data-script-action="paste-import">粘贴或导入剧本</button><button class="btn primary" data-script-action="ai">${model.aiAssistant.action.label}</button><button class="btn" data-script-action="manual-write">直接开始写</button>`:`<button class="btn" data-script-action="ai">AI 辅助</button>${model.versionComparison.canCompare?'<button class="btn" data-script-action="compare">比较修改</button>':''}${model.revisionHistory.presentation==='drawer'?`<button class="btn" data-script-action="history">${model.revisionHistory.actionLabel}</button>`:''}`}<button class="btn primary" data-script-action="primary" ${model.primaryAction.enabled?'':'disabled'} title="${model.primaryAction.reason}">${model.primaryAction.label}</button></div></div><div class="script-grid script-grid-two"><aside class="studio-panel"><div class="studio-panel-head"><strong>场次 · ${model.scenes.length}</strong><span class="tag">${model.episodeSummary.totalWords} 字 · ${model.episodeSummary.estimatedDuration}</span></div><div class="studio-section">${scenes}<button class="btn" style="width:100%" data-script-action="add-scene">＋ 新增场次</button></div></aside><main class="studio-panel">${editor}</main></div></section>`;
    }

    function openScriptHistoryDrawer(model) {
      const revisions=model.revisions.map(item=>`<button class="review-item" data-script-action="revision" data-revision-key="${item.key}"><div><b>${item.label}</b><small>${item.updatedAt} · ${item.source}${item.differenceCount?` · ${item.differenceCount} 处差异`:''}</small></div><span>›</span></button>`).join('');
      openDrawer('历史版本', `<div class="tool-note">默认只保留关键快照；历史版本只读，复制会创建新草稿，不覆盖任何历史。</div><div class="review-list" style="margin-top:12px">${revisions}</div>`);
    }

    function openScriptPasteImport() {
      openDrawer('粘贴或导入剧本', `<form class="settings-form" data-script-paste-form><label>剧本内容<textarea style="min-height:180px">内景 · 酒店前台 · 深夜
林夏接起来自不存在楼层的电话……</textarea><small>支持 TXT、Markdown、DOCX；粘贴后先解析为场次草稿，再人工检查。</small></label><div class="tool-note"><b>导入预览</b><br>检测到 4 个场次；草稿阶段即可调整场次、角色、地点和对白。不会自动确认剧本或提取素材。</div><div class="drawer-actions"><button type="button" class="btn" data-stage-drawer-action="cancel">取消</button><button type="submit" class="btn primary">解析为场次草稿</button></div></form>`);
      drawerBody.querySelector('[data-script-paste-form]').addEventListener('submit',event=>{
        event.preventDefault();closeDrawer();
        scriptUiState=fullModel.addScriptScene(scriptUiState);

        else renderLocation();
        showToast('已解析为 4 个场次的可编辑草稿');
      });
    }

    function openScriptVersionComparison(model=scriptUiState){
      openDrawer('已确认版本与当前草稿',`<div class="tool-note">历史版本只读；恢复历史内容会复制成新草稿，不覆盖任何版本。</div><div class="script-diff-list" style="margin-top:12px">${renderScriptDiffRows(model)}</div><div class="drawer-actions"><button class="btn" data-stage-drawer-action="cancel">关闭</button><button class="btn primary" data-script-copy-approved>由已确认版本创建新草稿</button></div>`);
      drawerBody.querySelector('[data-script-copy-approved]')?.addEventListener('click',()=>{scriptUiState=fullModel.createScriptDraftFromHistory(model,'approved');closeDrawer();renderLocation();showToast('已从已确认版本创建新草稿；历史版本未改变')});
    }

    function openScriptAiCandidate(model){
      const workflow=model.aiWorkflow;
      openDrawer('AI 改写候选',`<div class="tool-note"><b>当前草稿尚未改变</b><br>候选只有在你点击“应用到草稿”后才会写入，并随后进入自动保存。</div><div class="script-diff-columns" style="margin-top:12px"><div class="removed"><small>原文</small>${escapePrototypeHtml(workflow.diff.before)}</div><div class="added"><small>候选</small>${escapePrototypeHtml(workflow.diff.after)}</div></div><div class="feature-line"><span>变化</span><b>新增 ${workflow.diff.added} · 删除 ${workflow.diff.removed} · 修改 ${workflow.diff.changed}</b></div><div class="drawer-actions"><button class="btn" data-script-ai-discard>放弃候选</button><button class="btn primary" data-script-ai-apply>应用到草稿</button></div>`);
      drawerBody.querySelector('[data-script-ai-discard]').addEventListener('click',()=>{closeDrawer();showToast('候选已放弃，草稿没有变化')});
      drawerBody.querySelector('[data-script-ai-apply]').addEventListener('click',()=>{scriptUiState=fullModel.applyScriptAiCandidate(scriptUiState);closeDrawer();renderLocation();showToast('候选已应用到草稿，正在等待自动保存')});
    }

    function openScriptAiDrawer(mode='continue'){
      const model=scriptUiState;
      const actions=model.aiActions.map(item=>`<option value="${item.id}" ${item.id===mode?'selected':''}>${item.label}${item.priority==='secondary'?'（更多）':''}</option>`).join('');
      openDrawer('AI 创作',`<form class="settings-form" data-script-ai-form><label>创作方式<select name="mode">${actions}</select></label><label>作用范围<select name="scope"><option>当前场次</option><option>当前集</option></select></label><label>创作要求或要求<textarea name="brief">强化悬疑感，保持人物行动自然，不新增未定义的主要角色。</textarea></label><div class="feature-line"><span>模型 / 预计消耗</span><b>${model.aiWorkflow.provider} · ${model.aiWorkflow.estimatedCost}</b></div><div class="tool-note">生成结果只成为候选，不会直接覆盖正文、确认剧本或刷新下游。</div><div class="drawer-actions"><button type="button" class="btn" data-stage-drawer-action="cancel">取消</button><button class="btn primary" type="submit">生成候选</button></div></form>`);
      drawerBody.querySelector('[data-script-ai-form]').addEventListener('submit',event=>{event.preventDefault();const data=Object.fromEntries(new FormData(event.currentTarget));scriptUiState=fullModel.startScriptAiCandidate(scriptUiState,{mode:data.mode,scope:data.scope});closeDrawer();renderLocation();setTimeout(()=>{scriptUiState=fullModel.completeScriptAiCandidate(scriptUiState,{candidateText:'林夏压低声音：这一层从来没有登记过。走廊尽头的服务铃却又响了一次。'});openScriptAiCandidate(scriptUiState)},520)});
    }

    function openScriptAssetDiff(model=scriptUiState){
      const rows=model.assetExtraction.items.map(item=>`<div class="review-item"><div><b>${item.kind} · ${item.label}</b><small>${item.detail}${item.kind==='人工锁定'?' · 不会被覆盖':''}</small></div>${item.kind==='人工锁定'?'<span class="tag ok">保持锁定</span>':`<select data-script-asset-decision="${item.id}"><option value="use" ${item.decision==='use'?'selected':''}>采用</option><option value="ignore" ${item.decision==='ignore'?'selected':''}>忽略</option><option value="pending" ${item.decision==='pending'?'selected':''}>稍后决定</option></select>`}</div>`).join('');
      openDrawer(model.assetExtraction.label,`<div class="tool-note">保存后已在后台轻量解析；现在只是确认预计变化，尚未写入项目素材。</div><div class="review-list" style="margin-top:12px">${rows}</div><div class="drawer-actions"><button class="btn" data-stage-drawer-action="cancel">关闭</button><button class="btn primary" data-script-asset-done>保存处理决定</button></div>`);
      drawerBody.querySelector('[data-script-asset-done]').addEventListener('click',()=>{drawerBody.querySelectorAll('[data-script-asset-decision]').forEach(select=>{scriptUiState=fullModel.decideScriptAssetChange(scriptUiState,select.dataset.scriptAssetDecision,select.value)});closeDrawer();renderLocation();showToast('预计素材变化的处理决定已保存到当前草稿')});
    }

    function openScriptApprovalCheck(){
      scriptUiState=fullModel.checkScriptDraftForApproval(scriptUiState);
      const model=scriptUiState;const check=model.approval.check;const impact=model.approval.downstreamImpact;
      openDrawer(model.currentRevision.approvedRevisionId?'确认修改':'确认剧本',`<div class="metric-grid"><div class="metric"><small>场次</small><b>${check.sceneCount}</b></div><div class="metric"><small>字数</small><b>${check.wordCount}</b></div><div class="metric"><small>预计时长</small><b>${check.estimatedDuration}</b></div><div class="metric"><small>阻塞</small><b>${check.blocking}</b></div></div><h3 style="margin-top:16px">预计素材变化</h3><p>新增 ${model.assetExtraction.diff.added} · 修改 ${model.assetExtraction.diff.changed} · 删除候选 ${model.assetExtraction.diff.removed} · 人工锁定 ${model.assetExtraction.diff.locked}</p><details style="margin-top:12px"><summary>预计素材变化明细</summary><div class="review-list">${scriptUiState.assetExtraction.items.map(item=>`<div class="review-item"><div><b>${item.kind} · ${item.label}</b><small>${item.detail}</small></div><span class="tag">${item.decision==='use'?'采用':item.decision==='ignore'?'忽略':'稍后决定'}</span></div>`).join('')}</div><button class="btn" data-script-review-assets>逐项处理</button></details><h3 style="margin-top:16px">下游影响</h3><div class="review-list"><div class="review-item"><div><b>${impact.characterChanges} 个角色设定可能变化</b><small>${impact.sceneChanges} 个场景需要重新确认</small></div></div><div class="review-item"><div><b>${impact.staleShots} 个分镜仍基于上一版剧本</b><small>确认后可逐阶段选择继续旧快照或刷新</small></div></div><div class="review-item"><div><b>${impact.preservedVideos} 段已生成视频继续保留</b><small>不会自动删除、覆盖或重新生成图片和视频</small></div></div></div><div class="drawer-actions"><button class="btn" data-stage-drawer-action="cancel">取消</button><button class="btn primary" data-script-confirm-final>${model.currentRevision.approvedRevisionId?'确认修改':'确认剧本'}</button></div>`);
      drawerBody.querySelector('[data-script-review-assets]').addEventListener('click',()=>openScriptAssetDiff(scriptUiState));
      drawerBody.querySelector('[data-script-confirm-final]').addEventListener('click',()=>{scriptUiState=fullModel.startScriptApproval(scriptUiState);closeDrawer();renderLocation();setTimeout(()=>{scriptUiState=fullModel.approveScriptDraft(scriptUiState);renderLocation();showToast('剧本新版本已确认；已有媒体保持不变')},480)});
    }

    function openScriptSceneMenu(sceneId){
      const scene=scriptUiState.scenes.find(item=>item.id===sceneId);if(!scene)return;
      openDrawer('场次操作',`<form class="settings-form" data-script-scene-form><label>场次标题<input name="heading" value="${escapePrototypeHtml(scene.heading)}"></label><div class="drawer-actions"><button class="btn" type="button" data-script-scene-command="move-up">上移</button><button class="btn" type="button" data-script-scene-command="move-down">下移</button><button class="btn" type="button" data-script-scene-command="duplicate">复制场次</button><button class="btn danger" type="button" data-script-scene-command="delete">删除</button><button class="btn primary" type="submit">保存标题</button></div></form>`);
      drawerBody.querySelector('[data-script-scene-form]').addEventListener('submit',event=>{event.preventDefault();scriptUiState=fullModel.renameScriptScene(scriptUiState,sceneId,new FormData(event.currentTarget).get('heading'));closeDrawer();renderLocation()});
      drawerBody.querySelectorAll('[data-script-scene-command]').forEach(button=>button.addEventListener('click',()=>{const command=button.dataset.scriptSceneCommand;if(command==='duplicate')scriptUiState=fullModel.duplicateScriptScene(scriptUiState,sceneId);else if(command==='move-up')scriptUiState=fullModel.moveScriptScene(scriptUiState,sceneId,-1);else if(command==='move-down')scriptUiState=fullModel.moveScriptScene(scriptUiState,sceneId,1);else if(command==='delete')scriptUiState=fullModel.deleteScriptScene(scriptUiState,sceneId);closeDrawer();renderLocation();if(command==='delete')showUndoToast('场次已删除',()=>{scriptUiState=fullModel.undoDeleteScriptScene(scriptUiState);renderLocation();showToast('已恢复场次')})}));
    }

    function openScriptConflict(model){
      openDrawer('解决版本冲突',`<div class="tool-note">服务端版本不会被本机内容直接覆盖。比较后创建一个新草稿继续编辑。</div><div class="script-diff-columns" style="margin-top:12px"><div class="removed"><small>服务端内容</small>${escapePrototypeHtml(model.conflict.serverContent)}</div><div class="added"><small>本机恢复内容</small>${escapePrototypeHtml(model.conflict.localContent)}</div></div><div class="drawer-actions"><button class="btn" data-script-copy-recovery>复制本机内容</button><button class="btn primary" data-script-resolve-conflict>以本机内容创建新草稿</button></div>`);
      drawerBody.querySelector('[data-script-copy-recovery]').addEventListener('click',()=>showToast('本机恢复内容已复制'));
      drawerBody.querySelector('[data-script-resolve-conflict]').addEventListener('click',()=>{scriptUiState=fullModel.getScriptStageModel(model.projectId,model.episodeId,'default');scriptUiState=fullModel.editScriptDraft(scriptUiState,scriptUiState.editor.selectedSceneId,model.conflict.localContent);closeDrawer();renderLocation();showToast('已创建新草稿；服务端历史版本保持不变')});
    }

    function getEpisodeAssetsUiModel(projectId, episodeId, scenarioId) {
      const key=`${projectId}/${episodeId}/${scenarioId}`;
      if(episodeAssetsUiState.key!==key){episodeAssetsUiState={key,page:fullModel.getEpisodeAssetsStageModel(projectId,episodeId,scenarioId)}}
      return episodeAssetsUiState.page;
    }

    function episodeMaterialThumb(item) {
      const thumb=item.thumbnail||{tone:'purple',label:item.label};
      return `<div class="episode-material-thumb ${thumb.tone||''}" role="img" aria-label="${thumb.label}">${thumb.label}</div>`;
    }

    function renderEpisodeAssetsStage(projectId, episodeId, scenarioId) {
      const model=getEpisodeAssetsUiModel(projectId,episodeId,scenarioId);
      const isLoading=model.scenario?.kind==='loading';
      const stageScenario=model.scenario?{...model.scenario,actions:(model.scenario.actions||[]).filter(item=>item.id!==model.primaryAction.id)}:null;
      const reviewItems=model.reviewItems.map(item=>`<article class="episode-material-card">${episodeMaterialThumb(item)}<div><b>${item.label}</b><small>${item.detail}</small></div><button class="btn" data-episode-material-target="${item.targetId}">${item.action}</button></article>`).join('');
      const inheritedGroups=model.requiredGroups.map(group=>`<section class="episode-material-group"><div class="episode-material-group-head"><b>${group.label}</b><span class="tag ${group.ready===group.items.length?'ok':''}">${group.ready}/${group.items.length} 已准备</span></div>${group.items.map(item=>`<div class="episode-material-inherited">${episodeMaterialThumb(item)}<div><b>${item.label}</b><small>${item.selectionLabel||`本集使用 ${item.episodeSelection}`} · ${item.status}</small></div><button class="btn" data-episode-inherited-target="${item.id}">查看</button></div>`).join('')}</section>`).join('');
      const packagePanel=model.externalPackage?`<section class="episode-material-group"><div class="settings-section-head"><div><h3>外部制作包素材对应关系</h3><p>外部候选不会自动覆盖项目或本集选择；仍缺少的素材才进入准备任务。</p></div><button class="btn" data-episode-package-mapping>查看与处理映射</button></div><div class="package-mapping header"><span>素材</span><span>外部包候选</span><span>项目当前图</span><span>本集选择</span><span>结果</span></div>${model.externalPackage.mappings.map(item=>`<div class="package-mapping"><b>${item.label}</b><span>${item.externalCandidate}</span><span>${item.projectCurrent}</span><span>${item.episodeSelection}</span><span class="tag ${item.status==='已匹配'?'ok':''}">${item.status}</span></div>`).join('')}<button class="btn primary" style="margin-top:12px" data-episode-missing-preflight>${model.missingMaterialsAction.label}</button></section>`:'';
      const initialEmpty=!reviewItems&&model.showAllRequired?'<div class="tool-note">首次进入会列出本集所需的全部素材，准备完成后仅保留差异与阻塞。</div>':'';
      const mainContent=isLoading?'<div class="episode-skeleton"></div><div class="episode-skeleton" style="margin-top:10px"></div>':`${reviewItems||'<div class="episode-ready-note"><b>没有必须处理的差异</b><br>可以进入分镜；项目素材之后的变化不会静默替换本集。</div>'}${packagePanel}<details style="margin-top:14px" ${model.showAllRequired?'open':''}><summary class="btn">${model.showAllRequired?'本集所需全部素材':model.fullInheritedListEntry.label} · ${model.inheritedSummary.total}</summary><div style="margin-top:12px">${inheritedGroups}</div></details>`;
      const blockerRows=model.gate.blockers.map(item=>`<div class="episode-blocker"><span><b>${item.label}</b><small>处理后自动重新检查</small></span><button class="btn" data-episode-material-target="${item.id}">处理</button></div>`).join('');
      return `<section class="studio-page" data-feature-id="A-01-EPISODE">${renderStudioHead(model,'assets')}<div>${renderStageScenario(stageScenario)}<div class="episode-material-summary"><div class="metric"><small>已准备</small><b>${model.readinessSummary.prepared}/${model.readinessSummary.required}</b></div><div class="metric"><small>必须处理</small><b>${model.readinessSummary.mandatory}</b></div><div class="metric"><small>可选更新</small><b>${model.readinessSummary.optionalUpdates}</b></div><div class="metric"><small>声音策略</small><b>${model.preflightPanel.audioPolicy}</b></div></div></div><div class="episode-material-workbench"><main class="episode-material-list"><h2>${model.showAllRequired?'准备本集所需素材':'只处理差异和阻塞'}</h2><p class="episode-material-lead">项目素材会自动继承；这里不会重复维护人物、场景和道具资料。</p>${initialEmpty}${mainContent}</main><aside class="episode-material-check"><h2>${model.preflightPanel.title}</h2><p>系统会在进入页面、改变选择和进入分镜时自动检查。</p><div class="metric-grid"><div class="metric"><small>已检查</small><b>${model.batchPreflight.checked}</b></div><div class="metric"><small>阻塞</small><b>${model.batchPreflight.blocking}</b></div></div>${model.gate.canEnterStoryboard?'<div class="episode-ready-note"><b>设定已准备好</b><br>点击进入分镜时会固定当前选择。</div>':blockerRows}<div class="drawer-actions"><button class="btn primary" data-episode-primary ${model.primaryAction.enabled?'':'disabled'}>${model.primaryAction.label}</button></div><details style="margin-top:16px"><summary>技术详情</summary><p>${model.snapshot.id}</p><p>${model.snapshot.captures.join(' · ')}</p><div class="tool-note">内部保存精确素材版本和文件指纹；默认界面不要求理解版本快照术语。</div></details></aside></div></section>`;
    }

    function updateEpisodeAssetsDecision(type,targetId) {
      episodeAssetsUiState.page=fullModel.applyEpisodeAssetDecision(episodeAssetsUiState.page,{type,targetId});
      closeDrawer();renderLocation();showToast('本集选择已更新，进入分镜前检查已自动刷新');
    }

    function openEpisodeAssetComparison(projectId, episodeId) {
      const comparison=fullModel.getEpisodeAssetVersionComparisonModel('linxia-hotel');
      const versions=comparison.versions.map(item=>`<article class="episode-material-version"><div class="candidate-preview ${item.thumbnail.tone}"></div><b>${item.label} · ${item.version}</b><small>${item.source} · ${item.updatedAt}</small></article>`).join('');
      openDrawer(`比较图片 · ${comparison.title}`,`<div class="episode-material-compare">${versions}</div><div class="tool-note" style="margin-top:12px"><b>主要变化</b><br>${comparison.difference}</div><h3>预计影响本集位置</h3>${comparison.affectedLocations.map(item=>`<div class="feature-line"><span>${item}</span><b>仅改变本集使用图</b></div>`).join('')}<div class="drawer-actions"><button class="btn" data-episode-version-action="keep-episode-current">继续使用 v2</button><button class="btn primary" data-episode-version-action="use-project-latest">本集改用 v3</button></div>`);

    }

    function openEpisodeVoiceResolver() {

      const cards = visible.map(item => `<article class="library-card" data-library-card="${item.id}">${renderLibraryPreview(item)}<div class="library-card-body"><div style="display:flex;align-items:center;gap:8px"><h3>${item.name}</h3><span class="tag">${item.type}</span></div><div class="library-card-meta"><strong>${item.version}</strong> · ${item.usageCount ? `用于 ${item.usageCount} 个项目/位置` : '尚未使用'}</div><div class="library-card-meta">${item.mediaState === 'offline' ? '<span class="tag warn">文件不可访问</span>' : '<span class="tag ok">本地可用</span>'} · ${item.sourceKind === 'provider' ? 'Provider 来源' : item.sourceKind === 'project' ? '项目沉淀' : '自有素材'}</div><div class="library-card-actions"><button class="btn" data-library-detail="${item.id}">查看详情</button><button class="btn primary" data-library-use="${item.id}" ${item.canUseInProject === false ? 'disabled title="离线素材恢复后才能用于新项目"' : ''}>用于项目</button><div class="spacer"></div><button class="btn" data-library-more="${item.id}" aria-label="${item.name}更多操作">•••</button></div></div></article>`).join('');

      return `<section class="page" data-feature-id="M-01"><div class="library-page-head"><div><h1>${model.featureName}</h1><p>${model.description}</p></div><div class="actions"><button class="btn" data-library-add>添加到资产库</button></div></div>${renderStageScenario(model.scenario)}<div class="library-type-tabs" aria-label="素材类型">${tabs}</div><div class="library-toolbar"><input class="search" data-library-search value="${escapePrototypeHtml(libraryUiState.query)}" placeholder="搜索人物、场景、道具、音色或项目" aria-label="搜索个人资产库"><select data-library-status aria-label="在线状态"><option value="">在线状态：全部</option><option value="online" ${libraryUiState.filters.status==='online'?'selected':''}>本地可用</option><option value="offline" ${libraryUiState.filters.status==='offline'?'selected':''}>文件不可访问</option><option value="archived" ${libraryUiState.filters.archived==='true'?'selected':''}>已归档</option></select><select data-library-source aria-label="来源"><option value="">来源：全部</option><option value="project" ${libraryUiState.filters.source==='project'?'selected':''}>项目沉淀</option><option value="local" ${libraryUiState.filters.source==='local'?'selected':''}>自有素材</option><option value="provider" ${libraryUiState.filters.source==='provider'?'selected':''}>Provider</option></select><select data-library-sort aria-label="排序"><option value="recent" ${libraryUiState.sortId==='recent'?'selected':''}>最近使用/添加</option><option value="name" ${libraryUiState.sortId==='name'?'selected':''}>名称</option></select><button class="btn" data-library-project-save>从项目保存</button><button class="btn" data-library-import>导入本地素材</button></div><div class="library-filter-chips"><span class="tag">共 ${visible.length} 项</span>${chips}</div>${visible.length ? `<div class="library-grid">${cards}</div>` : empty}<div class="tool-note" style="margin-top:14px">被项目引用的资产只能归档，不能物理删除；完整路径和许可位于详情中，使用位置始终可追溯。</div></section>`;

      return `<section class="page" data-feature-id="F-01"><div class="page-head"><div><h1>${model.featureName}</h1><p>${model.description}</p></div><span class="tag">可选工具 · 不影响四阶段进度</span></div>${renderStageScenario(model.scenario)}<div class="review-grid"><section class="review-panel wide"><h2>选择生成方式</h2><div class="recipe-grid">${recipes}</div><h3 style="margin-top:18px">本次生成设置</h3>${context}${settings}<div class="tool-note" style="margin-top:12px">自由创作不会推进四阶段；如果最终用于项目，请在生成前或保存时选择项目和剧集。</div></section><aside class="review-panel"><h2>结果去向</h2>${destinations}<div class="tool-note" style="margin-top:10px">生成前仅展示归档计划；生成中禁用。成功后请预览并选择唯一归档位置。</div></aside><section class="review-panel full"><h2>生成历史</h2>${history}<p class="muted">批量生成暂不支持；每次任务、候选和来源快照都可在任务中心恢复。</p></section>${resultPanel}</div></section>`;
    }

    function renderCanvas(scenarioId) {
      const model=fullModel.getCanvasModel(scenarioId);
      const nodes=model.nodes.map(item=>`<button class="canvas-node ${model.viewport.selectedIds.includes(item.id)?'canvas-selection':''}" data-canvas-node="${item.id}" style="position:absolute"><span class="tag">${item.type}</span><b style="display:block;margin-top:7px">${item.label}</b><small>${item.status}</small></button>`).join('');
      const lines=model.relations.map((edge,index)=>{const coords=[{x1:145,y1:110,x2:275,y2:245},{x1:415,y1:110,x2:305,y2:245},{x1:390,y1:295,x2:450,y2:315}][index]||{x1:0,y1:0,x2:0,y2:0};return `<line x1="${coords.x1}" y1="${coords.y1}" x2="${coords.x2}" y2="${coords.y2}" class="${edge.status==='stale'?'stale':''}" marker-end="url(#canvas-arrow)"/><text x="${(coords.x1+coords.x2)/2}" y="${(coords.y1+coords.y2)/2-5}" class="canvas-svg-label">${edge.label}</text>`}).join('');
      const impact=`<div class="task-drawer-section"><b>当前对象：${model.contextLabels.focus}</b></div><div class="task-drawer-section"><b>直接影响</b>${model.impactAnalysis.direct.map(item=>`<div class="feature-line"><span>${item.label}</span><b>${item.detail}</b></div>`).join('')}</div><div class="task-drawer-section"><b>间接影响</b>${model.impactAnalysis.indirect.map(item=>`<div class="feature-line"><span>${item.label}</span><b>${item.detail}</b></div>`).join('')}</div><div class="task-drawer-section"><b>不会影响</b>${model.impactAnalysis.excluded.map(item=>`<div class="feature-line"><span>${item.label}</span><b>${item.detail}</b></div>`).join('')}</div><div class="tool-note">影响路径是只读分析，不会自动编译或生成。</div>`;
      return `<section class="page" data-feature-id="X-01"><div class="page-head"><div><h1>${model.featureName}</h1><p>${model.description}</p></div><div class="actions"><button class="btn" data-canvas-return>返回标准页面</button><button class="btn" data-canvas-impact>影响路径</button><button class="btn primary" data-canvas-save ${model.scenarioId==='offline'||model.scenarioId==='read-only'?'disabled':''}>保存布局</button></div></div>${renderStageScenario(model.scenario)}<div class="studio-toolbar"><div class="canvas-context"><span class="tag">${model.contextLabels.project}</span><span class="tag">${model.contextLabels.episode}</span><span class="tag">${model.contextLabels.stage}</span><span>焦点：${model.contextLabels.focus}</span><small class="muted">来源：${model.contextSource} · 视口 ${model.viewport.restored?'已恢复':'待恢复'} · ${model.layoutState.dirty?'布局未保存':`已保存 ${model.layoutState.revision}`}</small></div><div class="spacer"></div>${model.advancedActions.map(item=>`<button class="btn" data-canvas-tool="${item}">${item}</button>`).join('')}</div><div class="canvas-legend"><span>实线：当前引用</span><span>虚线：失效引用</span><span>拖动只改变布局</span></div><div class="review-grid" style="margin-top:12px"><main class="review-panel wide"><div class="canvas-stage" data-canvas-stage><svg class="canvas-edge-layer" viewBox="0 0 620 430" preserveAspectRatio="none"><defs><marker id="canvas-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="currentColor"></path></marker></defs>${lines}</svg>${nodes}<div class="canvas-minimap"><b>关系缩略图</b>${model.nodes.length} 节点 · ${model.relations.length} 条关系</div></div></main><aside class="review-panel"><h2>批量重编译</h2><div class="feature-line"><span>选中对象</span><b>${model.batchRecompile.selectedIds.length} 个</b></div><div class="feature-line"><span>预计任务</span><b>${model.batchRecompile.estimatedTasks} 个</b></div><div class="feature-line"><span>预计费用 / 耗时</span><b>${model.batchRecompile.estimatedCost} · ${model.batchRecompile.estimatedDuration}</b></div><div class="tool-note">已采用候选不会被自动覆盖；确认后创建新的 Shot Revision，任务进入全局任务中心。</div><button class="btn primary" data-canvas-batch ${model.scenarioId==='read-only'||model.scenarioId==='offline'||model.scenarioId==='capability-blocked'?'disabled':''}>批量重编译</button><h3 style="margin-top:15px">共享领域命令</h3>${model.sharedCommands.map(item=>`<div class="review-item"><div><b>${item}</b><small>标准页与画布结果一致</small></div></div>`).join('')}<h3 style="margin-top:15px">不在 V2.1</h3><p>${model.excludedProducts.join(' · ')}</p></aside></div></section>`;
    }

    function renderLocation() {
      const state = fullModel.parsePrototypeLocation(location.hash || '#/projects');
      closeProjectMenuPopover();
      drawerBackdrop.classList.remove('open');drawerBackdrop.setAttribute('aria-hidden','true');
      if (!location.hash || state.notFound) history.replaceState(null, '', '#/projects');
      document.getElementById('crumb').textContent = `/ ${routeLabels[state.routeId] || '项目'}${state.scenarioId === 'default' ? '' : ` · ${state.scenarioId}`}`;
      document.querySelectorAll('.nav-route').forEach(button => button.classList.toggle('active',
        (button.dataset.routeId === 'projects' && state.routeId.startsWith('project')) ||
        button.dataset.routeId === state.routeId ||
        (button.dataset.routeId === 'projects' && state.routeId.startsWith('studio-')) ||
        (button.dataset.routeId === 'settings-ai' && state.routeId.startsWith('settings-'))
      ));
      const localState = document.getElementById('localState');
      const hasSystemWarning = (state.routeId === 'projects' && ['offline','load-failed'].includes(state.scenarioId)) ||
        (state.routeId === 'project-overview' && ['needs-attention','load-failed','storage-offline','missing'].includes(state.scenarioId)) ||
        (state.routeId === 'project-import' && ['unsupported-archive','failed','partial-success'].includes(state.scenarioId)) ||
        (state.routeId === 'studio-script' && ['save-failed','conflict','offline','ai-failed'].includes(state.scenarioId)) ||
        (state.routeId === 'studio-assets' && ['check-failed','snapshot-failed','media-offline','external-package-mismatch'].includes(state.scenarioId)) ||
        (state.routeId === 'studio-storyboard' && ['save-failed','conflict','blocked','provider-blocked','prompt-gate-failed','h3-stale','h3-invalid','generation-failed','batch-partial'].includes(state.scenarioId)) ||
        (state.routeId === 'library' && ['offline','import-failed','publish-conflict'].includes(state.scenarioId));
      localState.textContent = hasSystemWarning ? '● 需要处理' : '● 本地可用';
      localState.className = `tag system-state${hasSystemWarning ? ' warn' : ''}`;
      if (state.routeId === 'projects') pageRoot.innerHTML = renderProjects(state.params,state.scenarioId);
      else if (state.routeId === 'project-overview') pageRoot.innerHTML = renderProjectOverview(state.params.projectId,state.scenarioId);
      else if (state.routeId === 'project-bible') { const redirect=fullModel.getProjectBibleModel(state.params.projectId,state.scenarioId); navigate(redirect.redirectTo.routeId,redirect.redirectTo.params,redirect.redirectTo.scenarioId); pageRoot.innerHTML = `<section class="page"><div class="tool-note">项目设置已合并到项目概览，正在打开…</div></section>`; }
      else if (state.routeId === 'project-episodes') pageRoot.innerHTML = renderProjectEpisodes(state.params.projectId,state.scenarioId);
      else if (state.routeId === 'project-assets') pageRoot.innerHTML = renderProjectAssets(state.params.projectId,state.scenarioId,state.params.focusId);
      else if (state.routeId === 'project-new') pageRoot.innerHTML = renderProjectCreate(state.scenarioId);
      else if (state.routeId === 'project-import') pageRoot.innerHTML = renderProjectImport(state.scenarioId);
      else if (state.routeId === 'external-ai-wizard') { pageRoot.innerHTML = renderExternalAiWizard(state.params.projectId,state.scenarioId); bindExternalAiWizard(state.params.projectId); }
      else if (state.routeId === 'studio-script') pageRoot.innerHTML = renderScriptStage(state.params.projectId,state.params.episodeId,state.scenarioId);
      else if (state.routeId === 'studio-assets') pageRoot.innerHTML = renderEpisodeAssetsStage(state.params.projectId,state.params.episodeId,state.scenarioId);
      else if (state.routeId === 'studio-storyboard') pageRoot.innerHTML = renderStoryboardStage(state.params.projectId,state.params.episodeId,state.scenarioId,state.params);
      else if (state.routeId === 'studio-cut') pageRoot.innerHTML = renderCutStage(state.params.projectId,state.params.episodeId,state.scenarioId);
      else if (state.routeId === 'library') pageRoot.innerHTML = renderLibrary(state.scenarioId);
      else if (state.routeId === 'tasks') pageRoot.innerHTML = renderTaskCenter(state.params,state.scenarioId);
      else if (state.routeId === 'quick-create') pageRoot.innerHTML = renderQuickCreate(state.scenarioId);
      else if (state.routeId === 'canvas') pageRoot.innerHTML = renderCanvas(state.scenarioId);
      else if (state.routeId === 'settings-ai') pageRoot.innerHTML = renderAiSettings(state.scenarioId);
      else if (state.routeId === 'settings-general') pageRoot.innerHTML = renderGeneralSettings(state.scenarioId);
      else if (state.routeId === 'settings-data') pageRoot.innerHTML = renderAdvancedDataTools(state.scenarioId);
      else pageRoot.innerHTML = renderPlaceholder(state);
      bindPageActions();
      if (state.routeId === 'project-episodes' && state.scenarioId === 'source-picker' && !drawerBackdrop.classList.contains('open')) {
        setTimeout(()=>state.params.type==='external_ai'
          ? openEpisodeTargetSelector(state.params.projectId,'external_ai',state.params.focusId||'')
          : openEpisodeSourceDrawer(state.params.projectId,state.params.focusId||''),0);
      }
      if (state.routeId === 'project-assets') {
        const assetId = new URLSearchParams((location.hash.split('?')[1] || '')).get('asset');
        if (assetId) openProjectAssetDetail(assetId, false);
      }
    }

    function openStoryboardReextractDrawer(model) {
      const flow = model.reextract;
      const diffLabels = [
        ['新增镜头',flow.diff.added],
        ['内容变化',flow.diff.changed],
        ['拟删除',flow.diff.removed],
        ['保持不变',flow.diff.unchanged],
      ];
      openDrawer(flow.label, `<div class="tool-note"><b>来源：${flow.source.label}</b><br>仅使用当前已确认剧本；不会从外部文件或旧剧本重新解析。</div><div class="drawer-step">${flow.steps.map((item,index)=>`<span class="${index===0?'active':''}">${index+1} ${item}</span>`).join('')}</div><div class="settings-form"><label>结构模型<input value="${flow.provider}" readonly></label><label>预计处理时间<input value="${flow.estimatedProcessingTime}" readonly></label><label>预计费用<input value="${flow.estimatedCost}" readonly></label></div><h3>预估差异</h3><div class="batch-summary">${diffLabels.map(item=>`<div class="asset-field"><small>${item[0]}</small><b>${item[1]}</b></div>`).join('')}</div><div class="tool-note" style="margin-top:12px">先展示每个镜头的变化；人工调整、现有图片/视频候选与历史都会保留，确认前不会覆盖当前分镜。<details><summary>技术详情</summary><p>确认后创建新的 Shot revision。</p></details></div><div class="drawer-actions"><button class="btn" data-stage-drawer-action="cancel">取消</button><button class="btn primary" data-story-reextract-preview>生成结构并查看差异</button></div>`);
      drawerBody.querySelector('[data-story-reextract-preview]').addEventListener('click',()=>{
        openDrawer('确认分镜变化', `<div class="tool-note"><b>${flow.source.label} → 新分镜版本</b><br>已匹配 10 镜；新增 ${flow.diff.added}、变化 ${flow.diff.changed}、拟删除 ${flow.diff.removed}、不变 ${flow.diff.unchanged}。</div><div class="feature-line"><span>镜头 03</span><b>对白时段 5.0–7.0s 有变化</b></div><div class="feature-line"><span>镜头 06–07</span><b>新增；待补素材引用</b></div><div class="feature-line"><span>原镜头 09</span><b>拟删除；其媒体历史继续保留</b></div><div class="tool-note">有冲突的人工调整保持原值并逐项处理；不会静默覆盖。<details><summary>技术详情</summary><p>内部创建新的 Shot revision，旧版本仍可恢复。</p></details></div><div class="drawer-actions"><button class="btn" data-reextract-back>返回设置</button><button class="btn primary" data-reextract-confirm>保存为新分镜版本</button></div>`);
        drawerBody.querySelector('[data-reextract-back]').addEventListener('click',()=>openStoryboardReextractDrawer(model));
        drawerBody.querySelector('[data-reextract-confirm]').addEventListener('click',()=>{storyboardUiState.page=fullModel.applyStoryboardStructureUpdate(model,{acceptedAddedShotIds:['shot-10'],acceptedChangedShotIds:['shot-04'],acceptedRemovedShotIds:['shot-09']});closeDrawer();renderLocation();showToast('已创建新分镜版本；镜头变化已应用，原版本、人工锁定和媒体历史均保留')});
      });
    }

    function openStoryboardImportDrawer(model, selectedSourceId = 'excel') {
      const flow = model.storyboardImport;
      const selected = flow.sources.find(item=>item.id===selectedSourceId) || flow.sources[0];
      const sources = flow.sources.map(item=>`<button class="batch-action ${item.id===selected.id?'active':''}" data-story-import-source="${item.id}" ${item.availability==='later'?'disabled':''}><b>${item.label}</b><small>${item.extensions.join(' / ')} · ${item.availability==='v2.1'?'V2.1 支持':'后续版本：AI 辅助解析'}</small></button>`).join('');
      openDrawer(flow.label, `<div class="tool-note">此入口只导入“镜头结构”。完整 Episode Package、外部 AI 回流 JSON 和整集制作包应从剧集页导入。</div><div class="drawer-step">${flow.steps.map((item,index)=>`<span class="${index===0?'active':''}">${index+1} ${item}</span>`).join('')}</div><div class="asset-option-list">${sources}</div><div class="settings-form" style="margin-top:12px"><label>当前来源<input value="${selected.label} · ${selected.extensions.join(' / ')}" readonly></label><label>解析方式<input value="${selected.mode==='column-mapping'?'字段映射':selected.mode==='schema-validation'?'Schema 校验':'AI 辅助解析'}" readonly></label></div><button class="btn" style="width:100%" data-story-import-episodes>${flow.episodePackageTarget.label}</button><div class="drawer-actions"><button class="btn" data-stage-drawer-action="cancel">取消</button><button class="btn primary" data-story-import-preview ${selected.availability==='v2.1'?'':'disabled'}>选择文件并模拟解析</button></div>`);
      drawerBody.querySelectorAll('[data-story-import-source]').forEach(button=>button.addEventListener('click',()=>openStoryboardImportDrawer(model,button.dataset.storyImportSource)));
      drawerBody.querySelector('[data-story-import-episodes]').addEventListener('click',()=>{closeDrawer();navigate(flow.episodePackageTarget.routeId,{projectId:model.projectId},'import-package')});
      drawerBody.querySelector('[data-story-import-preview]')?.addEventListener('click',()=>{
        openDrawer('导入预览与字段映射', `<div class="drawer-step">${flow.steps.map((item,index)=>`<span class="${index>=1&&index<=4?'active':''}">${index+1} ${item}</span>`).join('')}</div><div class="tool-note"><b>${selected.label} 解析成功</b><br>4 场 · 11 镜 · 总时长 01:14；尚未改变当前分镜。</div><div class="feature-line"><span>镜号 / 时长</span><b>自动匹配 · 11/11</b></div><div class="feature-line"><span>画面 / 台词 / 运镜</span><b>已映射 · 10/11</b></div><div class="feature-line"><span>人物 / 场景 / 道具</span><b>8 已匹配 · 3 待确认</b></div><div class="feature-line"><span>与当前分镜相比</span><b>新增 2 · 变化 4 · 拟删除 0</b></div><div class="tool-note">待确认素材不会自动新建或错误绑定。确认后保存为新分镜版本，当前分镜与媒体历史继续保留。<details><summary>技术详情</summary><p>内部创建新的 Shot revision。</p></details></div><div class="drawer-actions"><button class="btn" data-import-back>返回来源</button><button class="btn primary" data-import-confirm>确认映射并保存新版本</button></div>`);
        drawerBody.querySelector('[data-import-back]').addEventListener('click',()=>openStoryboardImportDrawer(model,selected.id));
        drawerBody.querySelector('[data-import-confirm]').addEventListener('click',()=>{storyboardUiState.page=fullModel.applyStoryboardStructureUpdate(model,{acceptedAddedShotIds:['shot-10','shot-11'],acceptedChangedShotIds:['shot-04','shot-05'],acceptedRemovedShotIds:[]});closeDrawer();renderLocation();showToast('导入完成：已保存新分镜版本，3 个素材匹配项等待处理')});
      });
    }

    function openH3PromptDrawer(model) {
      const draft = model.h3Draft;
      openDrawer(draft.actionLabel, `<div class="tool-note"><b>不会覆盖人工草稿</b><br>生成前会固定当前分镜、素材引用和声音事件；旧草稿继续保留。</div><div class="feature-line"><span>结构输入</span><b>${model.selectedShot.segments.length} 个时段 · ${model.segmentEditor.referenceChips.length} 个引用槽位</b></div><div class="feature-line"><span>来源</span><b>${draft.sourceLabel}</b></div><div class="feature-line"><span>预计处理</span><b>10–30 秒</b></div><h3>生成后自动校验</h3><div>${draft.validationChecks.map(item=>`<span class="asset-chip">${item}</span>`).join('')}</div><div class="drawer-actions"><button class="btn" data-stage-drawer-action="cancel">取消</button><button class="btn primary" data-h3-generate-confirm>生成并打开可编辑草稿</button></div>`);
      drawerBody.querySelector('[data-h3-generate-confirm]').addEventListener('click',()=>{storyboardUiState.page=fullModel.generateStoryboardH3Prompt(storyboardUiState.page);closeDrawer();renderLocation();showToast('H3 提示词草稿已生成并通过结构、引用、声音语义和风格校验')});
    }

    function openAssetPreviewDrawer(model, referenceIndex) {
      const asset=fullModel.getStoryboardAssetPreview(model,referenceIndex);
      const versionLine=asset.canUpdateToLatest?`本集固定 ${asset.version} · 素材库最新 ${asset.latestVersion}`:`本集固定 ${asset.version} · 已是最新`;
      const segments=asset.usedInSegments.length?asset.usedInSegments.join('、'):'未在时段提示词中直接提及';

      openDrawer(`${asset.typeLabel} · ${asset.label}`, `<div class="asset-detail-image" style="height:190px;border-radius:12px;background:linear-gradient(145deg,#2a3856,#6c5a84)"></div><div class="feature-line" style="margin-top:12px"><span>类型</span><b>${asset.typeLabel}</b></div><div class="feature-line"><span>本集状态</span><b>${asset.statusLabel}</b></div><div class="feature-line"><span>版本</span><b>${versionLine}</b></div><div class="feature-line"><span>提示词槽位</span><b>${asset.usage}</b></div><div class="feature-line"><span>出现时段</span><b>${segments}</b></div><div class="tool-note" style="margin-top:10px">本镜所有引用都以 ${asset.usage} 形式参与时段提示词、分镜图提示词和 H3 提示词；缺失素材会在生成前检查中阻断提交。</div><div class="mini-actions" style="margin-top:8px">${actionsHtml}</div><div class="drawer-actions"><button class="btn" data-stage-drawer-action="cancel">关闭</button></div>`);
      drawerBody.querySelector('[data-asset-action="update-latest"]')?.addEventListener('click',()=>showToast(`已换绑到 ${asset.latestVersion}；H3 提示词与自动分镜图提示词已标记需要更新`));
      drawerBody.querySelector('[data-asset-action="open-library"]')?.addEventListener('click',()=>{closeDrawer();navigate('project-assets',{projectId:currentLocation().params.projectId})});
    }

    function openImageCandidateDrawer(model, candidateId) {
      const candidate=model.imageCandidates.find(item=>item.id===candidateId);
      if(!candidate){showToast('分镜图候选不存在');return}
      const isCurrent=candidate.isCurrent;
      openDrawer(`分镜图 · ${candidate.label}`, `<div class="asset-detail-image" style="height:220px;border-radius:12px;background:linear-gradient(145deg,#243351,#6a5c95)"></div><div class="feature-line" style="margin-top:12px"><span>状态</span><b>${isCurrent?'当前分镜图':'候选（仅预览，不会自动替换当前图）'}</b></div><div class="feature-line"><span>来源</span><b>${candidate.meta.replace(/ · 当前/g,'')}</b></div><details ${isCurrent?'':'open'} style="margin-top:10px"><summary>本图使用的图片提示词</summary><p>${model.imagePrompt.text}</p></details><div class="drawer-actions"><button class="btn" data-stage-drawer-action="cancel">关闭</button><button class="btn primary" data-adopt-image="${candidate.id}" ${isCurrent?'disabled':''}>${isCurrent?'已是当前分镜图':'设为当前分镜图'}</button></div>`);
      drawerBody.querySelector('[data-adopt-image]')?.addEventListener('click',()=>{storyboardUiState.page=fullModel.adoptStoryboardImageCandidate(storyboardUiState.page,candidateId);closeDrawer();renderLocation();showToast('当前分镜图已更新；H3 提示词需要重新生成，旧视频继续保留')});
    }

    function openVideoHistoryDrawer(model) {

        drawerBody.querySelectorAll('[data-ref-remove]').forEach(button=>button.addEventListener('click',()=>{
          try{drawerModel=fullModel.removeStoryboardShotReference(drawerModel,button.dataset.refRemove);storyboardUiState.page=drawerModel;render();renderLocation();showToast('已移除引用；H3 提示词需要重新编译')}catch(error){showToast(error.message)}
        }));

          try{drawerModel=fullModel.addStoryboardShotReference(drawerModel,button.dataset.refAdd);storyboardUiState.page=drawerModel;render();renderLocation();showToast('已添加引用；H3 提示词需要重新编译')}catch(error){showToast(error.message)}
        }));
      };
      render();

    function openStoryboardCommand(command) {
      const state = currentLocation();
      if (command === 'advanced-canvas') { navigate('canvas', {}, 'restore-context'); return; }
      const stageModel = storyboardUiState.page || fullModel.getStoryboardStageModel(state.params.projectId,state.params.episodeId,state.scenarioId || 'default');
      if (command === 'open-cut') {
        const summary=fullModel.getStoryboardCutEntrySummary(stageModel);
        const rows=summary.groups.map(item=>`<div class="feature-line"><span>${item.label}</span><b>${item.shots.length} 镜${item.shots.length?` · ${item.shots.map(id=>id.replace('shot-','')).join('、')}`:''}</b></div>`).join('');
        openDrawer('进入成片审核', `<div class="tool-note"><b>${summary.adopted}/${summary.total} 镜已采用</b><br>可以提前进入成片页审核已有镜头，但“开始合片”仍会阻止未完成镜头。</div>${rows}<div class="drawer-actions"><button class="btn" data-stage-drawer-action="cancel">留在分镜</button><button class="btn primary" data-story-open-cut-confirm>进入成片审核</button></div>`);
        drawerBody.querySelector('[data-story-open-cut-confirm]').addEventListener('click',()=>{closeDrawer();navigate('studio-cut',state.params)});return;
      }
      if(command==='create-from-script'){
        storyboardUiState.key=null;storyboardUiState.page=null;navigate('studio-storyboard',state.params,'default');showToast('已从已确认剧本创建 9 个分镜草稿');return;
      }
      if (command === 'reextract') { openStoryboardReextractDrawer(stageModel); return; }
      if (command === 'import') { openStoryboardImportDrawer(stageModel); return; }
      if (command === 'assets') { openReferenceManagerDrawer(stageModel); return; }
      if (command === 'generate-h3') { openH3PromptDrawer(stageModel); return; }
      if (command === 'generate-image') {
        const resolvedChannel=fullModel.resolveDefaultImageChannel({globalDefault:'chatgpt_web'});
