    <style>
      .f{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#202938}.muted{fill:#738095}.white{fill:#fff}.primary{fill:#4f46e5}.primaryText{fill:#4f46e5}.green{fill:#ecfdf5;stroke:#a7f3d0}.soft{fill:#f7f8fc;stroke:#e0e5ed}.pill{fill:#eef2ff;stroke:#c7d2fe}
      .t26{font-size:26px;font-weight:700}.t21{font-size:21px;font-weight:700}.t18{font-size:18px;font-weight:650}.t15{font-size:15px}.t13{font-size:13px}.t12{font-size:12px}.t11{font-size:11px}.card{fill:#fff;stroke:#e1e6ee;stroke-width:1}
    </style>
