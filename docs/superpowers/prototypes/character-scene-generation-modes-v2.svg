    <linearGradient id="photo1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#203448"/><stop offset="1" stop-color="#71879b"/></linearGradient>
    <linearGradient id="photo2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3b2f35"/><stop offset="1" stop-color="#9b7b78"/></linearGradient>
    <linearGradient id="scene" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3f332b"/><stop offset=".55" stop-color="#8a7359"/><stop offset="1" stop-color="#1f2937"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#111827" flood-opacity=".11"/></filter>
    <style>
      .f{font-family:Microsoft YaHei,Segoe UI,sans-serif;fill:#202938}.muted{fill:#758195}.white{fill:#fff}.primary{fill:#4f46e5}.primaryText{fill:#4f46e5}
      .t26{font-size:26px;font-weight:700}.t20{font-size:20px;font-weight:700}.t17{font-size:17px;font-weight:600}.t15{font-size:15px}.t13{font-size:13px}.t12{font-size:12px}
      .card{fill:#fff;stroke:#e1e6ee;stroke-width:1}.soft{fill:#f7f8fc;stroke:#e3e7ee}.pill{fill:#eef2ff;stroke:#c7d2fe}.green{fill:#ecfdf5;stroke:#a7f3d0}.orange{fill:#fff7ed;stroke:#fed7aa}
    </style>
