<style>
  .bg-block { border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
  .grp { margin-bottom: 14px; }
  .grp-t { font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .4px; margin-bottom: 7px; }
  .ref-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; background: var(--panel2); }
  .ref-row .avatar { width: 28px; height: 28px; font-size: 12px; }
  .ref-row .mini { width: 28px; height: 28px; border-radius: 6px; }
  .ref-row b { font-size: 12.5px; font-weight: 500; }
  .ref-row .v { font-size: 11px; color: var(--muted); }
  .ref-row .rm { margin-left: auto; }
  .locked { opacity: .8; }
</style>
<!-- 背景：分镜页（简化示意） -->
<div class="app">
  <aside class="rail">
    <div class="logo">剧</div>
    <div class="rail-btn active"><svg><use href="#i-grid"/></svg></div>
    <div class="rail-btn"><svg><use href="#i-box"/></svg></div>
    <div class="rail-btn"><svg><use href="#i-tasks"/></svg></div>
    <div class="rail-spacer"></div>
    <div class="rail-btn"><svg><use href="#i-spark"/></svg></div>
    <div class="rail-btn"><svg><use href="#i-gear"/></svg></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="crumb"><button class="icon-btn"><svg><use href="#i-back"/></svg></button><span class="proj">青城夜巡人</span><span class="muted">/</span><span class="ep">第 3 集 · 雨夜铜铃</span></div>
      <div class="spacer"></div>
    </header>
    <nav class="stagenav">
      <div class="stage-item"><span class="stage-idx">1</span><span class="stage-name">剧本</span></div>
      <div class="stage-item"><span class="stage-idx">2</span><span class="stage-name">设定</span></div>
      <div class="stage-item active"><span class="stage-idx">3</span><span class="stage-name">分镜</span></div>
      <div class="stage-item"><span class="stage-idx">4</span><span class="stage-name">成片</span></div>
    </nav>
    <div style="flex:1; display:flex; gap:12px; padding:14px 16px">
      <div class="bg-block" style="width:260px"></div>
      <div style="flex:1; display:flex; flex-direction:column; gap:12px">
        <div class="bg-block" style="height:110px"></div>
        <div class="bg-block" style="height:110px"></div>
        <div class="bg-block" style="height:110px"></div>
      </div>
      <div class="bg-block" style="width:330px"></div>
    </div>
  </div>
</div>

<!-- 遮罩 + 管理镜头引用 Drawer -->
<div class="scrim" style="z-index:80"></div>
<aside class="drawer narrow" style="z-index:90; width:440px">
  <div class="drawer-h">
    <h3>管理镜头引用 <span class="muted" style="font-weight:400; font-size:12px">· 分镜 05</span></h3>
    <button class="icon-btn"><svg><use href="#i-close"/></svg></button>
  </div>
  <div class="drawer-b" style="overflow:hidden">

    <div class="grp">
      <div class="grp-t">出场角色</div>
      <div class="ref-row"><span class="avatar">林</span><div><b>林夏</b> <span class="v">· 夜巡制服 v3 · @图片1</span></div><button class="icon-btn rm" title="移除" style="color:var(--danger)"><svg><use href="#i-close"/></svg></button></div>
      <div class="ref-row"><span class="avatar b">沈</span><div><b>沈默</b> <span class="v">· 便装 v2 · 本镜剪影出场，未作为生成引用</span></div></div>
      <button class="btn ghost sm" style="width:100%; border:1px dashed var(--line-strong)"><svg><use href="#i-plus"/></svg>从项目素材添加</button>
    </div>

    <div class="grp">
      <div class="grp-t">分镜场景</div>
      <div class="ref-row locked"><span class="mini ph f"></span><div><b>青石巷 · 夜</b> <span class="v">· v2 · @图片2</span></div><span class="badge outline rm">本镜场景 · 不可移除</span></div>
      <button class="btn ghost sm" style="width:100%; border:1px dashed var(--line-strong)"><svg><use href="#i-plus"/></svg>从项目素材添加</button>
    </div>

    <div class="grp">
      <div class="grp-t">场景道具</div>
      <div class="ref-row"><span class="mini ph c"></span><div><b>巡夜灯</b> <span class="v">· v1 · @图片3</span></div><button class="icon-btn rm" title="移除" style="color:var(--danger)"><svg><use href="#i-close"/></svg></button></div>
      <button class="btn ghost sm" style="width:100%; border:1px dashed var(--line-strong)"><svg><use href="#i-plus"/></svg>从项目素材添加</button>
    </div>

    <div class="card pad" style="display:flex; gap:9px; padding:11px 12px; border-color:rgba(88,166,255,.3); margin-top:4px">
      <svg style="width:14px;height:14px;color:var(--info);flex:0 0 auto;margin-top:2px"><use href="#i-shield"/></svg>
      <span class="xs" style="color:var(--info); line-height:1.6">增删会即时重排中栏引用 chips 的 @槽位顺序，并令 H3 提示词标记「引用已变化」，需重新编译后再生成。</span>
    </div>
  </div>
  <div class="drawer-f">
    <span class="xs muted">已在本镜的素材不会重复出现在添加列表</span>
    <div class="spacer"></div>
    <button class="btn primary">完成</button>
  </div>
</aside>
