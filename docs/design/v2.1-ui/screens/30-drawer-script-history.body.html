<style>
  .sc-wrap { border-radius: 10px; background: var(--panel); border: 1px solid var(--line); padding: 22px 40px; }
  .skl { height: 9px; background: var(--panel2); border-radius: 5px; margin-bottom: 9px; }
  .v-row { display: flex; align-items: flex-start; gap: 12px; padding: 13px 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 9px; background: var(--panel2); }
  .v-row.cur { border-color: var(--accent); background: var(--accent-subtle); }
  .v-row .vn { font-size: 14px; font-weight: 700; width: 34px; }
  .v-row .vm { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.6; }
  .v-row .acts { margin-left: auto; display: flex; flex-direction: column; gap: 5px; }
</style>
<!-- 背景：剧本页（简化示意） -->
<div class="app">
  <aside class="rail">
    <div class="logo">剧</div>
    <div class="rail-btn active"><svg><use href="#i-grid"/></svg></div>
    <div class="rail-btn"><svg><use href="#i-box"/></svg></div>
    <div class="rail-btn"><svg><use href="#i-tasks"/></svg></div>
    <div class="rail-spacer"></div>
    <div class="rail-btn"><svg><use href="#i-spark"/></svg></div>
    <div class="rail-btn"><svg><use href="#i-gear"/></svg></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="crumb"><button class="icon-btn"><svg><use href="#i-back"/></svg></button><span class="proj">青城夜巡人</span><span class="muted">/</span><span class="ep">第 3 集 · 雨夜铜铃</span></div>
      <div class="spacer"></div>
    </header>
    <nav class="stagenav">
      <div class="stage-item active"><span class="stage-idx">1</span><span class="stage-name">剧本</span></div>
      <div class="stage-item"><span class="stage-idx">2</span><span class="stage-name">设定</span></div>
      <div class="stage-item"><span class="stage-idx">3</span><span class="stage-name">分镜</span></div>
      <div class="stage-item"><span class="stage-idx">4</span><span class="stage-name">成片</span></div>
    </nav>
    <div style="flex:1; display:flex; gap:12px; padding:14px 16px">
      <div style="width:230px; border-radius:10px; background:var(--panel); border:1px solid var(--line)"></div>
      <div class="grow sc-wrap">
        <div class="skl" style="width:42%"></div>
        <div class="skl"></div><div class="skl" style="width:88%"></div><div class="skl" style="width:70%"></div>
      </div>
      <div style="width:300px; border-radius:10px; background:var(--panel); border:1px solid var(--line)"></div>
    </div>
  </div>
</div>

<!-- 遮罩 + 历史版本 Drawer -->
<div class="scrim" style="z-index:80"></div>
<aside class="drawer narrow" style="z-index:90; width:440px">
  <div class="drawer-h">
    <h3>历史版本 <span class="muted" style="font-weight:400; font-size:12px">· 第 3 集 · 剧本</span></h3>
    <button class="icon-btn"><svg><use href="#i-close"/></svg></button>
  </div>
  <div class="drawer-b" style="overflow:hidden">
    <div class="v-row cur">
      <span class="vn">v3</span>
      <div><b style="font-size:13px">当前草稿</b><div class="vm">4 场次 · 2,340 字 · 自动保存于 14:32<br>编辑中 · 未确认</div></div>
      <div class="acts"><span class="badge accent">编辑中</span></div>
    </div>
    <div class="v-row">
      <span class="vn">v2</span>
      <div><b style="font-size:13px">已确认版本</b><div class="vm">4 场次 · 2,286 字 · 09-09 18:20 确认<br>确认人 local-user · 下游 9 镜基于此版本</div></div>
      <div class="acts">
        <button class="btn sm ghost" style="border:1px solid var(--line)">比较差异</button>
        <button class="btn sm">从此派生</button>
      </div>
    </div>
    <div class="v-row" style="opacity:.8">
      <span class="vn">v1</span>
      <div><b style="font-size:13px">已确认版本</b><div class="vm">4 场次 · 2,102 字 · 09-08 11:04 确认<br>已被 v2 取代 · 外部 AI 导入来源</div></div>
      <div class="acts">
        <button class="btn sm ghost" style="border:1px solid var(--line)">查看</button>
        <button class="btn sm ghost" style="border:1px solid var(--line)">从此派生</button>
      </div>
    </div>
    <div class="card pad" style="display:flex; gap:9px; padding:11px 12px; border-color:rgba(88,166,255,.3)">
      <svg style="width:14px;height:14px;color:var(--info);flex:0 0 auto;margin-top:2px"><use href="#i-shield"/></svg>
      <span class="xs" style="color:var(--info); line-height:1.6">「从此派生」会把该版本内容复制为新草稿，不覆盖任何已有版本，也不会改动已确认的 v2。</span>
    </div>
  </div>
  <div class="drawer-f">
    <span class="muted xs">版本由确认与导入动作创建</span>
    <div class="spacer"></div>
    <button class="btn primary" disabled>确认新版本</button>
  </div>
</aside>
